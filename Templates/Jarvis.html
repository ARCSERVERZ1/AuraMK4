        // 3: Precision node-capped segmented brackets
        {
          radiusFactor: 0.426, angle: 0.7, speed: 0.68, direction: -1,
          thickness: 1.85, opacity: 0.84, role: 'core', glowRole: 'secondary',
          type: 'nodeSegments',
          segments: [
            { start: 0.0, len: 0.95 }, { start: Math.PI, len: 0.95 },
            { start: 1.65, len: 0.42 }, { start: Math.PI + 1.65, len: 0.42 }
          ]
        },
        // 4: Reactive circular radial frequency equalizer ring
        {
          radiusFactor: 0.486, angle: 0.0, speed: 0.16, direction: 1,
          thickness: 1.85, opacity: 0.82, role: 'secondary', glowRole: 'primary',
          type: 'equalizer', tickCount: 72
        },
        // 5: Mid-outer heavy asymmetric neon arcs
        {
          radiusFactor: 0.554, angle: 3.8, speed: 0.3, direction: -1,
          thickness: 5.1, opacity: 0.88, role: 'primary', glowRole: 'secondary',
          type: 'heavySegments',
          segments: [
            { start: 0.3, len: 1.95 }, { start: 3.1, len: 1.45 }, { start: 5.05, len: 0.65 }
          ]
        },
        // 6: Orbital data rail with travelling luminous energy packets
        {
          radiusFactor: 0.62, angle: 1.9, speed: 0.48, direction: 1,
          thickness: 1.45, opacity: 0.68, role: 'core', glowRole: 'primary',
          type: 'orbitalRail',
          segments: [
            { start: 0.0, len: 2.1 }, { start: 2.6, len: 1.2 }, { start: 4.3, len: 1.55 }
          ],
          packets: 5
        },
        // 7: Wide outer node-capped segmented ring
        {
          radiusFactor: 0.692, angle: 5.1, speed: 0.22, direction: -1,
          thickness: 3.0, opacity: 0.8, role: 'primary', glowRole: 'primary',
          type: 'nodeSegments',
          segments: [
            { start: 0.2, len: 1.35 }, { start: 2.1, len: 1.75 }, { start: 4.45, len: 1.15 }
          ]
        },
        // 8: Outer fine calibration dashed track
        {
          radiusFactor: 0.752, angle: 0.4, speed: 0.12, direction: 1,
          thickness: 1.2, opacity: 0.5, role: 'secondary', glowRole: 'primary',
          type: 'dashed', dashCount: 96, dashRatio: 0.28
        }
      ];

      // Prominent Outer Half-Circle (~190 degrees)
      const outerHalfCircle = {
        baseAngle: -Math.PI * 0.5,
        currentAngle: -Math.PI * 0.5,
        arcSpan: (190 * Math.PI) / 180, // ~190 degrees embracing the rings
        radiusFactor: 0.862,
        scanPhase: 0,
        radarAngle: -Math.PI * 0.5
      };

      // --------------------------------------------------------------------------
      // HELPER: MULTI-PASS ADDITIVE NEON ARC DRAWING
      // --------------------------------------------------------------------------
      function drawNeonArc(x, y, radius, startA, endA, lineWidth, coreCol, glowCol, alpha, glowScale = 1, lumOverride = null) {
        if (radius <= 0 || alpha <= 0.004) return;
        const lum = lumOverride !== null ? lumOverride : cur.luminance;

        ctx.save();
        ctx.lineCap = 'round';

        if (lum < 0.06) {
          // Dead unlit dark charcoal/cold-metal outline
          ctx.globalCompositeOperation = 'source-over';
          ctx.beginPath();
          ctx.arc(x, y, radius, startA, endA);
          ctx.strokeStyle = rgba(DEAD_METAL, Math.min(0.75, alpha * 0.85));
          ctx.lineWidth = Math.max(1, lineWidth * 0.88);
          ctx.stroke();
          ctx.restore();
          return;
        }

        ctx.globalCompositeOperation = 'lighter';
        const m = cur.muteFactor;

        // Pass 1: Wide soft bloom
        ctx.beginPath();
        ctx.arc(x, y, radius, startA, endA);
        ctx.strokeStyle = rgba(glowCol, alpha * 0.16 * glowScale * lum, m);
        ctx.lineWidth = lineWidth * 4.2;
        ctx.stroke();

        // Pass 2: Mid intense halo
        ctx.beginPath();
        ctx.arc(x, y, radius, startA, endA);
        ctx.strokeStyle = rgba(glowCol, alpha * 0.35 * glowScale * lum, m);
        ctx.lineWidth = lineWidth * 2.05;
        ctx.stroke();

        // Pass 3: Crisp luminous filament
        ctx.beginPath();
        ctx.arc(x, y, radius, startA, endA);
        ctx.strokeStyle = rgba(coreCol, alpha * Math.min(1.15, lum + 0.14), m * 0.85);
        ctx.lineWidth = lineWidth;
        ctx.stroke();

        ctx.restore();
      }

      // --------------------------------------------------------------------------
      // SIGNAL ENVELOPE GENERATORS (LISTENING, SPEAKING, THINK MED)
      // --------------------------------------------------------------------------
      function updateEnvelopes(dt, t) {
        // 1. Realistic multi-syllable speech cadence with natural micro-pauses
        speechBurstTimer -= dt;
        if (speechBurstTimer <= 0) {
          if (speechInPhrase && Math.random() < 0.25) {
            speechInPhrase = false;
            speechBurstTimer = 0.22 + Math.random() * 0.36;
            speechTarget = 0.05;
          } else {
            speechInPhrase = true;
            speechBurstTimer = 0.09 + Math.random() * 0.18;
            speechTarget = 0.36 + Math.random() * 0.64;
          }
        }
        const syllableWave = speechInPhrase
          ? (0.56 + 0.44 * Math.sin(t * 20.0 + Math.sin(t * 5.8) * 2.2))
          : 0.12;
        speechEnv = lerp(speechEnv, speechTarget * syllableWave, Math.min(1, dt * 15));

        // Emit outward vocal soundwave ripples cleanly on speech syllable peaks
        vocalRippleCooldown -= dt;
        if (
          cur.speakingMode > 0.35 &&
          cur.luminance > 0.2 &&
          speechEnv > 0.56 &&
          prevSpeechEnv <= 0.56 &&
          vocalRippleCooldown <= 0 &&
          vocalRipples.length < 7
        ) {
          vocalRippleCooldown = 0.18;
          vocalRipples.push({
            progress: 0,
            speed: 0.74 + speechEnv * 0.38,
            strength: 0.55 + speechEnv * 0.45,
            thickness: 1.8 + speechEnv * 1.9
          });
        }
        prevSpeechEnv = speechEnv;

        // 2. Measured analytical elastic pulse for THINK MED (0.84x -> 1.26x orb scale)
        // Smooth compound cosine wave giving a deep, organic, deliberate breathing-pulse rhythm
        const rawThinkWave = 0.5 + 0.5 * Math.sin(t * 2.45 - Math.PI * 0.5 + Math.sin(t * 1.225) * 0.28);
        thinkPulseValue = Math.pow(rawThinkWave, 1.15);

        // Emit measured thinking ripple rings cleanly on peaks of THINK MED
        if (
          cur.thinkMedMode > 0.45 &&
          cur.luminance > 0.2 &&
          thinkPulseValue > 0.88 &&
          prevThinkPulseValue <= 0.88 &&
          thinkRipples.length < 5
        ) {
          thinkRipples.push({
            progress: 0,
            speed: 0.58,
            alpha: 0.72,
            thickness: 2.5
          });
        }
        prevThinkPulseValue = thinkPulseValue;

        // Push into sympathetic circular lag buffers
        lagHead = (lagHead + 1) % LAG_LEN;
        speakLagBuf[lagHead] = speechEnv;
        thinkLagBuf[lagHead] = thinkPulseValue;
      }

      function getLag(buf, framesBack) {
        const idx = (lagHead - framesBack + LAG_LEN) % LAG_LEN;
        return buf[idx];
      }

      function getListeningLevel(t) {
        const burst = Math.max(0, Math.sin(t * 2.05) * Math.sin(t * 5.6 + 0.7));
        return clamp(0.24 + 0.18 * Math.sin(t * 8.2) + burst * 0.56, 0.08, 0.96);
      }

      // --------------------------------------------------------------------------
      // PROCEDURAL SYNAPTIC LIGHTNING ARCS (THINK HARD)
      // --------------------------------------------------------------------------
      function spawnLightningBolt(coreX, coreY, coreR) {
        const insideOrb = Math.random() < 0.42;
        const startA = Math.random() * Math.PI * 2;
        const endA = startA + (Math.random() - 0.5) * 1.45;
        const r1 = insideOrb ? coreR * (0.14 + Math.random() * 0.34) : coreR * 0.94;
        const r2 = insideOrb ? coreR * 0.96 : baseRadius * (0.36 + Math.random() * 0.34);

        const x1 = coreX + Math.cos(startA) * r1;
        const y1 = coreY + Math.sin(startA) * r1;
        const x2 = coreX + Math.cos(endA) * r2;
        const y2 = coreY + Math.sin(endA) * r2;

        const segs = 7;
        const pts = [{ x: x1, y: y1 }];
        for (let i = 1; i < segs; i++) {
          const f = i / segs;
          const jitter = (insideOrb ? coreR * 0.22 : baseRadius * 0.06) * (1 - Math.abs(f - 0.5));
          pts.push({
            x: lerp(x1, x2, f) + (Math.random() - 0.5) * jitter * 2,
            y: lerp(y1, y2, f) + (Math.random() - 0.5) * jitter * 2
          });
        }
        pts.push({ x: x2, y: y2 });

        lightningBolts.push({
          pts,
          life: 0.08 + Math.random() * 0.14,
          maxLife: 0.22
        });
      }

      function renderLightningBolts(dt) {
        if (lightningBolts.length === 0) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = lightningBolts.length - 1; i >= 0; i--) {
          const b = lightningBolts[i];
          b.life -= dt;
          if (b.life <= 0) {
            lightningBolts.splice(i, 1);
            continue;
          }
          const alpha = clamp(b.life / b.maxLife, 0, 1);

          ctx.beginPath();
          ctx.moveTo(b.pts[0].x, b.pts[0].y);
          for (let k = 1; k < b.pts.length; k++) ctx.lineTo(b.pts[k].x, b.pts[k].y);

          // Colored outer electric bloom
          ctx.strokeStyle = rgba(liveColor.primary, alpha * 0.5);
          ctx.lineWidth = 4.5;
          ctx.stroke();

          // Secondary bright glow
          ctx.strokeStyle = rgba(liveColor.secondary, alpha * 0.72);
          ctx.lineWidth = 2.4;
          ctx.stroke();

          // White-hot electric core
          ctx.strokeStyle = rgba(liveColor.core, alpha * 0.98);
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        ctx.restore();
      }

      // --------------------------------------------------------------------------
      // CANVAS RESIZING (FULL-SCREEN HIDPI)
      // --------------------------------------------------------------------------
      function resizeCanvas() {
        try {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;

          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          cx = width * 0.5;
          // Center slightly above vertical midpoint when dock is visible for balanced composition
          cy = height * (dockVisible ? (height < 640 ? 0.43 : 0.46) : 0.5);

          const availH = dockVisible ? height - 130 : height - 24;
          const minDim = Math.min(width - 24, Math.max(240, availH));
          baseRadius = clamp(minDim * 0.475, 118, Math.min(width, height) * 0.45);
        } catch (err) {
          console.error('Resize error:', err);
        }
      }

      // --------------------------------------------------------------------------
      // LAYER 1: OBSIDIAN BACKDROP, AMBIENT GLOW & FLOATING DUST
      // --------------------------------------------------------------------------
      function renderBackground(t, totalEnergy, lum) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#030306';
        ctx.fillRect(0, 0, width, height);

        // Soft radial ambient glow tinted by active palette
        const glowR = baseRadius * (1.38 + totalEnergy * 0.25);
        const bgGrad = ctx.createRadialGradient(cx, cy, baseRadius * 0.04, cx, cy, glowR);
        const m = cur.muteFactor;
        bgGrad.addColorStop(0, rgba(liveColor.primary, (0.16 + totalEnergy * 0.1) * lum, m));
        bgGrad.addColorStop(0.38, rgba(liveColor.deep, (0.2 + totalEnergy * 0.08) * lum, m));
        bgGrad.addColorStop(0.75, rgba(liveColor.deep, 0.04 * lum, m));
        bgGrad.addColorStop(1, 'rgba(3,3,6,0)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // Floating ambient holographic particles (sparse in Idle, none in Dead)
        if (lum > 0.05 && cur.particleRatio > 0.02) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const count = Math.floor(AMBIENT_PARTICLE_COUNT * clamp(cur.particleRatio, 0, 1));
          for (let i = 0; i < count; i++) {
            const p = ambientParticles[i];
            const a = p.angle + t * p.speed * (0.25 + cur.speedMult * 0.65 + pulseImpulse * 2.2);
            const r = baseRadius * p.distFactor;
            const px = cx + Math.cos(a) * r + pointer.smoothX * 14 * p.distFactor;
            const py = cy + Math.sin(a) * r + pointer.smoothY * 14 * p.distFactor;
            const twinkle = 0.5 + 0.5 * Math.sin(t * 2.1 + p.twinklePhase);

            ctx.fillStyle = rgba(liveColor.secondary, p.alpha * twinkle * lum * (0.65 + totalEnergy * 0.45), m);
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // --------------------------------------------------------------------------
      // LAYER 2: PROMINENT ~190-DEGREE OUTER HALF-CIRCLE
      //          Includes calibrated degree ticks, glowing end brackets,
      //          travelling scanner bead, Listening radar cone, and Speaking wave.
      // --------------------------------------------------------------------------
      function renderOuterHalfCircle(t, dt, listeningLevel, lum, wakeOuterProgress) {
        const scaleRatio = baseRadius / 260;
        const thinkLag = getLag(thinkLagBuf, 18) * cur.thinkMedMode;
        const speakLag = getLag(speakLagBuf, 14) * cur.speakingMode;

        const breath =
          Math.sin(t * 1.15) * cur.outerBreathAmp +
          pulseImpulse * 0.028 +
          (thinkLag - 0.4) * 0.032 +
          speakLag * 0.024;
        const radius = baseRadius * outerHalfCircle.radiusFactor * (1 + breath);

        if (currentStateKey === 'think_hard') {
          outerHalfCircle.baseAngle += dt * 0.25;
        } else if (currentStateKey === 'think_med') {
          outerHalfCircle.baseAngle += dt * 0.09;
        } else if (currentStateKey !== 'dead') {
          outerHalfCircle.baseAngle = lerp(outerHalfCircle.baseAngle, -Math.PI * 0.5, dt * 1.1);
        }

        const sway = Math.sin(t * 0.55) * cur.outerSwayAmp;
        outerHalfCircle.currentAngle = outerHalfCircle.baseAngle + sway;

        const halfSpan = outerHalfCircle.arcSpan * 0.5 * wakeOuterProgress;
        const startA = outerHalfCircle.currentAngle - halfSpan;
        const endA = outerHalfCircle.currentAngle + halfSpan;

        // Subtle micro-vibration during Think Hard
        const vibX = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 1.8 * cur.vibrationAmp : 0;
        const vibY = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 1.8 * cur.vibrationAmp : 0;
        const ox = cx + vibX;
        const oy = cy + vibY;

        // A. Faint architectural guide circle
        ctx.save();
        ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
        ctx.strokeStyle = lum > 0.06
          ? rgba(liveColor.primary, (0.075 + pulseImpulse * 0.05) * lum, cur.muteFactor)
          : rgba(DEAD_METAL, 0.24);
        ctx.lineWidth = Math.max(1, 1.05 * scaleRatio);
        ctx.beginPath();
        ctx.arc(ox, oy, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // B. Sweeping Translucent Radar Detection Cone inside Outer Half-Circle (LISTENING)
        if (cur.listeningMode > 0.04 && lum > 0.18 && halfSpan > 0.1) {
          const lm = cur.listeningMode * Math.min(1, lum);
          const sweepOsc = Math.sin(t * 1.48) * (halfSpan * 0.76);
          outerHalfCircle.radarAngle = outerHalfCircle.currentAngle + sweepOsc;
          const coneSpread = 0.27 + listeningLevel * 0.14;

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const coneGrad = ctx.createRadialGradient(ox, oy, baseRadius * 0.2, ox, oy, radius);
          coneGrad.addColorStop(0, rgba(liveColor.core, 0.02 * lm));
          coneGrad.addColorStop(0.62, rgba(liveColor.secondary, (0.1 + listeningLevel * 0.12) * lm));
          coneGrad.addColorStop(1, rgba(liveColor.core, (0.22 + listeningLevel * 0.14) * lm));

          ctx.fillStyle = coneGrad;
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.arc(ox, oy, radius * 0.99, outerHalfCircle.radarAngle - coneSpread, outerHalfCircle.radarAngle + coneSpread);
          ctx.closePath();
          ctx.fill();

          // Leading radar beam line
          ctx.strokeStyle = rgba(liveColor.core, (0.48 + listeningLevel * 0.4) * lm);
          ctx.lineWidth = Math.max(1.2, 1.6 * scaleRatio);
          ctx.beginPath();
          ctx.moveTo(ox + Math.cos(outerHalfCircle.radarAngle) * baseRadius * 0.28, oy + Math.sin(outerHalfCircle.radarAngle) * baseRadius * 0.28);
          ctx.lineTo(ox + Math.cos(outerHalfCircle.radarAngle) * radius, oy + Math.sin(outerHalfCircle.radarAngle) * radius);
          ctx.stroke();
          ctx.restore();
        }

        if (halfSpan <= 0.01) return;

        // C. Primary Prominent Glowing Outer Half-Circle Arc
        const primaryWidth = Math.max(3.8, 6.2 * scaleRatio);
        drawNeonArc(
          ox, oy, radius, startA, endA,
          primaryWidth, liveColor.primary, liveColor.primary,
          0.95, 1.15 + pulseImpulse * 0.65
        );

        // Hot luminous inner core filament along the half-circle
        if (lum > 0.06) {
          drawNeonArc(
            ox, oy, radius, startA + 0.02, endA - 0.02,
            Math.max(1.4, 2.2 * scaleRatio),
            liveColor.core, liveColor.secondary,
            0.9, 0.85
          );
        }

        // Companion fine inner semi-circular accent track
        const innerCompanionR = radius - Math.max(9, 14 * scaleRatio);
        drawNeonArc(
          ox, oy, innerCompanionR, startA + 0.07, endA - 0.07,
          Math.max(1.0, 1.35 * scaleRatio),
          liveColor.secondary, liveColor.primary,
          0.6, 0.72
        );

        // D. Flowing Multi-Harmonic Curved Vocal Oscilloscope Wave riding along Outer Half-Circle (SPEAKING)
        if (cur.speakingMode > 0.04 && lum > 0.15) {
          const sm = cur.speakingMode * Math.min(1, lum);
          const samples = 96;
          const waveSpanStart = startA + 0.08;
          const waveSpanEnd = endA - 0.08;

          // Draw 2 layered harmonic vocal waveforms riding cleanly along the outer half-circle
          for (let layerIdx = 0; layerIdx < 2; layerIdx++) {
            const isPrimaryWave = layerIdx === 0;
            const freqScale = isPrimaryWave ? 1.0 : 1.65;
            const ampScale = isPrimaryWave ? 1.0 : 0.56;
            const phaseShift = isPrimaryWave ? 0 : 1.8;

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();

            for (let s = 0; s <= samples; s++) {
              const frac = s / samples;
              const ang = lerp(waveSpanStart, waveSpanEnd, frac);
              const envWindow = Math.pow(Math.sin(frac * Math.PI), 0.85);

              const harm =
                Math.sin(frac * 22 * freqScale - t * 13.5 + phaseShift) * 0.52 +
                Math.sin(frac * 44 * freqScale + t * 21.0 - phaseShift) * 0.30 +
                Math.cos(frac * 12 * freqScale - t * 8.2) * 0.24;

              const amp = (0.16 + speechEnv * 0.95) * ampScale * envWindow;
              const rr = radius + harm * amp * baseRadius * 0.068;
              const wx = ox + Math.cos(ang) * rr;
              const wy = oy + Math.sin(ang) * rr;
              if (s === 0) ctx.moveTo(wx, wy);
              else ctx.lineTo(wx, wy);
            }

            // Soft vocal aura pass
            ctx.strokeStyle = rgba(isPrimaryWave ? liveColor.primary : liveColor.secondary, (isPrimaryWave ? 0.38 : 0.24) * sm);
            ctx.lineWidth = Math.max(3.0, (isPrimaryWave ? 5.2 : 3.4) * scaleRatio);
            ctx.stroke();

            // Crisp luminous harmonic filament
            ctx.strokeStyle = rgba(isPrimaryWave ? liveColor.core : liveColor.secondary, (isPrimaryWave ? 0.95 : 0.68) * sm);
            ctx.lineWidth = Math.max(1.2, (isPrimaryWave ? 1.9 : 1.25) * scaleRatio);
            ctx.stroke();
            ctx.restore();
          }
        }

        // E. Travelling Light Scanner Bead along the Outer Half-Circle
        if (lum > 0.1) {
          outerHalfCircle.scanPhase = (outerHalfCircle.scanPhase + dt * (cur.scanSpeed + pulseImpulse * 1.4)) % 2;
          let pingPong = outerHalfCircle.scanPhase <= 1 ? outerHalfCircle.scanPhase : 2 - outerHalfCircle.scanPhase;
          if (cur.thinkHardMode > 0.3) {
            pingPong = clamp(pingPong + (Math.random() - 0.5) * 0.095 * cur.thinkHardMode, 0.04, 0.96);
          }
          const scanCenter = lerp(startA + 0.09, endA - 0.09, pingPong);
          const scanHalf = 0.09 + cur.thinkHardMode * 0.07;

          drawNeonArc(
            ox, oy, radius, scanCenter - scanHalf, scanCenter + scanHalf,
            primaryWidth * 0.65, liveColor.core, liveColor.secondary,
            0.9 * Math.min(1, lum), 1.35
          );

          // Glowing luminous scanner bead point
          const bx = ox + Math.cos(scanCenter) * radius;
          const by = oy + Math.sin(scanCenter) * radius;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const beadR = Math.max(5, 9 * scaleRatio);
          const bGrad = ctx.createRadialGradient(bx, by, 0, bx, by, beadR);
          bGrad.addColorStop(0, rgba(liveColor.core, 0.98 * Math.min(1, lum)));
          bGrad.addColorStop(0.4, rgba(liveColor.secondary, 0.55 * Math.min(1, lum)));
          bGrad.addColorStop(1, rgba(liveColor.primary, 0));
          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.arc(bx, by, beadR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // F. Calibrated Degree Tick Marks (illuminate symmetrically outward during Wake/Init)
        const totalTicks = 50;
        ctx.save();
        ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
        ctx.lineCap = 'round';

        for (let i = 0; i <= totalTicks; i++) {
          const frac = i / totalTicks;
          const ang = startA + frac * (endA - startA);
          const isMajor = i % 5 === 0;
          const isMid = i % 5 === 2 || i % 5 === 3;

          const tickStart = radius + Math.max(4, 6 * scaleRatio);
          const tickLength = isMajor
            ? Math.max(10, 15 * scaleRatio)
            : isMid ? Math.max(5.5, 8.5 * scaleRatio) : Math.max(3.5, 5 * scaleRatio);
          const tickEnd = tickStart + tickLength;

          const cosA = Math.cos(ang), sinA = Math.sin(ang);
          ctx.strokeStyle = lum <= 0.06
            ? rgba(DEAD_METAL, 0.36)
            : rgba(isMajor ? liveColor.core : liveColor.secondary, (isMajor ? 0.85 : isMid ? 0.48 : 0.28) * Math.min(1, lum), cur.muteFactor);
          ctx.lineWidth = isMajor ? Math.max(1.5, 2.0 * scaleRatio) : Math.max(0.9, 1.1 * scaleRatio);

          ctx.beginPath();
          ctx.moveTo(ox + cosA * tickStart, oy + sinA * tickStart);
          ctx.lineTo(ox + cosA * tickEnd, oy + sinA * tickEnd);
          ctx.stroke();
        }

        // G. Glowing Terminal End Brackets
        [startA, endA].forEach((endAng) => {
          const cosE = Math.cos(endAng), sinE = Math.sin(endAng);
          const innerB = radius - Math.max(12, 18 * scaleRatio);
          const outerB = radius + Math.max(14, 21 * scaleRatio);

          ctx.strokeStyle = lum <= 0.06
            ? rgba(DEAD_METAL, 0.5)
            : rgba(liveColor.core, 0.92 * Math.min(1, lum), cur.muteFactor);
          ctx.lineWidth = Math.max(2.0, 2.6 * scaleRatio);
          ctx.beginPath();
          ctx.moveTo(ox + cosE * innerB, oy + sinE * innerB);
          ctx.lineTo(ox + cosE * outerB, oy + sinE * outerB);
          ctx.stroke();

          if (lum > 0.06) {
            ctx.fillStyle = rgba(liveColor.core, 0.95 * Math.min(1, lum), cur.muteFactor * 0.6);
            ctx.beginPath();
            ctx.arc(ox + cosE * radius, oy + sinE * radius, Math.max(2.8, 4.0 * scaleRatio), 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.restore();
      }

      // --------------------------------------------------------------------------
      // LAYER 3: 9 CONCENTRIC COUNTER-ROTATING HOLOGRAPHIC ARCS
      // --------------------------------------------------------------------------
      function renderConcentricArcs(t, dt, listeningLevel, lum) {
        const dynamicSpeedBoost =
          (1 + pulseImpulse * 4.2 + speechEnv * cur.speakingMode * 0.42) *
          (currentStateKey === 'dead' ? 0 : 1);
        const scaleRatio = baseRadius / 260;

        for (let i = 0; i < concentricLayers.length; i++) {
          const layer = concentricLayers[i];

          // Staggered inner-to-outer ring ignition during Wake / Init
          let wakeLayerFactor = 1.0;
          if (wakeSeq.active) {
            const layerStart = 0.58 + i * 0.11;
            wakeLayerFactor = clamp((wakeSeq.elapsed - layerStart) / 0.42, 0, 1);
          }

          const layerLum = lum * wakeLayerFactor;

          // Advance concentric rotation (completely halted in Dead state)
          const hardOddBoost = (cur.thinkHardMode > 0.3 && i % 2 === 0) ? (1 + 0.34 * cur.thinkHardMode) : 1.0;
          const spinVel = layer.direction * layer.speed * cur.speedMult * hardOddBoost * dynamicSpeedBoost * wakeLayerFactor;
          layer.angle += spinVel * dt;

          // Sympathetic elastic flexing:
          // - Think Med: deep resonant harmonic lag rippling outward through inner rings
          // - Speaking: subtle elastic vocal cadence flexing on inner rings
          const lagFrames = Math.min(LAG_LEN - 1, 4 + i * 4);
          const thinkSymp = getLag(thinkLagBuf, lagFrames) * cur.thinkMedMode;
          const speakSymp = getLag(speakLagBuf, Math.min(LAG_LEN - 1, 3 + i * 3)) * cur.speakingMode;

          const thinkFlex = i <= 6 ? (thinkSymp - 0.45) * (0.115 - i * 0.013) : (thinkSymp - 0.45) * 0.025;
          const speakFlex = i <= 5 ? (speakSymp - 0.35) * (0.048 - i * 0.006) : speakSymp * 0.012;

          const layerBreath =
            Math.sin(t * 2.0 + i * 0.85) * 0.007 * Math.min(1, layerLum) +
            pulseImpulse * (0.026 + i * 0.004) +
            thinkFlex +
            speakFlex;

          const r = baseRadius * layer.radiusFactor * cur.arcTightness * (1 + layerBreath);
          const lineW = Math.max(0.9, layer.thickness * scaleRatio);

          // Micro-vibration jitter during Think Hard
          const jx = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.1 * cur.vibrationAmp : 0;
          const jy = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.1 * cur.vibrationAmp : 0;
          const lx = cx + jx;
          const ly = cy + jy;

          const coreCol = liveColor[layer.role];
          const glowCol = liveColor[layer.glowRole];

          const analyticalPulse =
            (cur.thinkMedMode > 0.2 || cur.thinkHardMode > 0.2)
              ? 0.5 + 0.5 * Math.sin(t * (4.2 + cur.thinkHardMode * 5.5) - i * 0.72)
              : 0;
          const glowScale = (1 + pulseImpulse * 0.6 + analyticalPulse * 0.45) * wakeLayerFactor;

          if (layer.type === 'segments' || layer.type === 'heavySegments') {
            for (let s = 0; s < layer.segments.length; s++) {
              const seg = layer.segments[s];
              const a1 = layer.angle + seg.start;
              const a2 = a1 + seg.len;
              drawNeonArc(lx, ly, r, a1, a2, lineW, coreCol, glowCol, layer.opacity, glowScale, layerLum);

              if (layer.type === 'heavySegments' && layerLum > 0.1) {
                drawNeonArc(
                  lx, ly, r, a1 + 0.04, a2 - 0.04,
                  Math.max(0.9, lineW * 0.36),
                  liveColor.core, liveColor.secondary,
                  layer.opacity * 0.76, 0.65, layerLum
                );
              }
            }
          } else if (layer.type === 'nodeSegments') {
            for (let s = 0; s < layer.segments.length; s++) {
              const seg = layer.segments[s];
              const a1 = layer.angle + seg.start;
              const a2 = a1 + seg.len;
              drawNeonArc(lx, ly, r, a1, a2, lineW, coreCol, glowCol, layer.opacity, glowScale, layerLum);

              if (layerLum > 0.08) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = rgba(liveColor.core, layer.opacity * Math.min(1, layerLum), cur.muteFactor * 0.6);
                const nodeR = Math.max(1.8, lineW * 1.42);
                [a1, a2].forEach((ang) => {
                  ctx.beginPath();
                  ctx.arc(lx + Math.cos(ang) * r, ly + Math.sin(ang) * r, nodeR, 0, Math.PI * 2);
                  ctx.fill();
                });
                ctx.restore();
              }
            }
          } else if (layer.type === 'dashed') {
            const step = (Math.PI * 2) / layer.dashCount;
            const dashLen = step * layer.dashRatio;
            ctx.save();
            ctx.globalCompositeOperation = layerLum > 0.06 ? 'lighter' : 'source-over';
            ctx.strokeStyle = layerLum <= 0.06
              ? rgba(DEAD_METAL, 0.3)
              : rgba(coreCol, layer.opacity * Math.min(1, layerLum) * (0.78 + pulseImpulse * 0.3), cur.muteFactor);
            ctx.lineWidth = lineW;
            for (let d = 0; d < layer.dashCount; d++) {
              const a1 = layer.angle + d * step;
              ctx.beginPath();
              ctx.arc(lx, ly, r, a1, a1 + dashLen);
              ctx.stroke();
            }
            ctx.restore();
          } else if (layer.type === 'equalizer') {
            // Circular Radial Frequency Equalizer Ring
            // High-sensitivity in Listening; high-amplitude outward pulsing vocal EQ in Speaking
            const count = layer.tickCount;
            const step = (Math.PI * 2) / count;
            ctx.save();
            ctx.globalCompositeOperation = layerLum > 0.06 ? 'lighter' : 'source-over';
            ctx.lineCap = 'round';

            for (let k = 0; k < count; k++) {
              const ang = layer.angle + k * step;

              // Harmonic multi-band spectrum synthesis
              const listenBand = 0.5 + 0.5 * Math.sin(k * 0.48 + t * 7.6) * Math.cos(k * 0.25 - t * 4.4);
              const speakBand =
                0.42 +
                0.35 * Math.sin(k * 0.35 - t * 13.0) +
                0.23 * Math.cos(k * 0.85 + t * 18.5);

              const binEnergy = lerp(listenBand, clamp(speakBand, 0.05, 1), cur.speakingMode);

              const reactivity =
                cur.listeningMode * (0.48 + listeningLevel * 1.48) +
                cur.speakingMode * (0.45 + speechEnv * 1.95) +
                cur.thinkHardMode * 0.55 +
                cur.thinkMedMode * (0.2 + thinkPulseValue * 0.42) +
                pulseImpulse * 1.25 +
                0.08;

              const barLen = layerLum <= 0.06
                ? baseRadius * 0.008
                : baseRadius * (0.01 + binEnergy * reactivity * 0.058);

              // In Speaking mode, equalizer pulses strongly OUTWARD from the ring
              const inwardShare = lerp(0.32, 0.08, cur.speakingMode);
              const innerR = r - barLen * inwardShare;
              const outerR = r + barLen * (1 - inwardShare);
              const cosA = Math.cos(ang), sinA = Math.sin(ang);

              if (layerLum > 0.06) {
                ctx.strokeStyle = rgba(liveColor.primary, (0.18 + binEnergy * 0.26) * layer.opacity * Math.min(1, layerLum), cur.muteFactor);
                ctx.lineWidth = Math.max(2.0, lineW * 2.05);
                ctx.beginPath();
                ctx.moveTo(lx + cosA * innerR, ly + sinA * innerR);
                ctx.lineTo(lx + cosA * outerR, ly + sinA * outerR);
                ctx.stroke();
              }

              const tipHot = binEnergy > 0.64 && reactivity > 0.55;
              ctx.strokeStyle = layerLum <= 0.06
                ? rgba(DEAD_METAL, 0.32)
                : rgba(tipHot ? liveColor.core : coreCol, Math.min(1, (0.42 + binEnergy * 0.58) * layer.opacity * Math.min(1, layerLum)), cur.muteFactor);
              ctx.lineWidth = Math.max(1.0, lineW * 0.92);
              ctx.beginPath();
              ctx.moveTo(lx + cosA * innerR, ly + sinA * innerR);
              ctx.lineTo(lx + cosA * outerR, ly + sinA * outerR);
              ctx.stroke();
            }
            ctx.restore();
          } else if (layer.type === 'orbitalRail') {
            for (let s = 0; s < layer.segments.length; s++) {
              const seg = layer.segments[s];
              drawNeonArc(
                lx, ly, r,
                layer.angle + seg.start, layer.angle + seg.start + seg.len,
                lineW, coreCol, glowCol, layer.opacity * 0.85, glowScale * 0.85, layerLum
              );
            }

            // Orbiting energy data packets (dense & fast in Think Hard)
            if (layerLum > 0.14) {
              const packetCount = cur.thinkHardMode > 0.4 ? 12 : cur.thinkMedMode > 0.4 ? 7 : layer.packets;
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              for (let p = 0; p < packetCount; p++) {
                const packetAngle = -layer.angle * 1.65 + (p / packetCount) * Math.PI * 2;
                const px = lx + Math.cos(packetAngle) * r;
                const py = ly + Math.sin(packetAngle) * r;

                drawNeonArc(
                  lx, ly, r, packetAngle, packetAngle + 0.15,
                  lineW * 1.45, liveColor.core, liveColor.primary,
                  0.78 * Math.min(1, layerLum), 0.95, layerLum
                );

                ctx.fillStyle = rgba(liveColor.core, 0.95 * Math.min(1, layerLum), cur.muteFactor * 0.5);
                ctx.beginPath();
                ctx.arc(px, py, Math.max(2.0, 2.7 * scaleRatio), 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }
          }
        }
      }

      // --------------------------------------------------------------------------
      // LAYER 4: LISTENING OVERLAY (Inward Sonar Ripples, Focusing Brackets, Curved Oscilloscope)
      // --------------------------------------------------------------------------
      function renderListeningOverlay(t, dt, listeningLevel, lum) {
        const lm = cur.listeningMode;
        if (lm < 0.02 && inwardRipples.length === 0) return;

        const scaleRatio = baseRadius / 260;

        // Spawn inward-collapsing concentric sonar ripples pulling toward the core
        if (lm > 0.3 && lum > 0.2) {
          inwardRippleTimer -= dt * (1 + listeningLevel * 1.55);
          if (inwardRippleTimer <= 0) {
            inwardRippleTimer = 0.44;
            inwardRipples.push({
              progress: 0,
              speed: 0.68 + listeningLevel * 0.42,
              strength: 0.5 + listeningLevel * 0.5
            });
          }
        }

        for (let i = inwardRipples.length - 1; i >= 0; i--) {
          const rip = inwardRipples[i];
          rip.progress += dt * rip.speed;
          if (rip.progress >= 1) {
            inwardRipples.splice(i, 1);
            continue;
          }
          const eased = Math.pow(rip.progress, 1.14);
          const r = baseRadius * lerp(0.84, 0.22, eased);
          const env = Math.sin(rip.progress * Math.PI);
          const alpha = env * rip.strength * Math.max(0.25, lm) * Math.min(1, lum);

          drawNeonArc(
            cx, cy, r, 0, Math.PI * 2,
            Math.max(1.2, (1.4 + (1 - rip.progress) * 1.65) * scaleRatio),
            liveColor.core, liveColor.secondary, alpha, 1.18
          );
        }

        if (lm < 0.04 || lum < 0.15) return;

        // Tightening / focusing glowing corner brackets around the orb
        const tighten = 1 - listeningLevel * 0.095;
        const bracketR = baseRadius * 0.295 * tighten;
        const bracketSpin = Math.sin(t * 0.92) * 0.14;

        for (let q = 0; q < 4; q++) {
          const centerA = bracketSpin + Math.PI * 0.25 + q * (Math.PI * 0.5);
          const span = 0.22 - listeningLevel * 0.04;
          drawNeonArc(
            cx, cy, bracketR, centerA - span, centerA + span,
            Math.max(2.0, 2.8 * scaleRatio),
            liveColor.core, liveColor.secondary,
            0.9 * lm * Math.min(1, lum), 1.22
          );

          const cosC = Math.cos(centerA), sinC = Math.sin(centerA);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = rgba(liveColor.core, 0.85 * lm * Math.min(1, lum));
          ctx.lineWidth = Math.max(1.4, 1.8 * scaleRatio);
          ctx.beginPath();
          ctx.moveTo(cx + cosC * bracketR, cy + sinC * bracketR);
          ctx.lineTo(cx + cosC * (bracketR - 8 * scaleRatio), cy + sinC * (bracketR - 8 * scaleRatio));
          ctx.stroke();
          ctx.restore();
        }

        // Smooth curved live oscilloscope waveform hugging the outer lower arc
        const oscRadius = baseRadius * 0.805;
        const oscStart = Math.PI * 0.13;
        const oscEnd = Math.PI * 0.87;
        const samples = 76;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        for (let s = 0; s <= samples; s++) {
          const frac = s / samples;
          const ang = lerp(oscStart, oscEnd, frac);
          const bell = Math.sin(frac * Math.PI);
          const disp = (
            Math.sin(frac * 26 + t * 14) * 0.52 +
            Math.sin(frac * 50 - t * 21) * 0.32 +
            Math.cos(frac * 14 + t * 9) * 0.24
          ) * listeningLevel;

          const rr = oscRadius + disp * bell * baseRadius * 0.055;
          const ox = cx + Math.cos(ang) * rr;
          const oy = cy + Math.sin(ang) * rr;
          if (s === 0) ctx.moveTo(ox, oy);
          else ctx.lineTo(ox, oy);
        }

        ctx.strokeStyle = rgba(liveColor.primary, 0.38 * lm * Math.min(1, lum));
        ctx.lineWidth = Math.max(3.4, 4.8 * scaleRatio);
        ctx.stroke();

        ctx.strokeStyle = rgba(liveColor.core, 0.94 * lm * Math.min(1, lum));
        ctx.lineWidth = Math.max(1.3, 1.85 * scaleRatio);
        ctx.stroke();
        ctx.restore();
      }

      // --------------------------------------------------------------------------
      // LAYER 5: SPEAKING OVERLAY (Outward Vocal Soundwaves & Layered Harmonic Voice Rings)
      //          + THINK MED Ripples & Radial Impulse Shockwaves
      // --------------------------------------------------------------------------
      function renderWaveOverlays(t, dt, lum) {
        const scaleRatio = baseRadius / 260;

        // A. Outward-Radiating Vocal Soundwave Ripples (SPEAKING)
        for (let i = vocalRipples.length - 1; i >= 0; i--) {
          const vr = vocalRipples[i];
          vr.progress += dt * vr.speed;
          if (vr.progress >= 1) {
            vocalRipples.splice(i, 1);
            continue;
          }
          const eased = 1 - Math.pow(1 - vr.progress, 2.2);
          const r = baseRadius * lerp(0.22, 0.88, eased);
          const fade = Math.sin(Math.min(1, vr.progress * 1.15) * Math.PI) * (1 - vr.progress * 0.55);
          const alpha = clamp(fade * vr.strength * Math.min(1, lum), 0, 0.95);

          drawNeonArc(
            cx, cy, r, 0, Math.PI * 2,
            Math.max(1.1, vr.thickness * (1 - vr.progress * 0.45) * scaleRatio),
            liveColor.core, liveColor.secondary, alpha, 1.25
          );
        }

        // B. Layered Harmonic Voice Rings oscillating around the orb (SPEAKING)
        if (cur.speakingMode > 0.04 && lum > 0.15) {
          const sm = cur.speakingMode * Math.min(1, lum);
          const harmonicCount = 2;

          for (let h = 0; h < harmonicCount; h++) {
            const baseR = baseRadius * (0.285 + h * 0.068 + speechEnv * (0.045 + h * 0.02));
            const lobes = h === 0 ? 6 : 9;
            const dir = h === 0 ? 1 : -1;
            const steps = 96;

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            for (let s = 0; s <= steps; s++) {
              const ang = (s / steps) * Math.PI * 2;
              const mod =
                Math.sin(ang * lobes + t * 7.5 * dir) * 0.58 +
                Math.cos(ang * (lobes - 2) - t * 11.2 * dir) * 0.42;
              const rr = baseR + mod * (0.008 + speechEnv * 0.03) * baseRadius;
              const hx = cx + Math.cos(ang) * rr;
              const hy = cy + Math.sin(ang) * rr;
              if (s === 0) ctx.moveTo(hx, hy);
              else ctx.lineTo(hx, hy);
            }
            ctx.closePath();

            ctx.strokeStyle = rgba(h === 0 ? liveColor.primary : liveColor.secondary, (0.34 - h * 0.08) * sm);
            ctx.lineWidth = Math.max(2.6, (3.8 - h * 0.9) * scaleRatio);
            ctx.stroke();

            ctx.strokeStyle = rgba(h === 0 ? liveColor.core : liveColor.secondary, (0.78 - h * 0.16) * sm);
            ctx.lineWidth = Math.max(1.0, (1.45 - h * 0.25) * scaleRatio);
            ctx.stroke();
            ctx.restore();
          }
        }

        // C. Measured Analytical Thinking Ripple Rings (THINK MED)
        for (let i = thinkRipples.length - 1; i >= 0; i--) {
          const tr = thinkRipples[i];
          tr.progress += dt * tr.speed;
          if (tr.progress >= 1) {
            thinkRipples.splice(i, 1);
            continue;
          }
          const eased = 1 - Math.pow(1 - tr.progress, 2.5);
          const r = baseRadius * lerp(0.24, 0.82, eased);
          const alpha = (1 - tr.progress) * tr.alpha * Math.min(1, lum);

          drawNeonArc(
            cx, cy, r, 0, Math.PI * 2,
            Math.max(1.1, tr.thickness * (1 - tr.progress * 0.5) * scaleRatio),
            liveColor.secondary, liveColor.primary, alpha, 1.3
          );
        }

        // D. Expanding Radial Impulse Shockwaves (Spacebar, Click Orb, Wake/Init Flash)
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.progress += dt * sw.speed;
          if (sw.progress >= 1) {
            shockwaves.splice(i, 1);
            continue;
          }
          if (sw.progress < 0) continue;
          const eased = 1 - Math.pow(1 - sw.progress, 3);
          const r = baseRadius * (0.18 + eased * sw.maxRadiusFactor);
          const alpha = (1 - sw.progress) * sw.alpha;
          const lw = (1 - sw.progress * 0.65) * sw.thickness;
          drawNeonArc(cx, cy, r, 0, Math.PI * 2, lw, liveColor.core, liveColor.primary, alpha, 1.48, Math.max(0.9, lum));
        }
      }

      // --------------------------------------------------------------------------
      // LAYER 6: CENTRAL LUMINOUS 3D GEODESIC PLASMA CORE SPHERE
      // --------------------------------------------------------------------------
      function renderSphereWireframe(coreX, coreY, coreR, rotX, rotY, alpha, colorObj, additive) {
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

        function proj(px, py, pz) {
          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          return { x: coreX + x1 * coreR, y: coreY + y2 * coreR };
        }

        ctx.save();
        ctx.globalCompositeOperation = additive ? 'lighter' : 'source-over';
        ctx.lineWidth = 0.85;
        ctx.strokeStyle = rgba(colorObj, alpha, additive ? cur.muteFactor * 0.5 : 0);

        // 6 Meridians
        for (let m = 0; m < 6; m++) {
          const phi = (m / 6) * Math.PI;
          ctx.beginPath();
          for (let s = 0; s <= 28; s++) {
            const theta = (s / 28) * Math.PI * 2;
            const pt = proj(Math.sin(theta) * Math.cos(phi) * 0.94, Math.cos(theta) * 0.94, Math.sin(theta) * Math.sin(phi) * 0.94);
            if (s === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
        }

        // 4 Parallels
        for (let p = 1; p < 5; p++) {
          const lat = (p / 5) * Math.PI - Math.PI * 0.5;
          const rLat = Math.cos(lat) * 0.94;
          const yLat = Math.sin(lat) * 0.94;
          ctx.beginPath();
          for (let s = 0; s <= 28; s++) {
            const theta = (s / 28) * Math.PI * 2;
            const pt = proj(Math.cos(theta) * rLat, yLat, Math.sin(theta) * rLat);
            if (s === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function renderCentralCore(t, listeningLevel, lum, wakeCoreProgress) {
        const baseBreath = Math.sin(t * cur.corePulseFreq) * cur.corePulseAmp;

        // THINK MED: Deep resonant elastic physical orb scaling (0.84x -> 1.26x)
        const thinkScaleOffset = cur.thinkMedMode * ((thinkPulseValue * 0.42) - 0.16);

        // SPEAKING: Smooth rhythmic vocal cadence modulation
        const speakScaleOffset = cur.speakingMode * ((speechEnv * 0.24) - 0.06);

        // LISTENING: Subtle acoustic focus micro-pulse
        const listenOffset = cur.listeningMode * listeningLevel * 0.036;

        const impulseOffset = pulseImpulse * 0.14;

        let orbScale = 1.0 + baseBreath + thinkScaleOffset + speakScaleOffset + listenOffset + impulseOffset;
        if (wakeSeq.active) {
          // Stage 1 blinding pinpoint spark -> Stage 2 rapid expansion into full orb
          orbScale = lerp(0.11, 1.0 + impulseOffset, wakeCoreProgress);
        }

        const coreR = Math.max(7, baseRadius * 0.212 * clamp(orbScale, 0.1, 1.38));

        // Subtle mouse-tracking parallax + Think Hard micro-vibration
        const vibX = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.2 * cur.vibrationAmp : 0;
        const vibY = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.2 * cur.vibrationAmp : 0;
        const coreX = cx + pointer.smoothX * (baseRadius * 0.02) * Math.min(1, lum) + vibX;
        const coreY = cy + pointer.smoothY * (baseRadius * 0.02) * Math.min(1, lum) + vibY;

        ctx.save();

        // DEAD STATE: Unlit dark charcoal/cold-metal wireframe sphere + occasional dying-ember micro-flicker
        if (lum < 0.06 && !wakeSeq.active) {
          ctx.globalCompositeOperation = 'source-over';
          const deadGrad = ctx.createRadialGradient(coreX, coreY, coreR * 0.08, coreX, coreY, coreR);
          deadGrad.addColorStop(0, `rgba(28, 30, 38, ${0.88})`);
          deadGrad.addColorStop(0.72, 'rgba(13, 14, 20, 0.94)');
          deadGrad.addColorStop(1, 'rgba(5, 6, 10, 0.98)');
          ctx.fillStyle = deadGrad;
          ctx.beginPath();
          ctx.arc(coreX, coreY, coreR, 0, Math.PI * 2);
          ctx.fill();

          // Static unlit cold-metal geodesic wireframe
          renderSphereWireframe(coreX, coreY, coreR, 0.38, 0.42, 0.34 + deadFlicker * 0.18, DEAD_WIRE, false);

          // Occasional faint dying-ember micro-flicker tinted with active palette
          if (deadFlicker > 0.01) {
            ctx.globalCompositeOperation = 'lighter';
            const emGrad = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, coreR * 0.48);
            emGrad.addColorStop(0, rgba(liveColor.primary, deadFlicker * 0.55));
            emGrad.addColorStop(0.5, rgba(liveColor.deep, deadFlicker * 0.32));
            emGrad.addColorStop(1, rgba(liveColor.deep, 0));
            ctx.fillStyle = emGrad;
            ctx.beginPath();
            ctx.arc(coreX, coreY, coreR * 0.48, 0, Math.PI * 2);
            ctx.fill();
          }

          drawNeonArc(coreX, coreY, coreR, 0, Math.PI * 2, 1.5, DEAD_METAL, DEAD_METAL, 0.72, 0.1, 0);
          ctx.restore();
          return;
        }

        ctx.globalCompositeOperation = 'lighter';
        const m = cur.muteFactor;
        const dynamicBloom =
          cur.speakingMode * speechEnv * 0.35 +
          cur.thinkMedMode * thinkPulseValue * 0.32 +
          cur.thinkHardMode * 0.42;

        // A. Wide Volumetric Plasma Corona Halo
        const coronaR = coreR * (2.35 + pulseImpulse * 0.72 + dynamicBloom);
        const coronaGrad = ctx.createRadialGradient(coreX, coreY, coreR * 0.12, coreX, coreY, coronaR);
        const cLum = Math.min(1.45, lum + dynamicBloom * 0.35);
        coronaGrad.addColorStop(0, rgba(liveColor.core, clamp((0.42 + pulseImpulse * 0.28 + dynamicBloom * 0.25) * cLum, 0, 0.96), m));
        coronaGrad.addColorStop(0.32, rgba(liveColor.primary, clamp((0.3 + pulseImpulse * 0.2) * cLum, 0, 0.8), m));
        coronaGrad.addColorStop(0.66, rgba(liveColor.deep, clamp(0.2 * cLum, 0, 0.45), m));
        coronaGrad.addColorStop(1, rgba(liveColor.deep, 0));
        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(coreX, coreY, coronaR, 0, Math.PI * 2);
        ctx.fill();

        // B. Solid Luminous Plasma Sphere Body
        const sphereGrad = ctx.createRadialGradient(
          coreX - coreR * 0.14, coreY - coreR * 0.14, coreR * 0.04,
          coreX, coreY, coreR
        );
        const hotCoreStop = clamp(0.24 + dynamicBloom * 0.18, 0.2, 0.46);
        sphereGrad.addColorStop(0, rgba(liveColor.core, clamp(0.95 * lum + 0.12, 0.4, 1.0), m * 0.7));
        sphereGrad.addColorStop(hotCoreStop, rgba(liveColor.secondary, clamp(0.88 * lum + 0.08, 0.35, 0.96), m * 0.85));
        sphereGrad.addColorStop(0.62, rgba(liveColor.primary, clamp(0.78 * lum + 0.08, 0.3, 0.92), m));
        sphereGrad.addColorStop(0.92, rgba(liveColor.deep, clamp(0.62 * lum + 0.05, 0.2, 0.82), m));
        sphereGrad.addColorStop(1, rgba(liveColor.primary, 0.18 * lum, m));

        ctx.fillStyle = sphereGrad;
        ctx.beginPath();
        ctx.arc(coreX, coreY, coreR, 0, Math.PI * 2);
        ctx.fill();

        // C. Clipped Interior: 3D Geodesic Wireframe + Shimmering Volumetric Neural Particle Lattice
        ctx.save();
        ctx.beginPath();
        ctx.arc(coreX, coreY, coreR * 0.985, 0, Math.PI * 2);
        ctx.clip();

        const rotSpeed = Math.max(0.16, cur.speedMult * 0.56 + cur.thinkMedMode * 0.55);
        const rotY = t * (0.42 * rotSpeed) + pointer.smoothX * 0.65;
        const rotX = 0.34 + Math.sin(t * 0.42) * 0.16 + pointer.smoothY * 0.55;

        renderSphereWireframe(
          coreX, coreY, coreR, rotX, rotY,
          (0.16 + pulseImpulse * 0.16 + dynamicBloom * 0.12) * Math.min(1.15, lum),
          liveColor.core,
          true
        );

        // Project 3D volumetric neural lattice nodes
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const activeNodes = Math.floor(NEURAL_NODE_COUNT * clamp(cur.particleRatio, 0.36, 1.0));
        const projected = [];

        for (let i = 0; i < activeNodes; i++) {
          const n = neuralNodes[i];
          const swirl = 1 + Math.sin(t * (2.6 + cur.thinkMedMode * 3.0) + n.phase) * 0.055;
          const x1 = n.x * swirl * cosY - n.z * swirl * sinY;
          const z1 = n.x * swirl * sinY + n.z * swirl * cosY;
          const y2 = n.y * swirl * cosX - z1 * sinX;
          const z2 = n.y * swirl * sinX + z1 * cosX;
          projected.push({
            x: coreX + x1 * coreR,
            y: coreY + y2 * coreR,
            z: z2,
            alpha: Math.max(0.12, (z2 + 1.1) * 0.5),
            size: n.size,
            phase: n.phase
          });
        }

        // Synaptic lattice connections
        const maxLinkDist = coreR * 0.44;
        const maxLinkDistSq = maxLinkDist * maxLinkDist;
        ctx.lineWidth = 0.85;
        for (let i = 0; i < projected.length; i++) {
          const a = projected[i];
          if (a.z < -0.35) continue;
          for (let j = i + 1; j < projected.length; j++) {
            const b = projected[j];
            if (b.z < -0.35) continue;
            const dx = a.x - b.x, dy = a.y - b.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < maxLinkDistSq) {
              const prox = 1 - Math.sqrt(distSq) / maxLinkDist;
              const spark = Math.sin(t * (4 + cur.synapseRate * 11) + a.phase + b.phase) > 0.66 ? 1.85 : 1.0;
              ctx.strokeStyle = rgba(
                spark > 1.2 ? liveColor.core : liveColor.secondary,
                prox * a.alpha * b.alpha * (0.22 + cur.synapseRate * 0.32 + pulseImpulse * 0.35) * spark * Math.min(1, lum),
                m * 0.7
              );
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        // Shimmering neural nodes
        for (let i = 0; i < projected.length; i++) {
          const nd = projected[i];
          const shimmer = 0.55 + 0.45 * Math.sin(t * 5.2 + nd.phase);
          ctx.fillStyle = rgba(
            shimmer > 0.8 ? liveColor.core : liveColor.secondary,
            nd.alpha * shimmer * (0.7 + pulseImpulse * 0.3) * Math.min(1, lum),
            m * 0.65
          );
          ctx.beginPath();
          ctx.arc(nd.x, nd.y, nd.size * (0.68 + nd.alpha * 0.52), 0, Math.PI * 2);
          ctx.fill();
        }

        // Glowing Bright Nucleus (blinding white-hot during Wake spark & Think Hard overdrive)
        const nucleusR = coreR * (0.56 + cur.thinkHardMode * 0.16);
        const nucleusGrad = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, nucleusR);
        const nucAlpha = clamp((0.76 + pulseImpulse * 0.25 + dynamicBloom * 0.35) * lum, 0, 1);
        nucleusGrad.addColorStop(0, `rgba(255,255,255,${clamp(nucAlpha * (0.85 + cur.thinkHardMode * 0.3), 0, 1).toFixed(3)})`);
        nucleusGrad.addColorStop(0.42, rgba(liveColor.core, clamp(nucAlpha * 0.55, 0, 0.9), m * 0.5));
        nucleusGrad.addColorStop(1, rgba(liveColor.primary, 0));
        ctx.fillStyle = nucleusGrad;
        ctx.beginPath();
        ctx.arc(coreX, coreY, nucleusR, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore(); // End sphere clip

        // D. Luminous Sphere Rim
        drawNeonArc(
          coreX, coreY, coreR, 0, Math.PI * 2,
          2.0 + pulseImpulse * 1.4 + dynamicBloom * 1.2,
          liveColor.core, liveColor.primary,
          0.92, 1.15
        );

        // E. Subtle Interactive Hover Reticle
        if (pointer.overCore && lum > 0.14) {
          const retR = coreR * 1.14;
          const spin = t * 0.95;
          for (let q = 0; q < 4; q++) {
            const a = spin + (q * Math.PI) / 2;
            drawNeonArc(coreX, coreY, retR, a - 0.15, a + 0.15, 1.5, liveColor.core, liveColor.secondary, 0.72, 0.85);
          }
        }

        ctx.restore();

        // Spawn crackling synaptic lightning arcs in THINK HARD
        if (cur.thinkHardMode > 0.15 && lum > 0.45) {
          lightningTimer -= (1 / 60) * (1.2 + cur.thinkHardMode * 5.8);
          if (lightningTimer <= 0) {
            lightningTimer = 0.075 + Math.random() * 0.13;
            spawnLightningBolt(coreX, coreY, coreR);
            if (Math.random() < 0.58) spawnLightningBolt(coreX, coreY, coreR);
          }
        }
      }

      // --------------------------------------------------------------------------
      // STATE & PALETTE CONTROLLERS
      // --------------------------------------------------------------------------
      function updateStateButtonsUI(activeKey) {
        stateButtons.forEach((btn) => {
          btn.classList.toggle('pill-active', btn.dataset.state === activeKey);
        });
      }

      function setState(rawName) {
        const cleaned = String(rawName || '').trim().toLowerCase().replace(/[\s/-]+/g, '_');
        const aliasMap = {
          idle: 'idle',
          standby: 'idle',
          dull: 'idle',
          normal: 'normal',
          active: 'normal',
          listening: 'listening',
          listen: 'listening',
          speaking: 'speaking',
          speak: 'speaking',
          think_med: 'think_med',
          think_medium: 'think_med',
          thinking_med: 'think_med',
          thinking_medium: 'think_med',
          medium: 'think_med',
          think_hard: 'think_hard',
          thinking_hard: 'think_hard',
          hard: 'think_hard',
          wake: 'wake',
          init: 'wake',
          wake_init: 'wake',
          awake: 'wake',
          dead: 'dead',
          offline: 'dead'
        };
        const key = aliasMap[cleaned];
        if (!key) return;

        if (key === 'wake') {
          triggerWakeInit();
          return;
        }

        wakeSeq.active = false;
        currentStateKey = key;
        updateStateButtonsUI(key);

        if (key === 'dead') {
          pulseImpulse = 0;
        } else if (key === 'idle') {
          pulseImpulse = 0.08;
        } else {
          pulseImpulse = Math.max(pulseImpulse, 0.34);
          shockwaves.push({
            progress: 0, speed: 1.5, maxRadiusFactor: 0.7, alpha: 0.52, thickness: 2.2
          });
        }
      }

      /**
       * Cinematic Multi-Stage Wake / Init Sequence:
       * Dark dormant -> tight blinding pinpoint spark -> expanding shockwave flash ->
       * staggered inner-to-outer concentric ring spin-up -> outer half-circle sweeping online ->
       * smoothly settles into "Normal".
       */
      function triggerWakeInit() {
        wakeSeq.active = true;
        wakeSeq.elapsed = 0;
        wakeSeq.flashFired = false;

        // Start from dark dormant baseline for dramatic ignition contrast
        cur.luminance = 0.02;
        cur.speedMult = 0.04;
        cur.muteFactor = 0.0;
        currentStateKey = 'normal';
        updateStateButtonsUI('wake');
      }

      function triggerPulse() {
        if (currentStateKey === 'dead' && !wakeSeq.active) {
          triggerWakeInit();
          return;
        }
        pulseImpulse = 1.0;
        shockwaves.push(
          { progress: 0, speed: 1.28, maxRadiusFactor: 0.92, alpha: 0.92, thickness: 4.0 },
          { progress: -0.09, speed: 1.05, maxRadiusFactor: 0.78, alpha: 0.64, thickness: 2.2 }
        );
      }

      function setPalette(nameOrIndex) {
        let idx = -1;
        if (typeof nameOrIndex === 'number' && Number.isFinite(nameOrIndex)) {
          idx = ((Math.floor(nameOrIndex) % PALETTES.length) + PALETTES.length) % PALETTES.length;
        } else if (typeof nameOrIndex === 'string') {
          const norm = nameOrIndex.trim().toLowerCase().replace(/[\s-]+/g, '_');
          idx = PALETTES.findIndex((p) => p.id === norm || p.name.toLowerCase() === nameOrIndex.trim().toLowerCase());
        }
        if (idx < 0 || idx >= PALETTES.length) return;

        activePaletteIndex = idx;
        const pal = PALETTES[idx];
        activePaletteNameEl.textContent = pal.name.toUpperCase();

        const swatches = paletteRow.querySelectorAll('.palette-swatch');
        swatches.forEach((sw, i) => {
          const isAct = i === idx;
          sw.classList.toggle('swatch-active', isAct);
          sw.setAttribute('aria-checked', isAct ? 'true' : 'false');
        });
      }

      function toggleUI() {
        dockVisible = !dockVisible;
        bottomDock.classList.toggle('dock-hidden', !dockVisible);
        resizeCanvas();
      }

      // Build the 8 glowing circular palette swatches
      function buildPaletteSwatches() {
        paletteRow.innerHTML = '';
        PALETTES.forEach((pal, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'palette-swatch' + (idx === 0 ? ' swatch-active' : '');
          btn.title = pal.name;
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-label', pal.name);
          btn.setAttribute('aria-checked', idx === 0 ? 'true' : 'false');
          btn.style.setProperty('--swatch-color', pal.hexPrimary);
          btn.style.background = `radial-gradient(circle at 35% 35%, #ffffff 0%, ${pal.hexSecondary} 32%, ${pal.hexPrimary} 78%, rgba(0,0,0,0.4) 100%)`;
          btn.style.boxShadow = `0 0 10px ${pal.hexPrimary}80`;
          btn.addEventListener('click', () => setPalette(idx));
          paletteRow.appendChild(btn);
        });
      }

      // --------------------------------------------------------------------------
      // EVENT LISTENERS (UI, POINTER/TOUCH, KEYBOARD SHORTCUTS)
      // --------------------------------------------------------------------------
      stateButtons.forEach((btn) => {
        btn.addEventListener('click', () => setState(btn.dataset.state));
      });

      function isPointInCore(px, py) {
        const dx = px - cx, dy = py - cy;
        const r = baseRadius * 0.31;
        return dx * dx + dy * dy <= r * r;
      }

      function updatePointer(clientX, clientY) {
        pointer.normX = (clientX / Math.max(1, width) - 0.5) * 2;
        pointer.normY = (clientY / Math.max(1, height) - 0.5) * 2;
        pointer.overCore = isPointInCore(clientX, clientY);
        canvas.style.cursor = pointer.overCore ? 'pointer' : 'default';
      }

      canvas.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
      canvas.addEventListener('mouseleave', () => {
        pointer.normX = 0;
        pointer.normY = 0;
        pointer.overCore = false;
        canvas.style.cursor = 'default';
      });
      canvas.addEventListener('click', (e) => {
        if (isPointInCore(e.clientX, e.clientY)) triggerPulse();
      });
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          const t0 = e.touches[0];
          updatePointer(t0.clientX, t0.clientY);
          if (isPointInCore(t0.clientX, t0.clientY)) triggerPulse();
        }
      }, { passive: true });
      canvas.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      // Keyboard Shortcuts:
      // '1'-'8': states | 'C': cycle palettes | 'H': hide/show dock | 'Space': radial energy pulse
      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k >= '1' && k <= '8') {
          setState(STATE_KEYS[parseInt(k, 10) - 1]);
        } else if (k === 'c') {
          setPalette((activePaletteIndex + 1) % PALETTES.length);
        } else if (k === 'h') {
          toggleUI();
        } else if (e.code === 'Space') {
          e.preventDefault();
          triggerPulse();
        }
      });

      window.addEventListener('resize', resizeCanvas);

      // --------------------------------------------------------------------------
      // GLOBAL PROGRAMMATIC API: window.JARVIS
      // --------------------------------------------------------------------------
      window.JARVIS = {
        setState,
        setPalette,
        pulse: triggerPulse,
        toggleUI
      };

      // --------------------------------------------------------------------------
      // MAIN 60FPS ANIMATION LOOP
      // --------------------------------------------------------------------------
      function animate(timestamp) {
        try {
          if (!lastTime) lastTime = timestamp;
          const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
          lastTime = timestamp;
          elapsedTime += dt;

          // 1. Smoothly interpolate live RGB palette colors across all visual layers
          const targetPal = PALETTES[activePaletteIndex];
          const colorEase = Math.min(1, dt * 6.5);
          lerpRgb(liveColor.primary, targetPal.primary, colorEase);
          lerpRgb(liveColor.secondary, targetPal.secondary, colorEase);
          lerpRgb(liveColor.core, targetPal.core, colorEase);
          lerpRgb(liveColor.deep, targetPal.deep, colorEase);
          syncDockCssVariables();

          // 2. Advance cinematic multi-stage Wake / Init sequence if active
          let wakeCoreProgress = 1.0;
          let wakeOuterProgress = 1.0;

          if (wakeSeq.active) {
            wakeSeq.elapsed += dt;
            const wt = wakeSeq.elapsed;

            // Stage 1: Tight blinding pinpoint spark -> Stage 2: rapid expansion into orb
            wakeCoreProgress = clamp((wt - 0.16) / 0.62, 0, 1);

            if (wt >= 0.42 && !wakeSeq.flashFired) {
              wakeSeq.flashFired = true;
              pulseImpulse = 1.0;
              shockwaves.push(
                { progress: 0, speed: 1.18, maxRadiusFactor: 0.96, alpha: 0.98, thickness: 5.2 },
                { progress: -0.09, speed: 0.96, maxRadiusFactor: 0.84, alpha: 0.76, thickness: 2.8 }
              );
            }

            // Stage 4: Outer half-circle sweeps online symmetrically from center outward
            wakeOuterProgress = clamp((wt - 1.32) / 0.98, 0, 1);

            // Complete ignition -> smoothly settle into Normal state
            if (wt >= wakeSeq.duration) {
              wakeSeq.active = false;
              currentStateKey = 'normal';
              updateStateButtonsUI('normal');
            }
          }

          // 3. Smoothly ease all behavioral parameters toward target state
          const target = STATE_PROFILES[currentStateKey];
          const ease = Math.min(1, dt * (wakeSeq.active ? 3.6 : 4.8));

          cur.speedMult = lerp(cur.speedMult, target.speedMult, ease);
          const targetLum = wakeSeq.active ? clamp(0.18 + wakeSeq.elapsed * 0.95, 0.18, 1.32) : target.luminance;
          cur.luminance = lerp(cur.luminance, targetLum, ease);
          cur.muteFactor = lerp(cur.muteFactor, target.muteFactor, ease);
          cur.corePulseAmp = lerp(cur.corePulseAmp, target.corePulseAmp, ease);
          cur.corePulseFreq = lerp(cur.corePulseFreq, target.corePulseFreq, ease);
          cur.synapseRate = lerp(cur.synapseRate, target.synapseRate, ease);
          cur.arcTightness = lerp(cur.arcTightness, target.arcTightness, ease);
          cur.outerBreathAmp = lerp(cur.outerBreathAmp, target.outerBreathAmp, ease);
          cur.outerSwayAmp = lerp(cur.outerSwayAmp, target.outerSwayAmp, ease);
          cur.scanSpeed = lerp(cur.scanSpeed, target.scanSpeed, ease);
          cur.listeningMode = lerp(cur.listeningMode, target.listeningMode, ease);
          cur.speakingMode = lerp(cur.speakingMode, target.speakingMode, ease);
          cur.thinkMedMode = lerp(cur.thinkMedMode, target.thinkMedMode, ease);
          cur.thinkHardMode = lerp(cur.thinkHardMode, target.thinkHardMode, ease);
          cur.vibrationAmp = lerp(cur.vibrationAmp, target.vibrationAmp, ease);
          cur.particleRatio = lerp(cur.particleRatio, target.particleRatio, ease);

          // 4. Dead-state occasional dying-ember micro-flicker
          if (currentStateKey === 'dead' && !wakeSeq.active) {
            nextDeadFlicker -= dt;
            if (nextDeadFlicker <= 0) {
              deadFlicker = 0.42 + Math.random() * 0.38;
              nextDeadFlicker = 3.0 + Math.random() * 4.8;
            }
            deadFlicker *= Math.pow(0.035, dt);
            if (deadFlicker < 0.005) deadFlicker = 0;
          } else {
            deadFlicker = 0;
          }

          // 5. Update envelopes, pointer parallax & impulse decay
          updateEnvelopes(dt, elapsedTime);
          pointer.smoothX = lerp(pointer.smoothX, pointer.normX, Math.min(1, dt * 5.2));
          pointer.smoothY = lerp(pointer.smoothY, pointer.normY, Math.min(1, dt * 5.2));
          pulseImpulse *= Math.pow(0.08, dt);
          if (pulseImpulse < 0.002) pulseImpulse = 0;

          const listeningLevel = getListeningLevel(elapsedTime);
          const lum = cur.luminance;
          const totalEnergy =
            speechEnv * cur.speakingMode +
            listeningLevel * cur.listeningMode * 0.55 +
            thinkPulseValue * cur.thinkMedMode * 0.65 +
            cur.thinkHardMode * 0.75 +
            pulseImpulse * 1.1;

          // 6. Render complete layered holographic frame
          renderBackground(elapsedTime, totalEnergy, lum);
          renderOuterHalfCircle(elapsedTime, dt, listeningLevel, lum, wakeOuterProgress);
          renderConcentricArcs(elapsedTime, dt, listeningLevel, lum);
          renderListeningOverlay(elapsedTime, dt, listeningLevel, lum);
          renderWaveOverlays(elapsedTime, dt, lum);
          renderCentralCore(elapsedTime, listeningLevel, lum, wakeCoreProgress);
          renderLightningBolts(dt);
        } catch (err) {
          console.error('Animation loop error:', err);
        }

        requestAnimationFrame(animate);
      }

      // --------------------------------------------------------------------------
      // INITIALIZE ON WINDOW LOAD
      // --------------------------------------------------------------------------
      window.onload = function () {
        buildPaletteSwatches();
        setPalette(0);
        resizeCanvas();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
