        for (let b = 0; b < BLADES; b++) {
          const baseA = (b / BLADES) * Math.PI * 2 + titanState.irisOpen * 0.35;
          const nextA = ((b + 1.45) / BLADES) * Math.PI * 2 + titanState.irisOpen * 0.35;
          const innerA = baseA + lerp(0.55, 0.22, titanState.irisOpen);

          const xOuter1 = coreX + Math.cos(baseA) * (irisR * 1.18);
          const yOuter1 = coreY + Math.sin(baseA) * (irisR * 1.18);
          const xOuter2 = coreX + Math.cos(nextA) * (irisR * 1.18);
          const yOuter2 = coreY + Math.sin(nextA) * (irisR * 1.18);
          const xInner = coreX + Math.cos(innerA) * apertureR;
          const yInner = coreY + Math.sin(innerA) * apertureR;

          // Chamfered dark gunmetal blade body
          ctx.beginPath();
          ctx.moveTo(xOuter1, yOuter1);
          ctx.lineTo(xOuter2, yOuter2);
          ctx.lineTo(xInner, yInner);
          ctx.closePath();

          const bFill = isDead
            ? `rgba(18,22,32,${(0.95 * vAlpha).toFixed(3)})`
            : `rgba(11,14,23,${(0.9 * vAlpha).toFixed(3)})`;
          ctx.fillStyle = bFill;
          ctx.fill();

          // High-contrast neon blade leading-edge bevel
          ctx.strokeStyle = isDead
            ? rgba(DEAD_WIRE, 0.55 * vAlpha)
            : rgba(liveColor.bright, (0.58 + titanState.irisOpen * 0.32) * Math.min(1.1, lum) * vAlpha, m * 0.7);
          ctx.lineWidth = Math.max(1.1, 1.45 * scaleRatio);
          ctx.stroke();

          // Mechanical pivot pin near housing edge
          const pinX = coreX + Math.cos(baseA + 0.14) * (irisR * 0.86);
          const pinY = coreY + Math.sin(baseA + 0.14) * (irisR * 0.86);
          ctx.fillStyle = isDead ? rgba(DEAD_METAL, 0.6 * vAlpha) : rgba(liveColor.core, 0.72 * Math.min(1, lum) * vAlpha, m * 0.6);
          ctx.beginPath();
          ctx.arc(pinX, pinY, Math.max(1.2, 1.7 * scaleRatio), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Crisp optical housing bezel
        drawNeonArc(coreX, coreY, irisR, 0, Math.PI * 2, Math.max(2.0, 2.8 * scaleRatio), liveColor.core, liveColor.primary, 0.95 * vAlpha, 1.15);

        // 3. Segmented Arc-Reactor Coils (12 precision luminous wedges)
        let wfCoil = wakeSeq.active ? clamp((wakeSeq.elapsed - 0.85) / 0.45, 0, 1) : 1.0;
        if (wfCoil > 0.01) {
          const coilLum = lum * wfCoil;
          const thinkFlex = (getLag(thinkLagBuf, 6) - 0.42) * 0.09 * cur.thinkMedMode;
          const coilR = baseRadius * 0.338 * cur.arcTightness * (1 + thinkFlex + pulseImpulse * 0.035);
          const coilCount = 12;
          const step = (Math.PI * 2) / coilCount;
          for (let c = 0; c < coilCount; c++) {
            const a1 = titanState.coilAngle + c * step + 0.06;
            const a2 = titanState.coilAngle + (c + 1) * step - 0.06;
            const activeFlicker = (cur.thinkHardMode > 0.3 || cur.speakingMode > 0.3)
              ? 0.65 + 0.35 * Math.sin(t * 10 + c * 1.1)
              : 1.0;
            drawNeonArc(cx, cy, coilR, a1, a2, Math.max(4.4, 7.0 * scaleRatio), liveColor.primary, liveColor.primary, 0.86 * activeFlicker * vAlpha, 1.05, coilLum);
            if (coilLum > 0.08) {
              drawNeonArc(cx, cy, coilR, a1 + 0.03, a2 - 0.03, Math.max(1.4, 2.2 * scaleRatio), liveColor.core, liveColor.bright, 0.85 * activeFlicker * vAlpha, 0.75, coilLum);
            }
          }
        }

        // 4. Dual Opposing Precision Vernier Caliper Dials
        let wfVern = wakeSeq.active ? clamp((wakeSeq.elapsed - 1.05) / 0.45, 0, 1) : 1.0;
        if (wfVern > 0.01) {
          const vLum = lum * wfVern;
          const dials = [
            { rFac: 0.415, ang: titanState.vernierAngle1, ticks: 72, dir: 1 },
            { rFac: 0.468, ang: titanState.vernierAngle2, ticks: 96, dir: -1 }
          ];
          ctx.save();
          ctx.globalCompositeOperation = vLum > 0.06 ? 'lighter' : 'source-over';
          dials.forEach((dl, idx) => {
            const r = baseRadius * dl.rFac * cur.arcTightness;
            const step = (Math.PI * 2) / dl.ticks;
            for (let k = 0; k < dl.ticks; k++) {
              const a = dl.ang + k * step;
              const isMajor = k % 6 === 0;
              const len = isMajor ? Math.max(7.5, 11.5 * scaleRatio) : Math.max(3, 4.8 * scaleRatio);
              const cosA = Math.cos(a), sinA = Math.sin(a);
              ctx.strokeStyle = vLum <= 0.06
                ? rgba(DEAD_METAL, 0.3 * vAlpha)
                : rgba(isMajor ? liveColor.core : liveColor.bright, (isMajor ? 0.85 : 0.35) * Math.min(1.1, vLum) * vAlpha, m);
              ctx.lineWidth = isMajor ? Math.max(1.3, 1.65 * scaleRatio) : 0.85;
              ctx.beginPath();
              ctx.moveTo(cx + cosA * r, cy + sinA * r);
              ctx.lineTo(cx + cosA * (r + len * (idx === 0 ? 1 : -1)), cy + sinA * (r + len * (idx === 0 ? 1 : -1)));
              ctx.stroke();
            }
          });
          ctx.restore();
        }

        // 5. Reactive Circular Equalizer Ring (so Listening & Speaking audio spectrum pops on Titan)
        let wfEq = wakeSeq.active ? clamp((wakeSeq.elapsed - 1.2) / 0.45, 0, 1) : 1.0;
        if (wfEq > 0.01) {
          const eqLum = lum * wfEq;
          const r = baseRadius * 0.525 * cur.arcTightness;
          const count = 64;
          const step = (Math.PI * 2) / count;
          ctx.save();
          ctx.globalCompositeOperation = eqLum > 0.06 ? 'lighter' : 'source-over';
          for (let k = 0; k < count; k++) {
            const ang = k * step + titanState.coilAngle * 0.4;
            const bVal = lerp(
              0.5 + 0.5 * Math.sin(k * 0.5 + t * 8.0),
              clamp(0.4 + 0.4 * Math.sin(k * 0.4 - t * 14.0) + 0.2 * Math.cos(k * 0.9 + t * 18.0), 0.05, 1),
              cur.speakingMode
            );
            const react = cur.listeningMode * (0.45 + listeningLevel * 1.45) + cur.speakingMode * (0.45 + speechEnv * 1.9) + cur.thinkHardMode * 0.55 + pulseImpulse * 1.1 + 0.06;
            const barLen = eqLum <= 0.06 ? baseRadius * 0.008 : baseRadius * (0.008 + bVal * react * 0.05);
            const cosA = Math.cos(ang), sinA = Math.sin(ang);
            ctx.strokeStyle = eqLum <= 0.06
              ? rgba(DEAD_METAL, 0.28 * vAlpha)
              : rgba(bVal > 0.68 && react > 0.5 ? liveColor.core : liveColor.bright, (0.4 + bVal * 0.55) * Math.min(1, eqLum) * vAlpha, m);
            ctx.lineWidth = Math.max(1.4, 2.0 * scaleRatio);
            ctx.beginPath();
            ctx.moveTo(cx + cosA * r, cy + sinA * r);
            ctx.lineTo(cx + cosA * (r + barLen), cy + sinA * (r + barLen));
            ctx.stroke();
          }
          ctx.restore();
        }

        // 6. Rotating Hexagonal & Octagonal Lock-On Geometry + Chamfered Tactical Brackets
        let wfGeo = wakeSeq.active ? clamp((wakeSeq.elapsed - 1.38) / 0.48, 0, 1) : 1.0;
        if (wfGeo > 0.01) {
          const gLum = lum * wfGeo;
          const thinkFlex = (getLag(thinkLagBuf, 14) - 0.42) * 0.06 * cur.thinkMedMode;

          const drawPolyRing = (sides, rFac, rot, col, alpha, lw) => {
            const r = baseRadius * rFac * cur.arcTightness * (1 + thinkFlex + pulseImpulse * 0.03);
            ctx.save();
            ctx.globalCompositeOperation = gLum > 0.06 ? 'lighter' : 'source-over';
            ctx.beginPath();
            for (let i = 0; i <= sides; i++) {
              const a = rot + (i / sides) * Math.PI * 2;
              const px = cx + Math.cos(a) * r;
              const py = cy + Math.sin(a) * r;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            if (gLum <= 0.06) {
              ctx.strokeStyle = rgba(DEAD_METAL, 0.34 * vAlpha);
              ctx.lineWidth = lw;
              ctx.stroke();
            } else {
              ctx.strokeStyle = rgba(liveColor.primary, alpha * 0.32 * Math.min(1.15, gLum) * vAlpha, m);
              ctx.lineWidth = lw * 3.0;
              ctx.stroke();
              ctx.strokeStyle = rgba(col, alpha * Math.min(1.15, gLum) * vAlpha, m * 0.65);
              ctx.lineWidth = lw;
              ctx.stroke();
            }
            ctx.restore();
          };

          drawPolyRing(6, 0.612, titanState.hexAngle, liveColor.bright, 0.72, Math.max(1.2, 1.6 * scaleRatio));
          drawPolyRing(8, 0.688, titanState.octAngle, liveColor.primary, 0.58, Math.max(1.1, 1.45 * scaleRatio));

          // 4 Chamfered Tactical Corner Brackets
          const brR = baseRadius * 0.745 * cur.arcTightness * (1 - cur.listeningMode * listeningLevel * 0.04);
          for (let q = 0; q < 4; q++) {
            const midA = titanState.bracketAngle + Math.PI * 0.25 + q * (Math.PI * 0.5);
            const span = 0.28;
            drawNeonArc(cx, cy, brR, midA - span, midA + span, Math.max(2.4, 3.6 * scaleRatio), liveColor.core, liveColor.primary, 0.88 * vAlpha, 1.1, gLum);

            // Chamfered end ticks
            ctx.save();
            ctx.globalCompositeOperation = gLum > 0.06 ? 'lighter' : 'source-over';
            ctx.strokeStyle = gLum <= 0.06 ? rgba(DEAD_WIRE, 0.42 * vAlpha) : rgba(liveColor.bright, 0.8 * Math.min(1, gLum) * vAlpha, m * 0.6);
            ctx.lineWidth = Math.max(1.2, 1.6 * scaleRatio);
            [midA - span, midA + span].forEach((a) => {
              ctx.beginPath();
              ctx.moveTo(cx + Math.cos(a) * (brR - 7 * scaleRatio), cy + Math.sin(a) * (brR - 7 * scaleRatio));
              ctx.lineTo(cx + Math.cos(a) * (brR + 7 * scaleRatio), cy + Math.sin(a) * (brR + 7 * scaleRatio));
              ctx.stroke();
            });
            ctx.restore();
          }
        }

        // 7. Prominent Framing Outer Half-Circle: Dual-Rail 28-Cell Segmented Power Gauge + Numeric Micro-Ticks + Sweeping Radial Laser
        const { ox, oy, radius, halfSpan, startA, endA } = og;
        if (halfSpan > 0.01) {
          const innerRailR = radius - Math.max(8, 12 * scaleRatio);
          const outerRailR = radius + Math.max(8, 12 * scaleRatio);

          // Dual architectural rails
          drawNeonArc(ox, oy, innerRailR, startA, endA, Math.max(1.2, 1.6 * scaleRatio), liveColor.bright, liveColor.primary, 0.75 * vAlpha, 0.85);
          drawNeonArc(ox, oy, outerRailR, startA, endA, Math.max(1.5, 2.1 * scaleRatio), liveColor.core, liveColor.primary, 0.88 * vAlpha, 1.0);

          // 28 Segmented Power Cells between the two rails
          const CELL_COUNT = 28;
          const totalSpan = endA - startA;
          const cellStep = totalSpan / CELL_COUNT;
          const gap = cellStep * 0.22;

          let activeFraction = 1.0;
          if (isDead) activeFraction = 0.0;
          else if (currentStateKey === 'idle') activeFraction = 0.36;
          else if (wakeSeq.active) activeFraction = smoothstep(1.8, 2.9, wakeSeq.elapsed);
          else if (cur.speakingMode > 0.3) activeFraction = clamp(0.45 + speechEnv * 0.55, 0.4, 1.0);
          else if (cur.thinkMedMode > 0.3) activeFraction = clamp(0.55 + thinkPulseValue * 0.45, 0.5, 1.0);

          const litCells = Math.round(CELL_COUNT * activeFraction);
          ctx.save();
          ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
          for (let c = 0; c < CELL_COUNT; c++) {
            const cStart = startA + c * cellStep + gap * 0.5;
            const cEnd = startA + (c + 1) * cellStep - gap * 0.5;
            // Fill symmetrically from center outward
            const distFromCenter = Math.abs(c - (CELL_COUNT - 1) * 0.5) / (CELL_COUNT * 0.5);
            const isLit = !isDead && (distFromCenter <= activeFraction + 0.02);

            ctx.beginPath();
            ctx.arc(ox, oy, outerRailR - 2.5 * scaleRatio, cStart, cEnd);
            ctx.arc(ox, oy, innerRailR + 2.5 * scaleRatio, cEnd, cStart, true);
            ctx.closePath();

            if (isDead || !isLit) {
              ctx.fillStyle = isDead ? rgba(DEAD_METAL, 0.26 * vAlpha) : rgba(liveColor.deep, 0.28 * Math.min(1, lum) * vAlpha, m);
              ctx.fill();
            } else {
              const hotCell = cur.thinkHardMode > 0.4 && Math.sin(t * 16 + c) > 0.45;
              ctx.fillStyle = rgba(hotCell ? liveColor.core : liveColor.primary, (0.46 + (hotCell ? 0.38 : 0.22)) * Math.min(1.15, lum) * vAlpha, m);
              ctx.fill();
              ctx.strokeStyle = rgba(liveColor.core, 0.72 * Math.min(1.1, lum) * vAlpha, m * 0.6);
              ctx.lineWidth = Math.max(0.7, 0.9 * scaleRatio);
              ctx.stroke();
            }
          }

          // Numeric micro-ticks around exterior rim (00, 45, 90, 135, 180)
          const labels = ['00', '45', '90', '135', '180'];
          ctx.font = `600 ${Math.max(8, Math.round(9.5 * scaleRatio))}px var(--font-mono), monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          for (let i = 0; i < labels.length; i++) {
            const frac = i / (labels.length - 1);
            const ang = lerp(startA + 0.04, endA - 0.04, frac);
            const lr = outerRailR + Math.max(12, 17 * scaleRatio);
            const lx = ox + Math.cos(ang) * lr;
            const ly = oy + Math.sin(ang) * lr;
            ctx.fillStyle = isDead
              ? rgba(DEAD_WIRE, 0.45 * vAlpha)
              : rgba(liveColor.core, 0.82 * Math.min(1, lum) * vAlpha, m * 0.6);
            ctx.fillText(labels[i], lx, ly);
          }

          // Sweeping Radial Laser Beam across the gauge
          if (lum > 0.1) {
            let pp = titanState.laserPhase <= 1 ? titanState.laserPhase : 2 - titanState.laserPhase;
            if (cur.thinkHardMode > 0.3) {
              pp = clamp(pp + (Math.random() - 0.5) * 0.08 * cur.thinkHardMode, 0.03, 0.97);
            }
            const laserAng = lerp(startA + 0.04, endA - 0.04, pp);
            const cosL = Math.cos(laserAng), sinL = Math.sin(laserAng);

            // Narrow radial laser beam extending from inner bezel to outer power rail
            const beamGrad = ctx.createLinearGradient(
              ox + cosL * (baseRadius * 0.34), oy + sinL * (baseRadius * 0.34),
              ox + cosL * outerRailR, oy + sinL * outerRailR
            );
            beamGrad.addColorStop(0, rgba(liveColor.primary, 0.04 * lum * vAlpha));
            beamGrad.addColorStop(0.75, rgba(liveColor.bright, 0.35 * lum * vAlpha));
            beamGrad.addColorStop(1, rgba(liveColor.core, 0.96 * lum * vAlpha));

            ctx.strokeStyle = beamGrad;
            ctx.lineWidth = Math.max(1.5, 2.2 * scaleRatio);
            ctx.beginPath();
            ctx.moveTo(ox + cosL * (baseRadius * 0.34), oy + sinL * (baseRadius * 0.34));
            ctx.lineTo(ox + cosL * (outerRailR + 6 * scaleRatio), oy + sinL * (outerRailR + 6 * scaleRatio));
            ctx.stroke();

            // Laser impact hotspot on outer rail
            const hx = ox + cosL * radius, hy = oy + sinL * radius;
            const hR = Math.max(6, 11 * scaleRatio);
            const hGrad = ctx.createRadialGradient(hx, hy, 0, hx, hy, hR);
            hGrad.addColorStop(0, rgba(liveColor.core, 0.98 * Math.min(1, lum) * vAlpha));
            hGrad.addColorStop(0.45, rgba(liveColor.bright, 0.5 * Math.min(1, lum) * vAlpha));
            hGrad.addColorStop(1, rgba(liveColor.primary, 0));
            ctx.fillStyle = hGrad;
            ctx.beginPath();
            ctx.arc(hx, hy, hR, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function renderHoverReticle(t, lum, core) {
        if (!pointer.overCore || lum <= 0.14) return;
        const retR = core.coreR * 1.18;
        const spin = t * 0.95;
        for (let q = 0; q < 4; q++) {
          const a = spin + (q * Math.PI) / 2;
          drawNeonArc(core.coreX, core.coreY, retR, a - 0.15, a + 0.15, 1.5, liveColor.core, liveColor.bright, 0.72, 0.85);
        }
      }

      // --------------------------------------------------------------------------
      // VARIANT, STATE, PALETTE, PULSE & UI CONTROLLERS
      // --------------------------------------------------------------------------
      function setVariant(indexOrName) {
        let idx = -1;
        if (typeof indexOrName === 'number' && Number.isFinite(indexOrName)) {
          idx = ((Math.floor(indexOrName) % VARIANTS.length) + VARIANTS.length) % VARIANTS.length;
        } else if (typeof indexOrName === 'string') {
          const norm = indexOrName.trim().toLowerCase();
          if (norm.includes('aura') || norm === '1' || norm === 'i') idx = 0;
          else if (norm.includes('neural') || norm.includes('matrix') || norm === '2' || norm === 'ii') idx = 1;
          else if (norm.includes('chrono') || norm.includes('titan') || norm === '3' || norm === 'iii') idx = 2;
        }
        if (idx < 0 || idx >= VARIANTS.length || idx === activeVariantIndex) return;

        activeVariantIndex = idx;
        variantButtons.forEach((btn, i) => {
          const isAct = i === idx;
          btn.classList.toggle('variant-active', isAct);
          btn.setAttribute('aria-checked', isAct ? 'true' : 'false');
        });

        // Subtle holographic cross-dissolve shimmer pulse
        if (currentStateKey !== 'dead') {
          pulseImpulse = Math.max(pulseImpulse, 0.28);
        }
      }

      function updateStateButtonsUI(activeKey) {
        stateButtons.forEach((btn) => {
          btn.classList.toggle('pill-active', btn.dataset.state === activeKey);
        });
      }

      function setState(rawName) {
        const cleaned = String(rawName || '').trim().toLowerCase().replace(/[\s/-]+/g, '_');
        const aliasMap = {
          idle: 'idle', standby: 'idle', dull: 'idle',
          normal: 'normal', active: 'normal',
          listening: 'listening', listen: 'listening',
          speaking: 'speaking', speak: 'speaking',
          think_med: 'think_med', think_medium: 'think_med', thinking_med: 'think_med', medium: 'think_med',
          think_hard: 'think_hard', thinking_hard: 'think_hard', hard: 'think_hard',
          wake: 'wake', init: 'wake', wake_init: 'wake', awake: 'wake',
          dead: 'dead', offline: 'dead'
        };
        const key = aliasMap[cleaned];
        if (!key) return;

        if (key === 'wake') {
          triggerWakeInit();
          return;
        }

        wakeSeq.active = false;
        currentStateKey = key;
        updateStateButtonsUI(key);

        if (key === 'dead') {
          pulseImpulse = 0;
        } else if (key === 'idle') {
          pulseImpulse = 0.06;
        } else {
          pulseImpulse = Math.max(pulseImpulse, 0.34);
          shockwaves.push({
            progress: 0, speed: 1.5, maxRadiusFactor: 0.72, alpha: 0.54, thickness: 2.3
          });
        }
      }

      /**
       * Multi-stage ~3.2-second cinematic ignition sequence:
       *  0.00s - 0.40s : Total dark -> pinpoint white-hot central spark
       *  0.40s - 0.85s : Expanding radial shockwave flash materializing core
       *  0.85s - 2.00s : Staggered inner-to-outer concentric arc spin-up
       *  1.80s - 2.90s : Outer half-circle sweeps symmetrically online
       *  3.20s         : Smoothly settles into Normal
       */
      function triggerWakeInit() {
        wakeSeq.active = true;
        wakeSeq.elapsed = 0;
        wakeSeq.flashFired = false;

        cur.luminance = 0.02;
        cur.speedMult = 0.04;
        cur.muteFactor = 0.0;
        titanState.irisOpen = 0.0;
        currentStateKey = 'normal';
        updateStateButtonsUI('wake');
      }

      function triggerPulse() {
        if (currentStateKey === 'dead' && !wakeSeq.active) {
          triggerWakeInit();
          return;
        }
        pulseImpulse = 1.0;
        shockwaves.push(
          { progress: 0, speed: 1.25, maxRadiusFactor: 0.92, alpha: 0.92, thickness: 4.0 },
          { progress: -0.09, speed: 1.04, maxRadiusFactor: 0.78, alpha: 0.64, thickness: 2.2 }
        );
        // Excite neural nodes on pulse
        for (let i = 0; i < NEURAL_COUNT; i += 3) {
          neuralNodes[i].excite = 1.0;
        }
      }

      function setPalette(indexOrName) {
        let idx = -1;
        if (typeof indexOrName === 'number' && Number.isFinite(indexOrName)) {
          idx = ((Math.floor(indexOrName) % PALETTES.length) + PALETTES.length) % PALETTES.length;
        } else if (typeof indexOrName === 'string') {
          const norm = indexOrName.trim().toLowerCase().replace(/[\s-]+/g, '_');
          idx = PALETTES.findIndex((p) => p.id === norm || p.name.toLowerCase() === indexOrName.trim().toLowerCase());
        }
        if (idx < 0 || idx >= PALETTES.length) return;

        activePaletteIndex = idx;
        const pal = PALETTES[idx];
        activePaletteNameEl.textContent = pal.name.toUpperCase();

        const swatches = paletteRow.querySelectorAll('.palette-swatch');
        swatches.forEach((sw, i) => {
          const isAct = i === idx;
          sw.classList.toggle('swatch-active', isAct);
          sw.setAttribute('aria-checked', isAct ? 'true' : 'false');
        });
      }

      function toggleUI() {
        dockVisible = !dockVisible;
        bottomDock.classList.toggle('dock-hidden', !dockVisible);
        resizeCanvas();
      }

      function getStatus() {
        return {
          variantIndex: activeVariantIndex,
          variantId: VARIANTS[activeVariantIndex].id,
          variantName: VARIANTS[activeVariantIndex].name,
          state: wakeSeq.active ? 'wake' : currentStateKey,
          paletteIndex: activePaletteIndex,
          paletteId: PALETTES[activePaletteIndex].id,
          paletteName: PALETTES[activePaletteIndex].name,
          dockVisible
        };
      }

      function buildPaletteSwatches() {
        paletteRow.innerHTML = '';
        PALETTES.forEach((pal, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'palette-swatch' + (idx === 0 ? ' swatch-active' : '');
          btn.title = pal.name;
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-label', pal.name);
          btn.setAttribute('aria-checked', idx === 0 ? 'true' : 'false');
          btn.style.setProperty('--swatch-color', pal.hexPrimary);
          btn.style.background = `radial-gradient(circle at 35% 35%, #ffffff 0%, ${pal.hexBright} 34%, ${pal.hexPrimary} 78%, rgba(0,0,0,0.45) 100%)`;
          btn.style.boxShadow = `0 0 10px ${pal.hexPrimary}80`;
          btn.addEventListener('click', () => setPalette(idx));
          paletteRow.appendChild(btn);
        });
      }

      // --------------------------------------------------------------------------
      // EVENT LISTENERS (DOCK, CORE CLICK/TAP, PARALLAX, KEYBOARD SHORTCUTS)
      // --------------------------------------------------------------------------
      variantButtons.forEach((btn) => {
        btn.addEventListener('click', () => setVariant(parseInt(btn.dataset.variant, 10)));
      });

      stateButtons.forEach((btn) => {
        btn.addEventListener('click', () => setState(btn.dataset.state));
      });

      function isPointInCore(px, py) {
        const dx = px - cx, dy = py - cy;
        const r = baseRadius * 0.28;
        return dx * dx + dy * dy <= r * r;
      }

      window.addEventListener('mousemove', (e) => {
        pointer.normX = (e.clientX / Math.max(1, width) - 0.5) * 2;
        pointer.normY = (e.clientY / Math.max(1, height) - 0.5) * 2;
        pointer.overCore = isPointInCore(e.clientX, e.clientY);
        canvas.classList.toggle('over-core', pointer.overCore);
      });

      canvas.addEventListener('mouseleave', () => {
        pointer.normX = 0;
        pointer.normY = 0;
        pointer.overCore = false;
        canvas.classList.remove('over-core');
      });

      canvas.addEventListener('click', (e) => {
        if (isPointInCore(e.clientX, e.clientY)) {
          triggerPulse();
        }
      });

      canvas.addEventListener('touchend', (e) => {
        const t0 = e.changedTouches && e.changedTouches[0];
        if (t0 && isPointInCore(t0.clientX, t0.clientY)) {
          triggerPulse();
        }
      }, { passive: true });

      // Keyboard Shortcuts:
      // Q/W/E or V: Variants | 1-8: States | C: Palette | Space: Pulse | H: Toggle Dock
      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k === 'q') {
          setVariant(0);
        } else if (k === 'w') {
          setVariant(1);
        } else if (k === 'e') {
          setVariant(2);
        } else if (k === 'v') {
          setVariant((activeVariantIndex + 1) % VARIANTS.length);
        } else if (k >= '1' && k <= '8') {
          setState(STATE_KEYS[parseInt(k, 10) - 1]);
        } else if (k === 'c') {
          setPalette((activePaletteIndex + 1) % PALETTES.length);
        } else if (k === 'h') {
          toggleUI();
        } else if (e.code === 'Space') {
          e.preventDefault();
          triggerPulse();
        }
      });

      window.addEventListener('resize', resizeCanvas);

      // --------------------------------------------------------------------------
      // EXPOSE GLOBAL API: window.JARVIS
      // --------------------------------------------------------------------------
      window.JARVIS = {
        setVariant,
        setState,
        setPalette,
        pulse: triggerPulse,
        toggleUI,
        getStatus
      };

      // --------------------------------------------------------------------------
      // MAIN 60FPS ANIMATION LOOP
      // --------------------------------------------------------------------------
      function animate(timestamp) {
        try {
          if (!lastTime) lastTime = timestamp;
          const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
          lastTime = timestamp;
          elapsedTime += dt;

          // 1. Smoothly interpolate live RGB color palette
          const targetPal = PALETTES[activePaletteIndex];
          const colorEase = Math.min(1, dt * 6.8);
          lerpRgb(liveColor.primary, targetPal.primary, colorEase);
          lerpRgb(liveColor.bright, targetPal.bright, colorEase);
          lerpRgb(liveColor.core, targetPal.core, colorEase);
          lerpRgb(liveColor.deep, targetPal.deep, colorEase);
          syncDockCssVariables();

          // 2. Smooth cross-dissolve weights between the 3 architectural variants
          const dissolveEase = Math.min(1, dt * 7.2);
          for (let v = 0; v < 3; v++) {
            const targetW = v === activeVariantIndex ? 1.0 : 0.0;
            variantWeights[v] = lerp(variantWeights[v], targetW, dissolveEase);
            if (variantWeights[v] < 0.005 && targetW === 0) variantWeights[v] = 0;
            if (variantWeights[v] > 0.995 && targetW === 1) variantWeights[v] = 1;
          }

          // 3. Advance ~3.2s Multi-Stage Wake / Init Timeline
          let wakeCoreProgress = 1.0;
          let wakeOuterProgress = 1.0;

          if (wakeSeq.active) {
            wakeSeq.elapsed += dt;
            const wt = wakeSeq.elapsed;

            wakeCoreProgress = smoothstep(0.15, 0.85, wt);

            if (wt >= 0.40 && !wakeSeq.flashFired) {
              wakeSeq.flashFired = true;
              pulseImpulse = 1.0;
              shockwaves.push(
                { progress: 0, speed: 1.12, maxRadiusFactor: 0.96, alpha: 0.98, thickness: 5.2 },
                { progress: -0.09, speed: 0.92, maxRadiusFactor: 0.84, alpha: 0.76, thickness: 2.8 }
              );
            }

            wakeOuterProgress = smoothstep(1.80, 2.90, wt);

            if (wt >= wakeSeq.duration) {
              wakeSeq.active = false;
              currentStateKey = 'normal';
              updateStateButtonsUI('normal');
            }
          }

          // 4. Smoothly interpolate behavioral parameters toward target state
          const target = STATE_PROFILES[currentStateKey];
          const ease = Math.min(1, dt * (wakeSeq.active ? 3.5 : 4.8));

          cur.speedMult = lerp(cur.speedMult, target.speedMult, ease);
          const targetLum = wakeSeq.active ? clamp(0.14 + wakeSeq.elapsed * 0.82, 0.14, 1.32) : target.luminance;
          cur.luminance = lerp(cur.luminance, targetLum, ease);
          cur.muteFactor = lerp(cur.muteFactor, target.muteFactor, ease);
          cur.corePulseAmp = lerp(cur.corePulseAmp, target.corePulseAmp, ease);
          cur.corePulseFreq = lerp(cur.corePulseFreq, target.corePulseFreq, ease);
          cur.synapseRate = lerp(cur.synapseRate, target.synapseRate, ease);
          cur.irisTarget = lerp(cur.irisTarget, target.irisTarget, ease);
          cur.arcTightness = lerp(cur.arcTightness, target.arcTightness, ease);
          cur.outerBreathAmp = lerp(cur.outerBreathAmp, target.outerBreathAmp, ease);
          cur.outerSwayAmp = lerp(cur.outerSwayAmp, target.outerSwayAmp, ease);
          cur.scanSpeed = lerp(cur.scanSpeed, target.scanSpeed, ease);
          cur.listeningMode = lerp(cur.listeningMode, target.listeningMode, ease);
          cur.speakingMode = lerp(cur.speakingMode, target.speakingMode, ease);
          cur.thinkMedMode = lerp(cur.thinkMedMode, target.thinkMedMode, ease);
          cur.thinkHardMode = lerp(cur.thinkHardMode, target.thinkHardMode, ease);
          cur.vibrationAmp = lerp(cur.vibrationAmp, target.vibrationAmp, ease);
          cur.particleRatio = lerp(cur.particleRatio, target.particleRatio, ease);

          // 5. Dead-state occasional faint dying-ember micro-flickers
          if (currentStateKey === 'dead' && !wakeSeq.active) {
            nextDeadFlicker -= dt;
            if (nextDeadFlicker <= 0) {
              deadFlicker = 0.5 + Math.random() * 0.42;
              nextDeadFlicker = 2.4 + Math.random() * 4.2;
            }
            deadFlicker *= Math.pow(0.03, dt);
            if (deadFlicker < 0.005) deadFlicker = 0;
          } else {
            deadFlicker = 0;
          }

          // 6. Envelopes, parallax, impulses & outer arc kinematics
          updateEnvelopes(dt, elapsedTime);
          updateOuterKinematics(elapsedTime, dt);

          pointer.smoothX = lerp(pointer.smoothX, pointer.normX, Math.min(1, dt * 5.2));
          pointer.smoothY = lerp(pointer.smoothY, pointer.normY, Math.min(1, dt * 5.2));
          pulseImpulse *= Math.pow(0.08, dt);
          if (pulseImpulse < 0.002) pulseImpulse = 0;

          const listeningLevel = getListeningLevel(elapsedTime);
          const lum = cur.luminance;
          const dynBloom =
            cur.speakingMode * speechEnv * 0.36 +
            cur.thinkMedMode * thinkPulseValue * 0.34 +
            cur.thinkHardMode * 0.48;
          const totalEnergy =
            speechEnv * cur.speakingMode +
            listeningLevel * cur.listeningMode * 0.55 +
            thinkPulseValue * cur.thinkMedMode * 0.65 +
            cur.thinkHardMode * 0.78 +
            pulseImpulse * 1.1;

          const core = computeCoreMetrics(elapsedTime, listeningLevel, lum, wakeCoreProgress);
          const og = computeOuterGeometry(elapsedTime, wakeOuterProgress);

          // --- RENDER SCENE ---
          renderBackground(elapsedTime, totalEnergy, lum);

          // Render any architectural variant with active cross-dissolve weight
          if (variantWeights[0] > 0.006) {
            renderVariantAura(variantWeights[0], elapsedTime, dt, core, og, listeningLevel, lum, dynBloom);
          }
          if (variantWeights[1] > 0.006) {
            renderVariantNeural(variantWeights[1], elapsedTime, dt, core, og, listeningLevel, lum, dynBloom);
          }
          if (variantWeights[2] > 0.006) {
            renderVariantTitan(variantWeights[2], elapsedTime, dt, core, og, listeningLevel, lum, dynBloom);
          }

          // Shared state overlays (radar cone, oscilloscopes, sonar/vocal/think ripples, shockwaves)
          renderSharedOuterWaveOverlays(elapsedTime, listeningLevel, lum, og);
          renderSharedBehavioralOverlays(elapsedTime, dt, listeningLevel, lum);
          renderHoverReticle(elapsedTime, lum, core);

          // Think Hard crackling branching synaptic lightning arcs
          if (cur.thinkHardMode > 0.15 && lum > 0.45) {
            lightningTimer -= dt * (1.5 + cur.thinkHardMode * 6.0);
            if (lightningTimer <= 0) {
              lightningTimer = 0.065 + Math.random() * 0.11;
              spawnLightningBolt(core.coreX, core.coreY, core.coreR);
              if (Math.random() < 0.6) spawnLightningBolt(core.coreX, core.coreY, core.coreR);
            }
          }
          renderLightningBolts(dt);
        } catch (err) {
          console.error('Animation loop error:', err);
        }

        requestAnimationFrame(animate);
      }

      // --------------------------------------------------------------------------
      // INITIALIZATION ON WINDOW LOAD (Variant I · Aura Core, Neon Orange, Normal)
      // --------------------------------------------------------------------------
      window.onload = function () {
        buildPaletteSwatches();
        setPalette(0);
        updateStateButtonsUI('normal');
        resizeCanvas();
        requestAnimationFrame(animate);
      };
    })();
  </script>
