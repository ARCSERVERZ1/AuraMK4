<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S. // Holographic AI Core Showcase</title>
  <style>
    /* =========================================================================
       PURE OBSIDIAN FULL-SCREEN VIEWPORT & DYNAMIC LIVE PALETTE TOKENS
       ========================================================================= */
    :root {
      --p-rgb: 255, 106, 0;
      --b-rgb: 255, 170, 34;
      --c-rgb: 255, 242, 214;
      --d-rgb: 112, 28, 0;
      --font-display: 'Orbitron', 'Space Grotesk', 'Eurostile', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'Share Tech Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      color: #f3f4f6;
      font-family: var(--font-display);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Full-screen high-DPI canvas filling 100vw x 100vh */
    #aiCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background-color: #030408;
      cursor: default;
    }

    #aiCanvas.over-core {
      cursor: pointer;
    }

    /* =========================================================================
       ULTRA-MINIMAL FLOATING GLASSMORPHIC BOTTOM DOCK (3 COMPACT ROWS)
       ========================================================================= */
    .dock-wrapper {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 0 12px;
      pointer-events: none;
    }

    #bottomDock {
      pointer-events: auto;
      max-width: min(96vw, 760px);
      border-radius: 18px;
      padding: 9px 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      background: linear-gradient(
        165deg,
        rgba(8, 10, 19, 0.72),
        rgba(3, 5, 11, 0.86)
      );
      border: 1px solid rgba(var(--p-rgb), 0.28);
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.8),
        0 0 28px rgba(var(--p-rgb), 0.14),
        inset 0 0 18px rgba(var(--p-rgb), 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:
        opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.2s linear,
        box-shadow 0.2s linear;
    }

    #bottomDock.dock-hidden {
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      pointer-events: none;
    }

    /* Row 1: 3 Sleek Variant Selector Pills */
    .dock-row-variants {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .variant-pill {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(12, 15, 26, 0.62);
      border: 1px solid rgba(var(--p-rgb), 0.22);
      color: rgba(226, 232, 245, 0.7);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .variant-pill .key-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(var(--p-rgb), 0.14);
      color: rgb(var(--b-rgb));
      opacity: 0.8;
    }

    .variant-pill:hover {
      background: rgba(var(--p-rgb), 0.16);
      border-color: rgba(var(--b-rgb), 0.62);
      color: rgb(var(--c-rgb));
      box-shadow: 0 0 14px rgba(var(--p-rgb), 0.25);
    }

    .variant-pill.variant-active {
      background: linear-gradient(
        135deg,
        rgba(var(--p-rgb), 0.34),
        rgba(var(--b-rgb), 0.18)
      );
      border-color: rgba(var(--c-rgb), 0.88);
      color: rgb(var(--c-rgb));
      box-shadow:
        0 0 18px rgba(var(--p-rgb), 0.48),
        inset 0 0 12px rgba(var(--b-rgb), 0.22);
      text-shadow: 0 0 10px rgba(var(--p-rgb), 0.85);
    }

    .variant-pill.variant-active .key-badge {
      background: rgba(var(--c-rgb), 0.22);
      color: rgb(var(--c-rgb));
      opacity: 1;
    }

    /* Subtle hairline horizontal divider */
    .h-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(var(--p-rgb), 0.26),
        rgba(var(--c-rgb), 0.18),
        rgba(var(--p-rgb), 0.26),
        transparent
      );
    }

    /* Row 2: 8 Glowing Color Swatches + Active Palette Label */
    .dock-row-palettes {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    #paletteRow {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .palette-swatch {
      position: relative;
      width: 17px;
      height: 17px;
      padding: 0;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      cursor: pointer;
      flex-shrink: 0;
      transition:
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .palette-swatch:hover {
      transform: scale(1.22);
      border-color: rgba(255, 255, 255, 0.85);
    }

    .palette-swatch.swatch-active {
      transform: scale(1.24);
      border-color: #ffffff;
      box-shadow:
        0 0 0 2px rgba(3, 4, 8, 0.94),
        0 0 0 3.5px var(--swatch-color),
        0 0 15px var(--swatch-color);
    }

    #activePaletteName {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgb(var(--c-rgb));
      text-shadow: 0 0 10px rgba(var(--p-rgb), 0.72);
      min-width: 112px;
      text-align: center;
    }

    /* Row 3: 8 Compact Behavioral State Pills */
    .dock-row-states {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 1px;
      scrollbar-width: thin;
      scrollbar-color: rgba(var(--p-rgb), 0.35) transparent;
    }

    .dock-row-states::-webkit-scrollbar {
      height: 3px;
    }
    .dock-row-states::-webkit-scrollbar-track {
      background: transparent;
    }
    .dock-row-states::-webkit-scrollbar-thumb {
      background: rgba(var(--p-rgb), 0.35);
      border-radius: 999px;
    }

    .state-pill {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(13, 15, 25, 0.58);
      border: 1px solid rgba(var(--p-rgb), 0.2);
      color: rgba(228, 234, 246, 0.68);
      font-family: var(--font-display);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5.5px 9.5px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .state-pill .key-num {
      font-family: var(--font-mono);
      font-size: 8.5px;
      opacity: 0.58;
      color: rgb(var(--b-rgb));
    }

    .state-pill:hover {
      background: rgba(var(--p-rgb), 0.14);
      border-color: rgba(var(--b-rgb), 0.58);
      color: rgba(var(--c-rgb), 0.98);
      box-shadow: 0 0 14px rgba(var(--p-rgb), 0.24);
    }

    .state-pill.pill-active {
      background: linear-gradient(
        135deg,
        rgba(var(--p-rgb), 0.32),
        rgba(var(--b-rgb), 0.16)
      );
      border-color: rgba(var(--c-rgb), 0.86);
      color: rgb(var(--c-rgb));
      box-shadow:
        0 0 18px rgba(var(--p-rgb), 0.45),
        inset 0 0 12px rgba(var(--b-rgb), 0.22);
      text-shadow: 0 0 10px rgba(var(--p-rgb), 0.85);
    }

    .state-pill.pill-active .key-num {
      opacity: 0.96;
      color: rgb(var(--c-rgb));
    }

    /* Responsive Mobile Layout Adjustments */
    @media (max-width: 720px) {
      .dock-wrapper {
        bottom: 8px;
        padding: 0 8px;
      }
      #bottomDock {
        padding: 8px 10px;
        border-radius: 15px;
        gap: 6px;
      }
      .variant-pill {
        font-size: 9px;
        padding: 5px 9px;
      }
      #activePaletteName {
        min-width: auto;
        font-size: 9.5px;
      }
      .dock-row-states {
        justify-content: flex-start;
      }
      .state-pill {
        font-size: 8.8px;
        padding: 5.5px 8.5px;
      }
    }

      function drawNeonArc(x, y, radius, startA, endA, lineWidth, coreCol, glowCol, alpha, glowScale = 1, lumOverride = null) {

        ctx.strokeStyle = rgba(glowCol, alpha * 0.14 * glowScale * lum, m);
        ctx.lineWidth = lineWidth * 3.8;

        // Pass 2: Intense inner bloom

        ctx.arc(x, y, radius, startA, endA);
        ctx.strokeStyle = rgba(glowCol, alpha * 0.34 * glowScale * lum, m);
        ctx.lineWidth = lineWidth * 1.9;

      function drawTaperedCrescent(x, y, radius, startA, span, maxW, coreCol, glowCol, alpha, lum) {
        if (radius <= 1 || alpha <= 0.005) return;
        const steps = 26;
        ctx.save();
        ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
        ctx.beginPath();

        for (let i = 0; i <= steps; i++) {
          const f = i / steps;
          const a = startA + f * span;
          const w = Math.sin(f * Math.PI) * maxW * 0.5;
          const px = x + Math.cos(a) * (radius + w);
          const py = y + Math.sin(a) * (radius + w);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        for (let i = steps; i >= 0; i--) {
          const f = i / steps;
          const a = startA + f * span;
          const w = Math.sin(f * Math.PI) * maxW * 0.5;
          ctx.lineTo(x + Math.cos(a) * (radius - w), y + Math.sin(a) * (radius - w));
        }
        ctx.closePath();

        if (lum <= 0.06) {
          ctx.fillStyle = rgba(DEAD_METAL, alpha * 0.5);

          ctx.fillStyle = rgba(glowCol, alpha * 0.34 * Math.min(1.2, lum), cur.muteFactor);

          ctx.stroke();

      // --------------------------------------------------------------------------

      function updateEnvelopes(dt, t) {
        // 1. Multi-syllable speech cadence envelope
        speechBurstTimer -= dt;
        if (speechBurstTimer <= 0) {
          if (speechInPhrase && Math.random() < 0.24) {
            speechInPhrase = false;
            speechBurstTimer = 0.2 + Math.random() * 0.32;
            speechTarget = 0.05;
          } else {
            speechInPhrase = true;
            speechBurstTimer = 0.09 + Math.random() * 0.16;
            speechTarget = 0.42 + Math.random() * 0.58;
          }
        }
        const syllableWave = speechInPhrase
          ? (0.56 + 0.44 * Math.sin(t * 20.5 + Math.sin(t * 5.8) * 2.2))
          : 0.12;
        speechEnv = lerp(speechEnv, speechTarget * syllableWave, Math.min(1, dt * 15));

        // Emit outward vocal shockwave ripples on syllable peaks
        vocalRippleCooldown -= dt;
        if (
          cur.speakingMode > 0.35 &&
          cur.luminance > 0.2 &&
          speechEnv > 0.54 &&
          prevSpeechEnv <= 0.54 &&
          vocalRippleCooldown <= 0
        ) {
          vocalRippleCooldown = 0.18;
          if (vocalRipples.length < 8) {
            vocalRipples.push({
              progress: 0,
              speed: 0.76 + speechEnv * 0.38,
              strength: 0.56 + speechEnv * 0.44,
              thickness: 1.8 + speechEnv * 1.9
            });
          }
        }
        prevSpeechEnv = speechEnv;

        // 2. Smooth elastic analytical resonance for Think Med (0.84x -> 1.26x orb scale)
        const rawThinkWave = 0.5 + 0.5 * Math.sin(t * 2.4 - Math.PI * 0.5 + Math.sin(t * 1.2) * 0.24);
        thinkPulseValue = Math.pow(rawThinkWave, 1.1);

        if (
          cur.thinkMedMode > 0.45 &&
          cur.luminance > 0.2 &&
          thinkPulseValue > 0.88 &&
          prevThinkPulseValue <= 0.88 &&
          thinkRipples.length < 5
        ) {
          thinkRipples.push({
            progress: 0,
            speed: 0.58,
            alpha: 0.74,
            thickness: 2.4
          });
        }
        prevThinkPulseValue = thinkPulseValue;

        // Push into sympathetic lag circular buffers
        lagHead = (lagHead + 1) % LAG_LEN;
        speakLagBuf[lagHead] = speechEnv;
        thinkLagBuf[lagHead] = thinkPulseValue;
      }

      function getLag(buf, framesBack) {

        const burst = Math.max(0, Math.sin(t * 2.05) * Math.sin(t * 5.6 + 0.7));
        return clamp(0.24 + 0.18 * Math.sin(t * 8.2) + burst * 0.56, 0.08, 0.96);

      // --------------------------------------------------------------------------
      // PROCEDURAL BRANCHING SYNAPTIC LIGHTNING ARCS (THINK HARD)
      // --------------------------------------------------------------------------
      function spawnLightningBolt(coreX, coreY, coreR) {
        const inside = Math.random() < 0.45;
        const startA = Math.random() * Math.PI * 2;
        const endA = startA + (Math.random() - 0.5) * 1.4;
        const r1 = inside ? coreR * (0.12 + Math.random() * 0.35) : coreR * 0.9;
        const r2 = inside ? coreR * 0.96 : baseRadius * (0.38 + Math.random() * 0.38);

        const x1 = coreX + Math.cos(startA) * r1;
        const y1 = coreY + Math.sin(startA) * r1;
        const x2 = coreX + Math.cos(endA) * r2;
        const y2 = coreY + Math.sin(endA) * r2;

        const segs = 7;
        const pts = [{ x: x1, y: y1 }];
        for (let i = 1; i < segs; i++) {
          const f = i / segs;
          const jitter = (inside ? coreR * 0.22 : baseRadius * 0.068) * (1 - Math.abs(f - 0.5));
          pts.push({
            x: lerp(x1, x2, f) + (Math.random() - 0.5) * jitter * 2,
            y: lerp(y1, y2, f) + (Math.random() - 0.5) * jitter * 2
          });
        }
        pts.push({ x: x2, y: y2 });

        let branch = null;
        if (Math.random() < 0.6) {
          const forkIdx = 2 + Math.floor(Math.random() * 3);
          const origin = pts[forkIdx];
          const bAng = endA + (Math.random() > 0.5 ? 0.52 : -0.52);
          const bLen = baseRadius * (0.08 + Math.random() * 0.12);
          branch = [
            origin,
            {
              x: origin.x + Math.cos(bAng) * bLen * 0.5 + (Math.random() - 0.5) * 10,
              y: origin.y + Math.sin(bAng) * bLen * 0.5 + (Math.random() - 0.5) * 10
            },
            {
              x: origin.x + Math.cos(bAng) * bLen,
              y: origin.y + Math.sin(bAng) * bLen
            }
          ];
        }

        lightningBolts.push({
          pts,
          branch,
          life: 0.08 + Math.random() * 0.13,
          maxLife: 0.21
        });
      }

      function renderLightningBolts(dt) {
        if (lightningBolts.length === 0) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = lightningBolts.length - 1; i >= 0; i--) {
          const b = lightningBolts[i];
          b.life -= dt;
          if (b.life <= 0) {
            lightningBolts.splice(i, 1);
            continue;
          }
          const alpha = clamp(b.life / b.maxLife, 0, 1);

          const drawChain = (points, wMult) => {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let k = 1; k < points.length; k++) ctx.lineTo(points[k].x, points[k].y);

            ctx.strokeStyle = rgba(liveColor.primary, alpha * 0.46);
            ctx.lineWidth = 4.6 * wMult;
            ctx.stroke();

            ctx.strokeStyle = rgba(liveColor.bright, alpha * 0.72);
            ctx.lineWidth = 2.1 * wMult;
            ctx.stroke();

            ctx.strokeStyle = rgba(liveColor.core, alpha * 0.98);
            ctx.lineWidth = 1.05 * wMult;
            ctx.stroke();
          };

          drawChain(b.pts, 1.0);
          if (b.branch) drawChain(b.branch, 0.65);
        }
        ctx.restore();
      }

        bgGrad.addColorStop(0.36, rgba(liveColor.deep, (0.21 + totalEnergy * 0.08) * lum, m));
        bgGrad.addColorStop(0.76, rgba(liveColor.deep, 0.04 * lum, m));

        ctx.fillRect(0, 0, width, height);

        if (lum > 0.05 && cur.particleRatio > 0.02) {
          ctx.save();

          const count = Math.floor(AMBIENT_COUNT * clamp(cur.particleRatio, 0, 1));

            const p = ambientParticles[i];
            const a = p.angle + t * p.speed * (0.24 + cur.speedMult * 0.6 + pulseImpulse * 2.1);
            const r = baseRadius * p.distFactor;
            const px = cx + Math.cos(a) * r + pointer.smoothX * 14 * p.distFactor;
            const py = cy + Math.sin(a) * r + pointer.smoothY * 14 * p.distFactor;
            const twinkle = 0.5 + 0.5 * Math.sin(t * 2.1 + p.twinklePhase);

            ctx.fillStyle = rgba(liveColor.bright, p.alpha * twinkle * lum * (0.65 + totalEnergy * 0.45), m);
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // --------------------------------------------------------------------------
      // SHARED CORE METRICS (THINK MED 0.84x-1.26x, SPEAKING CADENCE, PARALLAX)
      // --------------------------------------------------------------------------
      function computeCoreMetrics(t, listeningLevel, lum, wakeCoreProgress) {
        const baseBreath = Math.sin(t * cur.corePulseFreq) * cur.corePulseAmp;
        // Think Med: Deep resonant elastic orb pulsing (0.84x -> 1.26x)
        const thinkScaleOffset = cur.thinkMedMode * ((thinkPulseValue * 0.42) - 0.16);
        // Speaking: Rhythmic multi-syllable core cadence
        const speakScaleOffset = cur.speakingMode * ((speechEnv * 0.15) - 0.04);
        // Listening: Attentive micro-pulse
        const listenOffset = cur.listeningMode * listeningLevel * 0.032;
        const impulseOffset = pulseImpulse * 0.12;

        let coreScale = 1.0 + baseBreath + thinkScaleOffset + speakScaleOffset + listenOffset + impulseOffset;
        if (wakeSeq.active) {
          coreScale = lerp(0.06, 1.0 + impulseOffset, wakeCoreProgress);
        }

        const coreR = Math.max(7, baseRadius * 0.228 * clamp(coreScale, 0.06, 1.34));
        const vibX = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.3 * cur.vibrationAmp : 0;
        const vibY = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.3 * cur.vibrationAmp : 0;
        const coreX = cx + pointer.smoothX * (baseRadius * 0.025) * Math.min(1, lum) + vibX;
        const coreY = cy + pointer.smoothY * (baseRadius * 0.025) * Math.min(1, lum) + vibY;

        return { coreX, coreY, coreR, coreScale };
      }

      // --------------------------------------------------------------------------
      // SHARED OUTER HALF-CIRCLE KINEMATICS & STATE WAVE/RADAR OVERLAYS
      // --------------------------------------------------------------------------
      function updateOuterKinematics(t, dt) {
        if (currentStateKey === 'think_hard') {
          outerArcState.baseAngle += dt * 0.24;
        } else if (currentStateKey === 'think_med') {
          outerArcState.baseAngle += dt * 0.08;
        } else if (currentStateKey !== 'dead') {
          outerArcState.baseAngle = lerp(outerArcState.baseAngle, -Math.PI * 0.5, dt * 1.15);
        }

        const sway = Math.sin(t * 0.54) * cur.outerSwayAmp;
        outerArcState.currentAngle = outerArcState.baseAngle + sway;

        if (cur.luminance > 0.08) {
          outerArcState.scanPhase = (outerArcState.scanPhase + dt * (cur.scanSpeed + pulseImpulse * 1.4)) % 2;
          outerArcState.scanPhase2 = (outerArcState.scanPhase2 + dt * (cur.scanSpeed * 1.38 + 0.65)) % 2;
        }
      }

      function computeOuterGeometry(t, wakeOuterProgress) {
        const thinkLag = getLag(thinkLagBuf, 18) * cur.thinkMedMode;
        const speakLag = getLag(speakLagBuf, 14) * cur.speakingMode;
        const breath =
          Math.sin(t * 1.12) * cur.outerBreathAmp +
          pulseImpulse * 0.026 +
          (thinkLag - 0.4) * 0.032 +
          speakLag * 0.022;
        const radius = baseRadius * outerArcState.radiusFactor * (1 + breath);
        const halfSpan = outerArcState.arcSpan * 0.5 * wakeOuterProgress;
        const startA = outerArcState.currentAngle - halfSpan;
        const endA = outerArcState.currentAngle + halfSpan;
        const vibX = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 1.8 * cur.vibrationAmp : 0;
        const vibY = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 1.8 * cur.vibrationAmp : 0;
        return { ox: cx + vibX, oy: cy + vibY, radius, halfSpan, startA, endA };
      }

      /**
       * Renders shared state-driven radar cone (Listening) and curved oscilloscopes
       * (Listening + Dual-Layered Harmonic Vocal Oscilloscope for Speaking) along the outer half-circle.
       */
      function renderSharedOuterWaveOverlays(t, listeningLevel, lum, og) {
        const { ox, oy, radius, halfSpan, startA, endA } = og;
        if (halfSpan <= 0.1 || lum <= 0.14) return;
        const scaleRatio = baseRadius / 260;

        // 1. Sweeping Translucent Radar Cone (LISTENING)
        if (cur.listeningMode > 0.04) {
          const lm = cur.listeningMode * Math.min(1, lum);
          const sweepOsc = Math.sin(t * 1.48) * (halfSpan * 0.76);
          outerArcState.radarAngle = outerArcState.currentAngle + sweepOsc;
          const coneSpread = 0.27 + listeningLevel * 0.14;

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const coneGrad = ctx.createRadialGradient(ox, oy, baseRadius * 0.22, ox, oy, radius);
          coneGrad.addColorStop(0, rgba(liveColor.core, 0.02 * lm));
          coneGrad.addColorStop(0.62, rgba(liveColor.bright, (0.1 + listeningLevel * 0.12) * lm));
          coneGrad.addColorStop(1, rgba(liveColor.core, (0.22 + listeningLevel * 0.14) * lm));

          ctx.fillStyle = coneGrad;
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.arc(ox, oy, radius * 0.99, outerArcState.radarAngle - coneSpread, outerArcState.radarAngle + coneSpread);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = rgba(liveColor.core, (0.5 + listeningLevel * 0.4) * lm);
          ctx.lineWidth = Math.max(1.2, 1.65 * scaleRatio);
          ctx.beginPath();
          ctx.moveTo(ox + Math.cos(outerArcState.radarAngle) * baseRadius * 0.28, oy + Math.sin(outerArcState.radarAngle) * baseRadius * 0.28);
          ctx.lineTo(ox + Math.cos(outerArcState.radarAngle) * radius, oy + Math.sin(outerArcState.radarAngle) * radius);
          ctx.stroke();
          ctx.restore();

          // Curved Live Acoustic Oscilloscope along Outer Arc (LISTENING)
          const samples = 88;
          const wStart = startA + 0.07;
          const wEnd = endA - 0.07;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.beginPath();
          for (let s = 0; s <= samples; s++) {
            const frac = s / samples;
            const ang = lerp(wStart, wEnd, frac);
            const bell = Math.pow(Math.sin(frac * Math.PI), 0.85);
            const disp = (
              Math.sin(frac * 28 + t * 14.5) * 0.5 +
              Math.sin(frac * 54 - t * 22.0) * 0.3 +
              Math.cos(frac * 14 + t * 9.0) * 0.22
            ) * listeningLevel;
            const rr = radius + disp * bell * baseRadius * 0.056;
            const wx = ox + Math.cos(ang) * rr;
            const wy = oy + Math.sin(ang) * rr;
            if (s === 0) ctx.moveTo(wx, wy);
            else ctx.lineTo(wx, wy);
          }
          ctx.strokeStyle = rgba(liveColor.primary, 0.36 * lm);
          ctx.lineWidth = Math.max(3.2, 4.6 * scaleRatio);
          ctx.stroke();
          ctx.strokeStyle = rgba(liveColor.core, 0.94 * lm);
          ctx.lineWidth = Math.max(1.25, 1.8 * scaleRatio);
          ctx.stroke();
          ctx.restore();
        }

        // 2. Dual-Layered Harmonic Vocal Oscilloscope riding along Outer Arc (SPEAKING)
        if (cur.speakingMode > 0.04) {
          const sm = cur.speakingMode * Math.min(1, lum);
          const samples = 96;
          const wStart = startA + 0.07;
          const wEnd = endA - 0.07;

          for (let layerIdx = 0; layerIdx < 2; layerIdx++) {
            const isPrimary = layerIdx === 0;
            const freqScale = isPrimary ? 1.0 : 1.65;
            const ampScale = isPrimary ? 1.0 : 0.56;
            const phaseShift = isPrimary ? 0 : 1.85;

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            for (let s = 0; s <= samples; s++) {
              const frac = s / samples;
              const ang = lerp(wStart, wEnd, frac);
              const envWindow = Math.pow(Math.sin(frac * Math.PI), 0.85);
              const harm =
                Math.sin(frac * 22 * freqScale - t * 13.5 + phaseShift) * 0.52 +
                Math.sin(frac * 44 * freqScale + t * 21.0 - phaseShift) * 0.30 +
                Math.cos(frac * 12 * freqScale - t * 8.2) * 0.24;
              const amp = (0.16 + speechEnv * 0.95) * ampScale * envWindow;
              const rr = radius + harm * amp * baseRadius * 0.068;
              const wx = ox + Math.cos(ang) * rr;
              const wy = oy + Math.sin(ang) * rr;
              if (s === 0) ctx.moveTo(wx, wy);
              else ctx.lineTo(wx, wy);
            }
            ctx.strokeStyle = rgba(isPrimary ? liveColor.primary : liveColor.bright, (isPrimary ? 0.38 : 0.24) * sm);
            ctx.lineWidth = Math.max(3.0, (isPrimary ? 5.2 : 3.4) * scaleRatio);
            ctx.stroke();
            ctx.strokeStyle = rgba(isPrimary ? liveColor.core : liveColor.bright, (isPrimary ? 0.96 : 0.68) * sm);
            ctx.lineWidth = Math.max(1.2, (isPrimary ? 1.9 : 1.25) * scaleRatio);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      /**
       * Renders shared Listening inward sonar ripples + tightening brackets,
       * Speaking outward ripples + harmonic voice rings, Think Med ripples, and Shockwaves.
       */
      function renderSharedBehavioralOverlays(t, dt, listeningLevel, lum) {
        const scaleRatio = baseRadius / 260;

        // A. Listening: Inward-Collapsing Concentric Sonar Ripples + Tightening Brackets
        const lm = cur.listeningMode;
        if (lm > 0.3 && lum > 0.2) {
          inwardRippleTimer -= dt * (1 + listeningLevel * 1.55);
          if (inwardRippleTimer <= 0) {
            inwardRippleTimer = 0.44;
            inwardRipples.push({
              progress: 0,
              speed: 0.68 + listeningLevel * 0.44,
              strength: 0.5 + listeningLevel * 0.5
            });
          }
        }

        for (let i = inwardRipples.length - 1; i >= 0; i--) {
          const rip = inwardRipples[i];
          rip.progress += dt * rip.speed;
          if (rip.progress >= 1) {
            inwardRipples.splice(i, 1);
            continue;
          }
          const eased = Math.pow(rip.progress, 1.14);
          const r = baseRadius * lerp(0.84, 0.23, eased);
          const env = Math.sin(rip.progress * Math.PI);
          const alpha = env * rip.strength * Math.max(0.25, lm) * Math.min(1, lum);
          drawNeonArc(cx, cy, r, 0, Math.PI * 2, Math.max(1.2, (1.4 + (1 - rip.progress) * 1.65) * scaleRatio), liveColor.core, liveColor.bright, alpha, 1.18);
        }

        if (lm > 0.04 && lum > 0.15) {
          const tighten = 1 - listeningLevel * 0.09;
          const bracketR = baseRadius * 0.305 * tighten;
          const bracketSpin = Math.sin(t * 0.92) * 0.14;
          for (let q = 0; q < 4; q++) {
            const centerA = bracketSpin + Math.PI * 0.25 + q * (Math.PI * 0.5);
            const span = 0.22 - listeningLevel * 0.04;
            drawNeonArc(cx, cy, bracketR, centerA - span, centerA + span, Math.max(2.0, 2.8 * scaleRatio), liveColor.core, liveColor.bright, 0.9 * lm * Math.min(1, lum), 1.22);

            const cosC = Math.cos(centerA), sinC = Math.sin(centerA);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = rgba(liveColor.core, 0.85 * lm * Math.min(1, lum));
            ctx.lineWidth = Math.max(1.4, 1.8 * scaleRatio);
            ctx.beginPath();
            ctx.moveTo(cx + cosC * bracketR, cy + sinC * bracketR);
            ctx.lineTo(cx + cosC * (bracketR - 8 * scaleRatio), cy + sinC * (bracketR - 8 * scaleRatio));
            ctx.stroke();
            ctx.restore();
          }
        }

        // B. Speaking: Outward-Radiating Syllable Shockwave Ripples + Layered Harmonic Voice Rings
        for (let i = vocalRipples.length - 1; i >= 0; i--) {
          const vr = vocalRipples[i];
          vr.progress += dt * vr.speed;
          if (vr.progress >= 1) {
            vocalRipples.splice(i, 1);
            continue;
          }
          const eased = 1 - Math.pow(1 - vr.progress, 2.2);
          const r = baseRadius * lerp(0.24, 0.88, eased);
          const fade = Math.sin(Math.min(1, vr.progress * 1.15) * Math.PI) * (1 - vr.progress * 0.55);
          const alpha = clamp(fade * vr.strength * Math.min(1, lum), 0, 0.95);
          drawNeonArc(cx, cy, r, 0, Math.PI * 2, Math.max(1.1, vr.thickness * (1 - vr.progress * 0.45) * scaleRatio), liveColor.core, liveColor.bright, alpha, 1.25);
        }

        if (cur.speakingMode > 0.04 && lum > 0.15) {
          const sm = cur.speakingMode * Math.min(1, lum);
          for (let h = 0; h < 2; h++) {
            const baseR = baseRadius * (0.295 + h * 0.068 + speechEnv * (0.045 + h * 0.02));
            const lobes = h === 0 ? 6 : 9;
            const dir = h === 0 ? 1 : -1;
            const steps = 96;

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            for (let s = 0; s <= steps; s++) {
              const ang = (s / steps) * Math.PI * 2;
              const mod = Math.sin(ang * lobes + t * 7.5 * dir) * 0.58 + Math.cos(ang * (lobes - 2) - t * 11.2 * dir) * 0.42;
              const rr = baseR + mod * (0.008 + speechEnv * 0.03) * baseRadius;
              const hx = cx + Math.cos(ang) * rr;
              const hy = cy + Math.sin(ang) * rr;
              if (s === 0) ctx.moveTo(hx, hy);
              else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.strokeStyle = rgba(h === 0 ? liveColor.primary : liveColor.bright, (0.34 - h * 0.08) * sm);
            ctx.lineWidth = Math.max(2.6, (3.8 - h * 0.9) * scaleRatio);
            ctx.stroke();
            ctx.strokeStyle = rgba(h === 0 ? liveColor.core : liveColor.bright, (0.78 - h * 0.16) * sm);
            ctx.lineWidth = Math.max(1.0, (1.45 - h * 0.25) * scaleRatio);
            ctx.stroke();
            ctx.restore();
          }
        }

        // C. Think Med: Measured Concentric Thinking Ripples
        for (let i = thinkRipples.length - 1; i >= 0; i--) {
          const tr = thinkRipples[i];
          tr.progress += dt * tr.speed;
          if (tr.progress >= 1) {
            thinkRipples.splice(i, 1);
            continue;
          }
          const eased = 1 - Math.pow(1 - tr.progress, 2.5);
          const r = baseRadius * lerp(0.25, 0.83, eased);
          const alpha = (1 - tr.progress) * tr.alpha * Math.min(1, lum);
          drawNeonArc(cx, cy, r, 0, Math.PI * 2, Math.max(1.1, tr.thickness * (1 - tr.progress * 0.5) * scaleRatio), liveColor.bright, liveColor.primary, alpha, 1.3);
        }

        // D. Radial Energy Shockwaves (Spacebar, Click Core, Wake Ignition)
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.progress += dt * sw.speed;
          if (sw.progress >= 1) {
            shockwaves.splice(i, 1);
            continue;
          }
          if (sw.progress < 0) continue;
          const eased = 1 - Math.pow(1 - sw.progress, 3);
          const r = baseRadius * (0.19 + eased * sw.maxRadiusFactor);
          const alpha = (1 - sw.progress) * sw.alpha;
          const lw = (1 - sw.progress * 0.65) * sw.thickness;
          drawNeonArc(cx, cy, r, 0, Math.PI * 2, lw, liveColor.core, liveColor.primary, alpha, 1.48, Math.max(0.9, lum));
        }
      }

      // ==========================================================================
      // VARIANT I · AURA CORE RENDERER
      // Classic Age of Ultron plasma orb, 3D geodesic wireframe, volumetric
      // shimmer lattice, 9 concentric rings, calibrated HUD outer half-circle
      // ==========================================================================
      function renderVariantAura(vAlpha, t, dt, core, og, listeningLevel, lum, dynBloom) {
        const { coreX, coreY, coreR } = core;
        const scaleRatio = baseRadius / 260;
        const m = cur.muteFactor;
        const isDead = lum < 0.06 && !wakeSeq.active;

        // 1. Luminous Central Plasma Core Sphere
        ctx.save();
        if (isDead) {
          ctx.globalCompositeOperation = 'source-over';
          const deadGrad = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, coreR);
          deadGrad.addColorStop(0, `rgba(26,30,42,${(0.92 * vAlpha).toFixed(3)})`);
          deadGrad.addColorStop(0.75, `rgba(12,15,24,${(0.94 * vAlpha).toFixed(3)})`);
          deadGrad.addColorStop(1, `rgba(5,7,14,${(0.95 * vAlpha).toFixed(3)})`);
          ctx.fillStyle = deadGrad;
          ctx.beginPath();
          ctx.arc(coreX, coreY, coreR, 0, Math.PI * 2);
          ctx.fill();

          // Occasional faint dying-ember flicker
          if (deadFlicker > 0.01) {
            ctx.globalCompositeOperation = 'lighter';
            const emGrad = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, coreR * 0.55);
            emGrad.addColorStop(0, rgba(liveColor.core, deadFlicker * 0.65 * vAlpha));
            emGrad.addColorStop(0.4, rgba(liveColor.primary, deadFlicker * 0.38 * vAlpha));
            emGrad.addColorStop(1, rgba(liveColor.deep, 0));
            ctx.fillStyle = emGrad;
            ctx.beginPath();
            ctx.arc(coreX, coreY, coreR * 0.55, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.globalCompositeOperation = 'lighter';
          const cLum = Math.min(1.42, lum + dynBloom * 0.35);

          // Wide plasma corona
          const coronaR = coreR * (2.35 + pulseImpulse * 0.6 + dynBloom * 0.4);
          const coronaGrad = ctx.createRadialGradient(coreX, coreY, coreR * 0.12, coreX, coreY, coronaR);
          coronaGrad.addColorStop(0, rgba(liveColor.primary, clamp((0.36 + dynBloom * 0.2) * cLum * vAlpha, 0, 0.85), m));
          coronaGrad.addColorStop(0.45, rgba(liveColor.primary, clamp(0.18 * cLum * vAlpha, 0, 0.45), m));
          coronaGrad.addColorStop(0.75, rgba(liveColor.deep, clamp(0.12 * cLum * vAlpha, 0, 0.3), m));
          coronaGrad.addColorStop(1, rgba(liveColor.deep, 0));
          ctx.fillStyle = coronaGrad;
          ctx.beginPath();
          ctx.arc(coreX, coreY, coronaR, 0, Math.PI * 2);
          ctx.fill();

          // Multi-layered plasma sphere core (white-hot -> bright -> neon -> deep)
          const sphereGrad = ctx.createRadialGradient(coreX - coreR * 0.12, coreY - coreR * 0.12, coreR * 0.02, coreX, coreY, coreR);
          sphereGrad.addColorStop(0, `rgba(255,255,255,${clamp((0.92 + cur.thinkHardMode * 0.15) * cLum * vAlpha, 0, 1).toFixed(3)})`);
          sphereGrad.addColorStop(0.22, rgba(liveColor.core, clamp(0.92 * cLum * vAlpha, 0, 0.98), m * 0.45));
          sphereGrad.addColorStop(0.52, rgba(liveColor.bright, clamp(0.74 * cLum * vAlpha, 0, 0.92), m * 0.7));
          sphereGrad.addColorStop(0.84, rgba(liveColor.primary, clamp(0.52 * cLum * vAlpha, 0, 0.78), m));
          sphereGrad.addColorStop(1, rgba(liveColor.deep, clamp(0.18 * cLum * vAlpha, 0, 0.4), m));
          ctx.fillStyle = sphereGrad;
          ctx.beginPath();
          ctx.arc(coreX, coreY, coreR, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 2. Rotating 3D-Projected Geodesic Wireframe Sphere
        auraSphereRotY += dt * (currentStateKey === 'dead' ? 0 : 0.42 * cur.speedMult * (1 + pulseImpulse * 2));
        const rotX = 0.34 + pointer.smoothY * 0.35;
        const rotY = auraSphereRotY + pointer.smoothX * 0.45;
        const cX = Math.cos(rotX), sX = Math.sin(rotX);
        const cY = Math.cos(rotY), sY = Math.sin(rotY);

        function projAura3D(x, y, z, rad) {
          const x1 = x * cY - z * sY;
          const z1 = x * sY + z * cY;
          const y2 = y * cX - z1 * sX;
          const z2 = y * sX + z1 * cX;
          const pScale = 2.8 / (2.8 - z2 * 0.65);
          return { px: coreX + x1 * rad * pScale, py: coreY + y2 * rad * pScale, pz: z2, pScale };
        }

        ctx.save();
        ctx.globalCompositeOperation = isDead ? 'source-over' : 'lighter';
        const wireCol = isDead ? DEAD_WIRE : liveColor.core;
        const wireAlpha = (isDead ? 0.34 : (0.28 + cur.thinkMedMode * 0.16 + cur.thinkHardMode * 0.24) * Math.min(1.15, lum)) * vAlpha;
        ctx.strokeStyle = rgba(wireCol, wireAlpha, isDead ? 0 : m * 0.6);
        ctx.lineWidth = Math.max(0.75, 0.95 * scaleRatio);

        const segs = 28;
        // 6 Meridians
        for (let ml = 0; ml < 6; ml++) {
          const phi = (ml / 6) * Math.PI;
          ctx.beginPath();
          for (let s = 0; s <= segs; s++) {
            const th = (s / segs) * Math.PI * 2;
            const pt = projAura3D(Math.sin(th) * Math.cos(phi), Math.cos(th), Math.sin(th) * Math.sin(phi), coreR * 0.96);
            if (s === 0) ctx.moveTo(pt.px, pt.py);
            else ctx.lineTo(pt.px, pt.py);
          }
          ctx.stroke();
        }
        // 4 Parallels
        for (let pl = 1; pl <= 4; pl++) {
          const lat = (pl / 5) * Math.PI - Math.PI * 0.5;
          const rLat = Math.cos(lat), yLat = Math.sin(lat);
          ctx.beginPath();
          for (let s = 0; s <= segs; s++) {
            const th = (s / segs) * Math.PI * 2;
            const pt = projAura3D(Math.cos(th) * rLat, yLat, Math.sin(th) * rLat, coreR * 0.96);
            if (s === 0) ctx.moveTo(pt.px, pt.py);
            else ctx.lineTo(pt.px, pt.py);
          }
          ctx.stroke();
        }
        ctx.restore();

        // 3. Volumetric Inner Neural Particle Shimmer Lattice
        if (!isDead && lum > 0.08) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const activePts = Math.floor(auraCoreParticles.length * clamp(0.35 + cur.particleRatio * 0.65, 0.3, 1));
          for (let i = 0; i < activePts; i++) {
            const p = auraCoreParticles[i];
            const pt = projAura3D(p.ux, p.uy, p.uz, coreR * 0.9);
            const depth = clamp((pt.pz + 1.0) * 0.55, 0.2, 1);
            const shimmer = 0.5 + 0.5 * Math.sin(t * (3.5 + cur.synapseRate * 5) + p.phase);
            ctx.fillStyle = rgba(shimmer > 0.78 ? liveColor.core : liveColor.bright, depth * shimmer * 0.8 * Math.min(1.1, lum) * vAlpha, m * 0.55);
            ctx.beginPath();
            ctx.arc(pt.px, pt.py, p.size * pt.pScale * scaleRatio * 0.85, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Crisp glowing outer sphere rim
        drawNeonArc(coreX, coreY, coreR, 0, Math.PI * 2, Math.max(1.5, 2.1 * scaleRatio), liveColor.core, liveColor.primary, 0.92 * vAlpha, 1.15);

        // 4. 9 Counter-Rotating Concentric Holographic Rings
        const dynSpeedBoost = (1 + pulseImpulse * 4.0 + speechEnv * cur.speakingMode * 0.42) * (currentStateKey === 'dead' ? 0 : 1);
        for (let i = 0; i < auraRings.length; i++) {
          const layer = auraRings[i];

          let wakeLayerFactor = 1.0;
          if (wakeSeq.active) {
            const layerStart = 0.85 + i * 0.12;
            wakeLayerFactor = clamp((wakeSeq.elapsed - layerStart) / 0.4, 0, 1);
          }
          if (wakeLayerFactor <= 0.008) continue;

          const layerLum = lum * wakeLayerFactor;
          const hardOddBoost = (cur.thinkHardMode > 0.3 && i % 2 === 0) ? (1 + 0.35 * cur.thinkHardMode) : 1.0;
          layer.angle += layer.direction * layer.speed * cur.speedMult * hardOddBoost * dynSpeedBoost * wakeLayerFactor * dt;

          const lagFrames = Math.min(LAG_LEN - 1, 4 + i * 4);
          const thinkSymp = getLag(thinkLagBuf, lagFrames) * cur.thinkMedMode;
          const speakSymp = getLag(speakLagBuf, Math.min(LAG_LEN - 1, 3 + i * 3)) * cur.speakingMode;
          const thinkFlex = i <= 6 ? (thinkSymp - 0.42) * (0.11 - i * 0.011) : (thinkSymp - 0.42) * 0.025;
          const speakFlex = i <= 5 ? (speakSymp - 0.32) * (0.044 - i * 0.005) : speakSymp * 0.012;

          const layerBreath = Math.sin(t * 2.0 + i * 0.82) * 0.006 * Math.min(1, layerLum) + pulseImpulse * (0.026 + i * 0.004) + thinkFlex + speakFlex;
          const r = baseRadius * layer.radiusFactor * cur.arcTightness * (1 + layerBreath);
          const lineW = Math.max(0.9, layer.thickness * scaleRatio);

          const jx = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.0 * cur.vibrationAmp : 0;
          const jy = cur.vibrationAmp > 0.05 ? (Math.random() - 0.5) * 2.0 * cur.vibrationAmp : 0;
          const lx = cx + jx, ly = cy + jy;

          const coreCol = liveColor[layer.role];
          const glowCol = liveColor[layer.glowRole];
          const analyticalPulse = (cur.thinkMedMode > 0.2 || cur.thinkHardMode > 0.2)
            ? 0.5 + 0.5 * Math.sin(t * (4.2 + cur.thinkHardMode * 5.6) - i * 0.72)
            : 0;
          const glowScale = (1 + pulseImpulse * 0.6 + analyticalPulse * 0.44) * wakeLayerFactor;
          const op = layer.opacity * vAlpha;

          if (layer.type === 'segments' || layer.type === 'heavySegments') {
            for (let s = 0; s < layer.segments.length; s++) {
              const seg = layer.segments[s];
              const a1 = layer.angle + seg.start;
              const a2 = a1 + seg.len;
              drawNeonArc(lx, ly, r, a1, a2, lineW, coreCol, glowCol, op, glowScale, layerLum);
              if (layer.type === 'heavySegments' && layerLum > 0.1) {
                drawNeonArc(lx, ly, r, a1 + 0.04, a2 - 0.04, Math.max(0.9, lineW * 0.36), liveColor.core, liveColor.bright, op * 0.78, 0.68, layerLum);
              }
            }
          } else if (layer.type === 'nodeSegments') {
            for (let s = 0; s < layer.segments.length; s++) {
              const seg = layer.segments[s];
              const a1 = layer.angle + seg.start;
              const a2 = a1 + seg.len;
              drawNeonArc(lx, ly, r, a1, a2, lineW, coreCol, glowCol, op, glowScale, layerLum);
              if (layerLum > 0.08) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = rgba(liveColor.core, op * Math.min(1, layerLum), m * 0.6);
                const nodeR = Math.max(1.8, lineW * 1.38);
                [a1, a2].forEach((ang) => {
                  ctx.beginPath();
                  ctx.arc(lx + Math.cos(ang) * r, ly + Math.sin(ang) * r, nodeR, 0, Math.PI * 2);
                  ctx.fill();
                });
                ctx.restore();
              }
            }
          } else if (layer.type === 'dashed') {
            const step = (Math.PI * 2) / layer.dashCount;
            const dashLen = step * layer.dashRatio;
            ctx.save();
            ctx.globalCompositeOperation = layerLum > 0.06 ? 'lighter' : 'source-over';
            ctx.strokeStyle = layerLum <= 0.06
              ? rgba(DEAD_METAL, 0.28 * vAlpha)
              : rgba(coreCol, op * Math.min(1, layerLum) * (0.78 + pulseImpulse * 0.3), m);
            ctx.lineWidth = lineW;
            for (let d = 0; d < layer.dashCount; d++) {
              const a1 = layer.angle + d * step;
              ctx.beginPath();
              ctx.arc(lx, ly, r, a1, a1 + dashLen);
              ctx.stroke();
            }
            ctx.restore();
          } else if (layer.type === 'microTicks') {
            const count = layer.tickCount;
            const step = (Math.PI * 2) / count;
            ctx.save();
            ctx.globalCompositeOperation = layerLum > 0.06 ? 'lighter' : 'source-over';
            for (let k = 0; k < count; k++) {
              const a = layer.angle + k * step;
              const isMajor = k % 8 === 0;
              const isMid = k % 4 === 0;
              const len = isMajor ? Math.max(7, 10.5 * scaleRatio) : isMid ? Math.max(4, 6 * scaleRatio) : Math.max(2, 3.2 * scaleRatio);
              const cosA = Math.cos(a), sinA = Math.sin(a);
              ctx.strokeStyle = layerLum <= 0.06
                ? rgba(DEAD_METAL, 0.28 * vAlpha)
                : rgba(isMajor ? liveColor.core : coreCol, (isMajor ? 0.84 : isMid ? 0.48 : 0.24) * op * Math.min(1, layerLum), m);
              ctx.lineWidth = isMajor ? Math.max(1.2, 1.55 * scaleRatio) : 0.85;
              ctx.beginPath();
              ctx.moveTo(lx + cosA * r, ly + sinA * r);
              ctx.lineTo(lx + cosA * (r + len), ly + sinA * (r + len));
              ctx.stroke();
            }
            ctx.restore();
          } else if (layer.type === 'taperedCrescents') {
            for (let s = 0; s < layer.crescents.length; s++) {
              const cr = layer.crescents[s];
              drawTaperedCrescent(lx, ly, r, layer.angle + cr.start, cr.len, lineW, coreCol, glowCol, op, layerLum);
            }
          } else if (layer.type === 'equalizer') {
            const count = layer.tickCount;
            const step = (Math.PI * 2) / count;
            ctx.save();
            ctx.globalCompositeOperation = layerLum > 0.06 ? 'lighter' : 'source-over';
            ctx.lineCap = 'round';
            for (let k = 0; k < count; k++) {
              const ang = layer.angle + k * step;
              const listenBand = 0.5 + 0.5 * Math.sin(k * 0.48 + t * 7.6) * Math.cos(k * 0.25 - t * 4.4);
              const speakBand = 0.42 + 0.35 * Math.sin(k * 0.35 - t * 13.0) + 0.23 * Math.cos(k * 0.85 + t * 18.5);
              const binEnergy = lerp(listenBand, clamp(speakBand, 0.05, 1), cur.speakingMode);

              const reactivity =
                cur.listeningMode * (0.5 + listeningLevel * 1.55) +
                cur.speakingMode * (0.48 + speechEnv * 2.0) +
                cur.thinkHardMode * 0.62 +
                cur.thinkMedMode * (0.2 + thinkPulseValue * 0.42) +
                pulseImpulse * 1.25 + 0.08;

              const barLen = layerLum <= 0.06 ? baseRadius * 0.008 : baseRadius * (0.01 + binEnergy * reactivity * 0.058);
              const inwardShare = lerp(0.30, 0.06, cur.speakingMode);
              const innerR = r - barLen * inwardShare;
              const outerR = r + barLen * (1 - inwardShare);
              const cosA = Math.cos(ang), sinA = Math.sin(ang);

              if (layerLum > 0.06) {
                ctx.strokeStyle = rgba(liveColor.primary, (0.18 + binEnergy * 0.26) * op * Math.min(1, layerLum), m);
                ctx.lineWidth = Math.max(2.0, lineW * 2.05);
                ctx.beginPath();
                ctx.moveTo(lx + cosA * innerR, ly + sinA * innerR);
                ctx.lineTo(lx + cosA * outerR, ly + sinA * outerR);
                ctx.stroke();
              }
              const tipHot = binEnergy > 0.64 && reactivity > 0.55;
              ctx.strokeStyle = layerLum <= 0.06
                ? rgba(DEAD_METAL, 0.30 * vAlpha)
                : rgba(tipHot ? liveColor.core : coreCol, Math.min(1, (0.42 + binEnergy * 0.58) * op * Math.min(1, layerLum)), m);
              ctx.lineWidth = Math.max(1.0, lineW * 0.92);
              ctx.beginPath();
              ctx.moveTo(lx + cosA * innerR, ly + sinA * innerR);
              ctx.lineTo(lx + cosA * outerR, ly + sinA * outerR);
              ctx.stroke();
            }
            ctx.restore();
          } else if (layer.type === 'orbitalRail') {
            for (let s = 0; s < layer.segments.length; s++) {
              const seg = layer.segments[s];
              drawNeonArc(lx, ly, r, layer.angle + seg.start, layer.angle + seg.start + seg.len, lineW, coreCol, glowCol, op * 0.85, glowScale * 0.85, layerLum);
            }
            if (layerLum > 0.14) {
              const packetCount = cur.thinkHardMode > 0.4 ? 12 : cur.thinkMedMode > 0.4 ? 7 : layer.packets;
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              for (let p = 0; p < packetCount; p++) {
                const packetAngle = -layer.angle * 1.68 + (p / packetCount) * Math.PI * 2;
                const px = lx + Math.cos(packetAngle) * r;
                const py = ly + Math.sin(packetAngle) * r;
                drawNeonArc(lx, ly, r, packetAngle, packetAngle + 0.18, lineW * 1.4, liveColor.core, liveColor.primary, 0.78 * Math.min(1, layerLum) * vAlpha, 0.95, layerLum);
                ctx.fillStyle = rgba(liveColor.core, 0.95 * Math.min(1, layerLum) * vAlpha, m * 0.5);
                ctx.beginPath();
                ctx.arc(px, py, Math.max(2.0, 2.7 * scaleRatio), 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }
          }
        }

        // 5. Framing Outer HUD Half-Circle (Degree Ticks, Terminal Brackets, Light Scanner)
        const { ox, oy, radius, halfSpan, startA, endA } = og;
        ctx.save();
        ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
        ctx.strokeStyle = lum > 0.06 ? rgba(liveColor.primary, (0.07 + pulseImpulse * 0.05) * lum * vAlpha, m) : rgba(DEAD_METAL, 0.24 * vAlpha);
        ctx.lineWidth = Math.max(1, 1.05 * scaleRatio);
        ctx.beginPath();
        ctx.arc(ox, oy, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        if (halfSpan > 0.01) {
          const primaryW = Math.max(3.8, 6.2 * scaleRatio);
          drawNeonArc(ox, oy, radius, startA, endA, primaryW, liveColor.primary, liveColor.primary, 0.95 * vAlpha, 1.15 + pulseImpulse * 0.62);
          if (lum > 0.06) {
            drawNeonArc(ox, oy, radius, startA + 0.02, endA - 0.02, Math.max(1.4, 2.2 * scaleRatio), liveColor.core, liveColor.bright, 0.92 * vAlpha, 0.88);
          }

          // Travelling light scanner bead (dual jittering scanners in Think Hard)
          if (lum > 0.1) {
            const drawScanner = (phaseVal, alphaMult) => {
              let pp = phaseVal <= 1 ? phaseVal : 2 - phaseVal;
              if (cur.thinkHardMode > 0.3) {
                pp = clamp(pp + (Math.random() - 0.5) * 0.09 * cur.thinkHardMode, 0.04, 0.96);
              }
              const scanCenter = lerp(startA + 0.08, endA - 0.08, pp);
              const scanHalf = 0.085 + cur.thinkHardMode * 0.075;
              drawNeonArc(ox, oy, radius, scanCenter - scanHalf, scanCenter + scanHalf, primaryW * 0.65, liveColor.core, liveColor.bright, 0.9 * Math.min(1, lum) * alphaMult * vAlpha, 1.35);

              const bx = ox + Math.cos(scanCenter) * radius;
              const by = oy + Math.sin(scanCenter) * radius;
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              const beadR = Math.max(5.5, 9.5 * scaleRatio);
              const bGrad = ctx.createRadialGradient(bx, by, 0, bx, by, beadR);
              bGrad.addColorStop(0, rgba(liveColor.core, 0.98 * Math.min(1, lum) * alphaMult * vAlpha));
              bGrad.addColorStop(0.42, rgba(liveColor.bright, 0.56 * Math.min(1, lum) * alphaMult * vAlpha));
              bGrad.addColorStop(1, rgba(liveColor.primary, 0));
              ctx.fillStyle = bGrad;
              ctx.beginPath();
              ctx.arc(bx, by, beadR, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            };
            drawScanner(outerArcState.scanPhase, 1.0);
            if (cur.thinkHardMode > 0.15) drawScanner(outerArcState.scanPhase2, cur.thinkHardMode);
          }

          // Calibrated degree tick marks
          const totalTicks = 50;
          ctx.save();
          ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
          ctx.lineCap = 'round';
          for (let i = 0; i <= totalTicks; i++) {
            const ang = startA + (i / totalTicks) * (endA - startA);
            const isMajor = i % 5 === 0;
            const isMid = i % 5 === 2 || i % 5 === 3;
            const tickStart = radius + Math.max(4, 6 * scaleRatio);
            const tickLen = isMajor ? Math.max(10, 15 * scaleRatio) : isMid ? Math.max(5.5, 8.5 * scaleRatio) : Math.max(3.5, 5 * scaleRatio);
            const cosA = Math.cos(ang), sinA = Math.sin(ang);

            ctx.strokeStyle = lum <= 0.06
              ? rgba(DEAD_METAL, 0.36 * vAlpha)
              : rgba(isMajor ? liveColor.core : liveColor.bright, (isMajor ? 0.85 : isMid ? 0.48 : 0.28) * Math.min(1, lum) * vAlpha, m);
            ctx.lineWidth = isMajor ? Math.max(1.5, 2.0 * scaleRatio) : Math.max(0.9, 1.1 * scaleRatio);
            ctx.beginPath();
            ctx.moveTo(ox + cosA * tickStart, oy + sinA * tickStart);
            ctx.lineTo(ox + cosA * (tickStart + tickLen), oy + sinA * (tickStart + tickLen));
            ctx.stroke();
          }

          // Terminal anchor brackets
          ctx.lineJoin = 'miter';
          [startA, endA].forEach((endAng, idx) => {
            const dir = idx === 0 ? -1 : 1;
            const cosE = Math.cos(endAng), sinE = Math.sin(endAng);
            const tanX = -sinE * dir, tanY = cosE * dir;
            const innerB = radius - Math.max(13, 19 * scaleRatio);
            const outerB = radius + Math.max(13, 20 * scaleRatio);
            const hookLen = Math.max(8, 12 * scaleRatio);

            ctx.strokeStyle = lum <= 0.06 ? rgba(DEAD_WIRE, 0.52 * vAlpha) : rgba(liveColor.core, 0.94 * Math.min(1, lum) * vAlpha, m * 0.6);
            ctx.lineWidth = Math.max(2.0, 2.6 * scaleRatio);
            ctx.beginPath();
            ctx.moveTo(ox + cosE * innerB - tanX * hookLen, oy + sinE * innerB - tanY * hookLen);
            ctx.lineTo(ox + cosE * innerB, oy + sinE * innerB);
            ctx.lineTo(ox + cosE * outerB, oy + sinE * outerB);
            ctx.lineTo(ox + cosE * outerB - tanX * hookLen, oy + sinE * outerB - tanY * hookLen);
            ctx.stroke();

            if (lum > 0.06) {
              ctx.fillStyle = rgba(liveColor.core, 0.96 * Math.min(1, lum) * vAlpha, m * 0.5);
              ctx.beginPath();
              ctx.arc(ox + cosE * radius, oy + sinE * radius, Math.max(2.8, 4.0 * scaleRatio), 0, Math.PI * 2);
              ctx.fill();
            }
          });
          ctx.restore();
        }
      }

      // ==========================================================================
      // VARIANT II · NEURAL MATRIX RENDERER
      // 112-node 3D Fibonacci synaptic mind cloud, live traveling impulses,
      // 3D precessing orbits, sinusoidal energy ribbons, tapered crescents,
      // photonic dot streams, 3-strand braided neural crescent shedding spores
      // ==========================================================================
      function renderVariantNeural(vAlpha, t, dt, core, og, listeningLevel, lum, dynBloom) {
        const { coreX, coreY, coreR } = core;
        const scaleRatio = baseRadius / 260;
        const m = cur.muteFactor;
        const isDead = lum < 0.06 && !wakeSeq.active;
        const dynSpeed = currentStateKey === 'dead' ? 0 : (cur.speedMult * (1 + pulseImpulse * 3.0 + speechEnv * cur.speakingMode * 0.45));

        // 1. Update & project 112 Fibonacci 3D synaptic nodes
        neuralRotY += dt * 0.36 * (currentStateKey === 'dead' ? 0 : cur.speedMult * (1 + pulseImpulse * 2));
        neuralRotX = 0.24 + Math.sin(t * 0.34) * 0.14;
        const rx = neuralRotX + pointer.smoothY * 0.42;
        const ry = neuralRotY + pointer.smoothX * 0.52;
        const cX = Math.cos(rx), sX = Math.sin(rx);
        const cY = Math.cos(ry), sY = Math.sin(ry);
        const persp = 2.9;

        const cloudR = coreR * 1.06;
        const sortedNodes = [];
        for (let i = 0; i < NEURAL_COUNT; i++) {
          const n = neuralNodes[i];
          n.excite *= Math.pow(0.06, dt);
          if (n.excite < 0.004) n.excite = 0;

          const breath = isDead ? 1 : 1 + Math.sin(t * 2.2 + n.phase) * 0.032;
          const x1 = n.ux * breath * cY - n.uz * breath * sY;
          const z1 = n.ux * breath * sY + n.uz * breath * cY;
          const y2 = n.uy * breath * cX - z1 * sX;
          const z2 = n.uy * breath * sX + z1 * cX;
          const pScale = persp / (persp - z2 * 0.68);

          n.px = coreX + x1 * cloudR * pScale;
          n.py = coreY + y2 * cloudR * pScale;
          n.pz = z2;
          n.pScale = pScale;

          if (!isDead && cur.thinkMedMode > 0.3) {
            const band = Math.cos(y2 * 4.2 - t * 2.8);
            if (band > 0.85) n.excite = Math.max(n.excite, cur.thinkMedMode * (band - 0.85) * 5.0);
          }
          sortedNodes.push(n);
        }
        sortedNodes.sort((a, b) => a.pz - b.pz);

        // Ambient mind-cloud glow behind nodes
        if (!isDead) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const cLum = Math.min(1.4, lum + dynBloom * 0.32);
          const haloR = cloudR * (2.1 + pulseImpulse * 0.5 + dynBloom * 0.35);
          const g = ctx.createRadialGradient(coreX, coreY, cloudR * 0.04, coreX, coreY, haloR);
          g.addColorStop(0, rgba(liveColor.core, clamp(0.42 * cLum * vAlpha, 0, 0.78), m * 0.5));
          g.addColorStop(0.28, rgba(liveColor.primary, clamp(0.28 * cLum * vAlpha, 0, 0.6), m));
          g.addColorStop(0.66, rgba(liveColor.deep, clamp(0.14 * cLum * vAlpha, 0, 0.3), m));
          g.addColorStop(1, rgba(liveColor.deep, 0));
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(coreX, coreY, haloR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Update traveling electrical light impulses
        if (!isDead && lum > 0.08) {
          const desired = Math.floor(clamp(10 + cur.synapseRate * 38 + cur.thinkHardMode * 24 + speechEnv * cur.speakingMode * 16, 6, 68));
          while (neuralImpulses.length < desired) {
            const from = Math.floor(Math.random() * NEURAL_COUNT);
            const nbrs = neuralAdj[from];
            if (nbrs.length > 0) {
              neuralImpulses.push({
                from,
                to: nbrs[Math.floor(Math.random() * nbrs.length)],
                t: 0,
                speed: (1.25 + Math.random() * 1.2) * (cur.thinkHardMode > 0.4 ? 1.8 : 1.0),
                hopsLeft: 2 + Math.floor(Math.random() * 2)
              });
            } else {
              break;
            }
          }

          const impMult = 0.45 + cur.speedMult * 0.72 + cur.speakingMode * speechEnv * 0.9;
          for (let i = neuralImpulses.length - 1; i >= 0; i--) {
            const imp = neuralImpulses[i];
            imp.t += dt * imp.speed * impMult;
            if (imp.t >= 1) {
              const arrived = imp.to;
              neuralNodes[arrived].excite = 1.0;
              if (imp.hopsLeft > 0 && neuralAdj[arrived].length > 0) {
                const nbrs = neuralAdj[arrived];
                imp.from = arrived;
                imp.to = nbrs[Math.floor(Math.random() * nbrs.length)];
                imp.t = 0;
                imp.hopsLeft--;
              } else {
                neuralImpulses.splice(i, 1);
              }
            }
          }
        }

        // Draw proximity synaptic filaments
        ctx.save();
        ctx.globalCompositeOperation = isDead ? 'source-over' : 'lighter';
        for (let e = 0; e < neuralEdges.length; e++) {
          const edge = neuralEdges[e];
          const na = neuralNodes[edge.a];
          const nb = neuralNodes[edge.b];
          const avgZ = (na.pz + nb.pz) * 0.5;
          const depth = clamp((avgZ + 1.05) * 0.52, 0.14, 1.0);
          const exc = Math.max(na.excite, nb.excite);

          if (isDead) {
            ctx.strokeStyle = rgba(DEAD_WIRE, depth * 0.28 * vAlpha);
            ctx.lineWidth = Math.max(0.6, 0.8 * scaleRatio);
          } else {
            const alpha = depth * (0.16 + cur.synapseRate * 0.2 + exc * 0.58 + pulseImpulse * 0.28) * Math.min(1.15, lum) * vAlpha;
            ctx.strokeStyle = rgba(exc > 0.35 ? liveColor.core : liveColor.primary, alpha, m * 0.7);
            ctx.lineWidth = Math.max(0.65, (0.95 + exc * 0.75) * scaleRatio);
          }
          ctx.beginPath();
          ctx.moveTo(na.px, na.py);
          ctx.lineTo(nb.px, nb.py);
          ctx.stroke();
        }
        ctx.restore();

        // Draw live traveling electrical impulses
        if (!isDead && lum > 0.08) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineCap = 'round';
          for (let i = 0; i < neuralImpulses.length; i++) {
            const imp = neuralImpulses[i];
            const na = neuralNodes[imp.from];
            const nb = neuralNodes[imp.to];
            const ix = lerp(na.px, nb.px, imp.t);
            const iy = lerp(na.py, nb.py, imp.t);
            const iz = lerp(na.pz, nb.pz, imp.t);
            const tailT = Math.max(0, imp.t - 0.32);
            const tx = lerp(na.px, nb.px, tailT);
            const ty = lerp(na.py, nb.py, tailT);
            const depth = clamp((iz + 1.05) * 0.55, 0.24, 1);

            ctx.strokeStyle = rgba(liveColor.primary, depth * 0.55 * Math.min(1.15, lum) * vAlpha, m * 0.5);
            ctx.lineWidth = Math.max(2.0, 3.0 * scaleRatio);
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(ix, iy);
            ctx.stroke();

            ctx.fillStyle = rgba(liveColor.core, depth * 0.98 * Math.min(1.15, lum) * vAlpha);
            ctx.beginPath();
            ctx.arc(ix, iy, Math.max(1.8, 2.5 * scaleRatio), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Draw depth-sorted 3D Fibonacci synaptic nodes
        ctx.save();
        ctx.globalCompositeOperation = isDead ? 'source-over' : 'lighter';
        for (let k = 0; k < sortedNodes.length; k++) {
          const n = sortedNodes[k];
          const depth = clamp((n.pz + 1.05) * 0.52, 0.18, 1);
          const nr = n.size * n.pScale * scaleRatio * (0.7 + depth * 0.35 + n.excite * 0.55);

          if (isDead) {
            if (deadFlicker > 0.02 && n.id === 14) {
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              ctx.fillStyle = rgba(liveColor.primary, deadFlicker * 0.85 * vAlpha);
              ctx.beginPath();
              ctx.arc(n.px, n.py, nr * 2.2, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else {
              ctx.fillStyle = rgba(DEAD_WIRE, depth * 0.5 * vAlpha);
              ctx.beginPath();
              ctx.arc(n.px, n.py, nr * 0.78, 0, Math.PI * 2);
              ctx.fill();
            }
          } else {
            const shimmer = 0.65 + 0.35 * Math.sin(t * 4.2 + n.phase);
            if (n.pz > 0 || n.excite > 0.2) {
              ctx.fillStyle = rgba(liveColor.primary, depth * (0.22 + n.excite * 0.42) * Math.min(1.15, lum) * vAlpha, m * 0.75);
              ctx.beginPath();
              ctx.arc(n.px, n.py, nr * (2.2 + n.excite * 1.7), 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.fillStyle = rgba(n.excite > 0.3 || shimmer > 0.88 ? liveColor.core : liveColor.bright, depth * shimmer * (0.72 + n.excite * 0.3) * Math.min(1.15, lum) * vAlpha, m * 0.55);
            ctx.beginPath();
            ctx.arc(n.px, n.py, nr, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        // 2. 3D-Tilted Precessing Elliptical Orbital Rings
        for (let i = 0; i < neuralOrbits3D.length; i++) {
          const orb = neuralOrbits3D[i];
          let wf = 1.0;
          if (wakeSeq.active) wf = clamp((wakeSeq.elapsed - (0.85 + i * 0.16)) / 0.42, 0, 1);
          if (wf <= 0.01) continue;

          orb.tiltZ += orb.precessSpeed * (currentStateKey === 'dead' ? 0 : cur.speedMult) * dt;
          orb.beadPhase += orb.dir * orb.beadSpeed * dynSpeed * dt;

          const thinkSymp = getLag(thinkLagBuf, 5 + i * 5) * cur.thinkMedMode;
          const r = baseRadius * orb.radiusFactor * cur.arcTightness * (1 + (thinkSymp - 0.42) * 0.09 + pulseImpulse * 0.04);
          const cTX = Math.cos(orb.tiltX), sTX = Math.sin(orb.tiltX);
          const cTZ = Math.cos(orb.tiltZ), sTZ = Math.sin(orb.tiltZ);
          const oLum = lum * wf;

          ctx.save();
          ctx.globalCompositeOperation = oLum > 0.06 ? 'lighter' : 'source-over';
          ctx.beginPath();
          const steps = 80;
          for (let s = 0; s <= steps; s++) {
            const th = (s / steps) * Math.PI * 2;
            const lx = Math.cos(th), ly = Math.sin(th);
            const y1 = ly * cTX, z1 = ly * sTX;
            const x2 = lx * cTZ - y1 * sTZ, y2 = lx * sTZ + y1 * cTZ;
            const pScale = 3.2 / (3.2 - z1 * 0.72);
            const px = coreX + x2 * r * pScale;
            const py = coreY + y2 * r * pScale;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();

          if (oLum <= 0.06) {
            ctx.strokeStyle = rgba(DEAD_METAL, 0.3 * vAlpha);
            ctx.lineWidth = Math.max(0.9, 1.1 * scaleRatio);
            ctx.stroke();
          } else {
            ctx.strokeStyle = rgba(liveColor.primary, 0.24 * Math.min(1.15, oLum) * vAlpha, m);
            ctx.lineWidth = Math.max(2.6, 3.6 * scaleRatio);
            ctx.stroke();
            ctx.strokeStyle = rgba(liveColor[orb.role], 0.62 * Math.min(1.15, oLum) * vAlpha, m * 0.7);
            ctx.lineWidth = Math.max(1.0, 1.35 * scaleRatio);
            ctx.stroke();

            // Orbiting photonic beads
            const bCount = cur.thinkHardMode > 0.4 ? orb.beads + 2 : orb.beads;
            for (let b = 0; b < bCount; b++) {
              const ang = orb.beadPhase + (b / bCount) * Math.PI * 2;
              const lx = Math.cos(ang), ly = Math.sin(ang);
              const y1 = ly * cTX, z1 = ly * sTX;
              const x2 = lx * cTZ - y1 * sTZ, y2 = lx * sTZ + y1 * cTZ;
              const pScale = 3.2 / (3.2 - z1 * 0.72);
              const bx = coreX + x2 * r * pScale;
              const by = coreY + y2 * r * pScale;
              ctx.fillStyle = rgba(liveColor.core, 0.94 * Math.min(1.1, oLum) * vAlpha);
              ctx.beginPath();
              ctx.arc(bx, by, Math.max(1.8, 2.6 * scaleRatio * pScale), 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        }

        // 3. Sinusoidal Harmonic Energy Ribbons undulating around the core
        for (let h = 0; h < 2; h++) {
          let wf = 1.0;
          if (wakeSeq.active) wf = clamp((wakeSeq.elapsed - (1.2 + h * 0.2)) / 0.45, 0, 1);
          if (wf <= 0.01) continue;
          const rLum = lum * wf;
          const baseR = baseRadius * (0.505 + h * 0.088) * cur.arcTightness;
          const freq = h === 0 ? 7 : 11;
          const dir = h === 0 ? 1 : -1;
          const ampBoost = 0.012 + cur.speakingMode * speechEnv * 0.032 + cur.listeningMode * listeningLevel * 0.022 + cur.thinkMedMode * thinkPulseValue * 0.018;
          const steps = 110;

          ctx.save();
          ctx.globalCompositeOperation = rLum > 0.06 ? 'lighter' : 'source-over';
          ctx.beginPath();
          for (let s = 0; s <= steps; s++) {
            const ang = (s / steps) * Math.PI * 2;
            const wave = Math.sin(ang * freq + t * (2.6 + cur.speedMult * 1.8) * dir) * 0.65 +
                         Math.cos(ang * (freq - 3) - t * 3.4 * dir) * 0.35;
            const rr = baseR + wave * ampBoost * baseRadius;
            const px = cx + Math.cos(ang) * rr;
            const py = cy + Math.sin(ang) * rr;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();

          if (rLum <= 0.06) {
            ctx.strokeStyle = rgba(DEAD_METAL, 0.26 * vAlpha);
            ctx.lineWidth = 1.0;
            ctx.stroke();
          } else {
            ctx.strokeStyle = rgba(liveColor.primary, 0.28 * Math.min(1.1, rLum) * vAlpha, m);
            ctx.lineWidth = Math.max(2.6, 3.8 * scaleRatio);
            ctx.stroke();
            ctx.strokeStyle = rgba(h === 0 ? liveColor.core : liveColor.bright, 0.78 * Math.min(1.1, rLum) * vAlpha, m * 0.6);
            ctx.lineWidth = Math.max(1.0, 1.4 * scaleRatio);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 4. Tapered Glowing Crescent Filaments & Orbiting Photonic Dot Streams
        for (let c = 0; c < neuralCrescentLayers.length; c++) {
          const cl = neuralCrescentLayers[c];
          let wf = 1.0;
          if (wakeSeq.active) wf = clamp((wakeSeq.elapsed - (1.45 + c * 0.22)) / 0.45, 0, 1);
          if (wf <= 0.01) continue;
          cl.angle += cl.dir * cl.speed * dynSpeed * dt;
          const r = baseRadius * cl.radiusFactor * cur.arcTightness * (1 + pulseImpulse * 0.03);
          for (let s = 0; s < cl.crescents.length; s++) {
            const cr = cl.crescents[s];
            drawTaperedCrescent(cx, cy, r, cl.angle + cr.s, cr.l, cl.maxW * scaleRatio, liveColor.core, liveColor.primary, 0.86 * vAlpha, lum * wf);
          }
        }

        for (let d = 0; d < neuralDotStreams.length; d++) {
          const ds = neuralDotStreams[d];
          let wf = 1.0;
          if (wakeSeq.active) wf = clamp((wakeSeq.elapsed - (1.35 + d * 0.25)) / 0.45, 0, 1);
          if (wf <= 0.01) continue;
          ds.angle += ds.dir * ds.speed * dynSpeed * dt;
          const dLum = lum * wf;
          const r = baseRadius * ds.radiusFactor * cur.arcTightness;

          ctx.save();
          ctx.globalCompositeOperation = dLum > 0.06 ? 'lighter' : 'source-over';
          for (let i = 0; i < ds.count; i++) {
            const a = ds.angle + (i / ds.count) * Math.PI * 2;
            const pulse = 0.45 + 0.55 * Math.sin(i * 0.9 - t * 4.5 * ds.dir);
            const px = cx + Math.cos(a) * r;
            const py = cy + Math.sin(a) * r;
            ctx.fillStyle = dLum <= 0.06
              ? rgba(DEAD_METAL, 0.32 * vAlpha)
              : rgba(pulse > 0.8 ? liveColor.core : liveColor.bright, pulse * 0.82 * Math.min(1.1, dLum) * vAlpha, m * 0.6);
            ctx.beginPath();
            ctx.arc(px, py, Math.max(1.1, (1.1 + pulse * 1.35) * scaleRatio), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 5. Prominent Framing Outer Half-Circle: 3-Strand Braided Neural-Fiber Crescent + Drifting Photonic Micro-Spores
        const { ox, oy, radius, halfSpan, startA, endA } = og;
        if (halfSpan > 0.01) {
          const strandSamples = 86;
          const braidSpeed = currentStateKey === 'dead' ? 0 : (1.8 + cur.speedMult * 1.6);

          ctx.save();
          ctx.globalCompositeOperation = lum > 0.06 ? 'lighter' : 'source-over';
          ctx.lineCap = 'round';
          for (let strand = 0; strand < 3; strand++) {
            const phase = (strand / 3) * Math.PI * 2;
            const waveCycles = 5 + strand * 1.5;
            ctx.beginPath();
            for (let s = 0; s <= strandSamples; s++) {
              const f = s / strandSamples;
              const ang = lerp(startA, endA, f);
              const env = Math.sin(f * Math.PI);
              const weave = Math.sin(f * Math.PI * waveCycles - t * braidSpeed + phase) * baseRadius * 0.016 * env;
              const rr = radius + weave;
              const px = ox + Math.cos(ang) * rr;
              const py = oy + Math.sin(ang) * rr;
              if (s === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            if (lum <= 0.06) {
              ctx.strokeStyle = rgba(DEAD_METAL, 0.36 * vAlpha);
              ctx.lineWidth = Math.max(1.1, 1.4 * scaleRatio);
              ctx.stroke();
            } else {
              // Glow pass
              ctx.strokeStyle = rgba(liveColor.primary, 0.28 * Math.min(1.15, lum) * vAlpha, m);
              ctx.lineWidth = Math.max(3.4, 5.2 * scaleRatio);
              ctx.stroke();
              // Core filament pass
              ctx.strokeStyle = rgba(strand === 0 ? liveColor.core : liveColor.bright, (strand === 0 ? 0.92 : 0.72) * Math.min(1.15, lum) * vAlpha, m * 0.6);
              ctx.lineWidth = Math.max(1.2, (strand === 0 ? 2.1 : 1.45) * scaleRatio);
              ctx.stroke();
            }
          }

          // Synaptic energy knots along the braided crescent + travelling scanner
          if (lum > 0.1) {
            for (let k = 1; k < 10; k++) {
              const f = k / 10;
              const ang = lerp(startA, endA, f);
              const glow = 0.45 + 0.55 * Math.sin(t * 4.2 - k * 0.85);
              const kx = ox + Math.cos(ang) * radius;
              const ky = oy + Math.sin(ang) * radius;
              ctx.fillStyle = rgba(liveColor.core, glow * 0.9 * Math.min(1.1, lum) * vAlpha, m * 0.5);
              ctx.beginPath();
              ctx.arc(kx, ky, Math.max(2.0, (2.2 + glow * 1.4) * scaleRatio), 0, Math.PI * 2);
              ctx.fill();
            }

            // Drifting photonic micro-spores shedding gently off the neural crescent
            const sporeCount = Math.floor(neuralSpores.length * clamp(cur.particleRatio, 0.3, 1.0));
            for (let i = 0; i < sporeCount; i++) {
              const sp = neuralSpores[i];
              sp.life += dt * (0.24 + cur.speedMult * 0.22 + speechEnv * cur.speakingMode * 0.4);
              if (sp.life >= 1) {
                sp.life -= 1;
                sp.frac = 0.04 + Math.random() * 0.92;
              }
              const ang = lerp(startA, endA, clamp(sp.frac + sp.tangentialDrift * sp.life, 0.01, 0.99));
              const driftR = radius + (sp.offset + sp.radialSpeed * sp.life * 2.3) * baseRadius;
              const fade = Math.sin(sp.life * Math.PI);
              ctx.fillStyle = rgba(sp.life < 0.45 ? liveColor.core : liveColor.bright, fade * 0.78 * Math.min(1, lum) * vAlpha, m * 0.55);
              ctx.beginPath();
              ctx.arc(ox + Math.cos(ang) * driftR, oy + Math.sin(ang) * driftR, sp.size * (1 - sp.life * 0.42) * scaleRatio, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      // ==========================================================================
      // VARIANT III · CHRONO TITAN RENDERER
      // 10 articulated metallic iris shutter blades, energy singularity & micro-
      // reticle, arc-reactor coils, Vernier caliper dials, hex/oct lock-on geometry,
      // chamfered tactical brackets, dual-rail 28-cell segmented power gauge & laser
      // ==========================================================================
      function renderVariantTitan(vAlpha, t, dt, core, og, listeningLevel, lum, dynBloom) {
        const { coreX, coreY, coreR } = core;
        const scaleRatio = baseRadius / 260;
        const m = cur.muteFactor;
        const isDead = lum < 0.06 && !wakeSeq.active;
        const dynSpeed = currentStateKey === 'dead' ? 0 : (cur.speedMult * (1 + pulseImpulse * 3.2 + speechEnv * cur.speakingMode * 0.4));

        // Update mechanical kinematics & physical iris shutter dilation
        titanState.reticleAngle += dt * 0.52 * dynSpeed;
        titanState.coilAngle -= dt * 0.26 * dynSpeed;
        titanState.vernierAngle1 += dt * 0.34 * dynSpeed;
        titanState.vernierAngle2 -= dt * 0.22 * dynSpeed;
        titanState.hexAngle += dt * 0.18 * dynSpeed;
        titanState.octAngle -= dt * 0.14 * dynSpeed;
        titanState.bracketAngle += dt * 0.10 * dynSpeed;
        titanState.laserPhase = (titanState.laserPhase + dt * (cur.scanSpeed * 0.95 + pulseImpulse * 1.2)) % 2;

        let targetIris = cur.irisTarget;
        if (wakeSeq.active) {
          targetIris = smoothstep(0.35, 1.4, wakeSeq.elapsed) * 0.78;
        } else if (cur.speakingMode > 0.3) {
          targetIris = clamp(0.56 + speechEnv * 0.42, 0.45, 0.98);
        } else if (cur.thinkMedMode > 0.3) {
          targetIris = clamp(0.52 + thinkPulseValue * 0.42, 0.45, 0.96);
        } else if (cur.listeningMode > 0.3) {
          targetIris = clamp(0.76 + listeningLevel * 0.22, 0.7, 0.98);
        }
        titanState.irisOpen = lerp(titanState.irisOpen, targetIris, Math.min(1, dt * 7.5));

        const irisR = coreR * 1.06;

        // 1. Razor-Sharp Inner Energy Singularity & Precision Micro-Reticle (clipped inside iris housing)
        ctx.save();
        ctx.beginPath();
        ctx.arc(coreX, coreY, irisR, 0, Math.PI * 2);
        ctx.clip();

        // Dark optical chamber background
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgba(5,7,14,${(0.95 * vAlpha).toFixed(3)})`;
        ctx.fillRect(coreX - irisR, coreY - irisR, irisR * 2, irisR * 2);

        if (!isDead) {
          ctx.globalCompositeOperation = 'lighter';
          const cLum = Math.min(1.45, lum + dynBloom * 0.36);
          const openBoost = 0.25 + titanState.irisOpen * 0.75;

          const singGrad = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, irisR * 0.95);
          singGrad.addColorStop(0, `rgba(255,255,255,${clamp(0.98 * cLum * openBoost * vAlpha, 0, 1).toFixed(3)})`);
          singGrad.addColorStop(0.16, rgba(liveColor.core, clamp(0.95 * cLum * openBoost * vAlpha, 0, 1), m * 0.4));
          singGrad.addColorStop(0.42, rgba(liveColor.bright, clamp(0.68 * cLum * openBoost * vAlpha, 0, 0.9), m * 0.65));
          singGrad.addColorStop(0.75, rgba(liveColor.primary, clamp(0.32 * cLum * openBoost * vAlpha, 0, 0.55), m));
          singGrad.addColorStop(1, rgba(liveColor.deep, 0));
          ctx.fillStyle = singGrad;
          ctx.beginPath();
          ctx.arc(coreX, coreY, irisR * 0.95, 0, Math.PI * 2);
          ctx.fill();

          // Precision rotating micro-reticle crosshair
          const retR = irisR * 0.68;
          ctx.strokeStyle = rgba(liveColor.core, 0.78 * Math.min(1.1, lum) * openBoost * vAlpha, m * 0.5);
          ctx.lineWidth = Math.max(0.9, 1.15 * scaleRatio);
          ctx.beginPath();
          ctx.arc(coreX, coreY, retR * 0.48, 0, Math.PI * 2);
          ctx.stroke();

          for (let q = 0; q < 4; q++) {
            const a = titanState.reticleAngle + q * (Math.PI * 0.5);
            ctx.beginPath();
            ctx.moveTo(coreX + Math.cos(a) * retR * 0.22, coreY + Math.sin(a) * retR * 0.22);
            ctx.lineTo(coreX + Math.cos(a) * retR, coreY + Math.sin(a) * retR);
            ctx.stroke();
          }
        } else if (deadFlicker > 0.01) {
          ctx.globalCompositeOperation = 'lighter';
          const emGrad = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, irisR * 0.45);
          emGrad.addColorStop(0, rgba(liveColor.primary, deadFlicker * 0.55 * vAlpha));
          emGrad.addColorStop(1, rgba(liveColor.deep, 0));
          ctx.fillStyle = emGrad;
          ctx.beginPath();
          ctx.arc(coreX, coreY, irisR * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. 10 Articulated Metallic Iris Shutter Blades
        const BLADES = 10;
        const apertureR = irisR * lerp(0.0, 0.80, titanState.irisOpen);
        ctx.globalCompositeOperation = 'source-over';
