<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Tailwind CSS for minimal floating dock layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Crisp futuristic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       PURE OBSIDIAN VIEWPORT & DYNAMIC PALETTE CSS VARIABLES
       ========================================================================= */
    :root {
      --p-rgb: 255, 106, 0;
      --s-rgb: 255, 170, 0;
      --c-rgb: 255, 243, 209;
      --d-rgb: 122, 34, 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030306;
      font-family: 'Inter', sans-serif;
      color: #f3f4f6;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-hud { font-family: 'Orbitron', sans-serif; }
    .font-mono-hud { font-family: 'Share Tech Mono', monospace; }

    #aiCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #030306;
    }

    /* Ultra-minimal floating glassmorphic bottom dock */
    #bottomDock {
      background: linear-gradient(
        165deg,
        rgba(10, 11, 18, 0.72),
        rgba(5, 6, 11, 0.84)
      );
      border: 1px solid rgba(var(--p-rgb), 0.28);
      box-shadow:
        0 10px 36px rgba(0, 0, 0, 0.65),
        0 0 28px rgba(var(--p-rgb), 0.14),
        inset 0 0 18px rgba(var(--p-rgb), 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:
        opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.2s linear,
        box-shadow 0.2s linear;
    }

    #bottomDock.dock-hidden {
      opacity: 0;
      transform: translateY(26px) scale(0.97);
      pointer-events: none;
    }

    /* Glowing circular palette swatches */
    .palette-swatch {
      position: relative;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      flex-shrink: 0;
    }

    .palette-swatch:hover {
      transform: scale(1.18);
      border-color: rgba(255, 255, 255, 0.75);
    }

    .palette-swatch.swatch-active {
      transform: scale(1.22);
      border-color: #ffffff;
      box-shadow:
        0 0 0 2px rgba(3, 3, 6, 0.9),
        0 0 0 3.5px var(--swatch-color),
        0 0 16px var(--swatch-color);
    }

    /* Clean behavioral state pill buttons */
    .state-pill {
      background: rgba(14, 15, 24, 0.56);
      border: 1px solid rgba(var(--p-rgb), 0.2);
      color: rgba(235, 240, 250, 0.66);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      white-space: nowrap;
    }

    .state-pill:hover {
      background: rgba(var(--p-rgb), 0.14);
      border-color: rgba(var(--s-rgb), 0.6);
      color: rgba(var(--c-rgb), 0.98);
      box-shadow: 0 0 14px rgba(var(--p-rgb), 0.24);
    }

    .state-pill.pill-active {
      background: linear-gradient(
        135deg,
        rgba(var(--p-rgb), 0.3),
        rgba(var(--s-rgb), 0.16)
      );
      border-color: rgba(var(--c-rgb), 0.85);
      color: rgb(var(--c-rgb));
      box-shadow:
        0 0 18px rgba(var(--p-rgb), 0.45),
        inset 0 0 12px rgba(var(--s-rgb), 0.22);
      text-shadow: 0 0 10px rgba(var(--p-rgb), 0.8);
    }

    .palette-name-badge {
      color: rgb(var(--c-rgb));
      text-shadow: 0 0 10px rgba(var(--p-rgb), 0.65);
    }

    /* Subtle horizontal scroll styling for very narrow viewports */
    .dock-scroll::-webkit-scrollbar {
      height: 3px;
    }
    .dock-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .dock-scroll::-webkit-scrollbar-thumb {
      background: rgba(var(--p-rgb), 0.32);
      border-radius: 999px;
    }

    (function () {

      // --------------------------------------------------------------------------

      const ctx = canvas.getContext('2d', { alpha: false });
      const bottomDock = document.getElementById('bottomDock');
      const paletteRow = document.getElementById('paletteRow');
      const activePaletteNameEl = document.getElementById('activePaletteName');
      const stateButtons = document.querySelectorAll('.state-pill');

      // --------------------------------------------------------------------------
      // 8 CURATED NEON COLOR PALETTES & REAL-TIME RGB INTERPOLATION
      // --------------------------------------------------------------------------

        const clean = hex.replace('#', '');

      }

      const PALETTES = [
        {
          id: 'neon_orange',

          primary: hexToRgb('#ff6a00'),
          secondary: hexToRgb('#ffaa00'),

        },
        {

          secondary: hexToRgb('#38bdf8'),
          core: hexToRgb('#e0fbff'),

        },
        {

          core: hexToRgb('#ffe0e6'),

        },
        {

          primary: hexToRgb('#ffc800'),

          core: hexToRgb('#fffbe0'),

          hexPrimary: '#ffc800',
          hexSecondary: '#ffe45e'
        },
        {
          id: 'neural_violet',
          name: 'Neural Violet',
          primary: hexToRgb('#b537ff'),
          secondary: hexToRgb('#f038ff'),
          core: hexToRgb('#f5e0ff'),
          deep: hexToRgb('#3c096c'),
          hexPrimary: '#b537ff',
          hexSecondary: '#f038ff'
        },
        {
          id: 'matrix_emerald',
          name: 'Matrix Emerald',
          primary: hexToRgb('#00f58c'),
          secondary: hexToRgb('#5effb8'),
          core: hexToRgb('#e0fff2'),
          deep: hexToRgb('#004d29'),
          hexPrimary: '#00f58c',
          hexSecondary: '#5effb8'
        },
        {
          id: 'arctic_white',
          name: 'Arctic White',
          primary: hexToRgb('#d6eaff'),
          secondary: hexToRgb('#8ab8e6'),

        },
        {
          id: 'solar_plasma',
          name: 'Solar Plasma',
          primary: hexToRgb('#ff2e7e'),
          secondary: hexToRgb('#ff9900'),

          deep: hexToRgb('#5c0a2c'),
          hexPrimary: '#ff2e7e',
          hexSecondary: '#ff9900'
        }
      ];

      // Live smoothly interpolated RGB color state
      let activePaletteIndex = 0;
      const liveColor = {
        primary: { ...PALETTES[0].primary },
        secondary: { ...PALETTES[0].secondary },
        core: { ...PALETTES[0].core },
        deep: { ...PALETTES[0].deep }
      };

      // Cold charcoal / dark-metal reference tones for Dead state
      const DEAD_METAL = { r: 42, g: 46, b: 56 };
      const DEAD_WIRE = { r: 58, g: 64, b: 78 };

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function lerpRgb(cur, target, t) {
        cur.r = lerp(cur.r, target.r, t);
        cur.g = lerp(cur.g, target.g, t);
        cur.b = lerp(cur.b, target.b, t);
      }

      /**
       * Formats an RGB color object into rgba(...), softly muting toward
       * deep palette tones when luminance is in Idle standby (~0.32).
       */
      function rgba(col, alpha, muteFactor = 0) {
        const a = clamp(alpha, 0, 1);
        if (muteFactor <= 0.001) {
          return `rgba(${Math.round(col.r)},${Math.round(col.g)},${Math.round(col.b)},${a.toFixed(3)})`;
        }
        // Blend softly toward deep muted tone of the active palette
        const r = Math.round(lerp(col.r, liveColor.deep.r * 1.15, muteFactor * 0.55));
        const g = Math.round(lerp(col.g, liveColor.deep.g * 1.15, muteFactor * 0.55));
        const b = Math.round(lerp(col.b, liveColor.deep.b * 1.15, muteFactor * 0.55));
        return `rgba(${clamp(r, 0, 255)},${clamp(g, 0, 255)},${clamp(b, 0, 255)},${a.toFixed(3)})`;
      }

        const root = document.documentElement.style;
        root.setProperty('--p-rgb', `${Math.round(liveColor.primary.r)}, ${Math.round(liveColor.primary.g)}, ${Math.round(liveColor.primary.b)}`);

        root.setProperty('--c-rgb', `${Math.round(liveColor.core.r)}, ${Math.round(liveColor.core.g)}, ${Math.round(liveColor.core.b)}`);
        root.setProperty('--d-rgb', `${Math.round(liveColor.deep.r)}, ${Math.round(liveColor.deep.g)}, ${Math.round(liveColor.deep.b)}`);
      }

      // --------------------------------------------------------------------------
      // EXACT REMAPPED BEHAVIORAL STATE PROFILES
      // --------------------------------------------------------------------------
      const STATE_KEYS = [

        'listening',
        'speaking',
        'think_med',

          thinkMedMode: 0.0,
          thinkHardMode: 0.0,
          vibrationAmp: 0.0,

        },
        // 2. NORMAL: Alive standard mode (full vibrant neon, formerly 'Idle')
        normal: {
          speedMult: 0.94,
          luminance: 1.0,
          muteFactor: 0.0,
          corePulseAmp: 0.04,
          corePulseFreq: 1.65,
          synapseRate: 0.28,

          outerBreathAmp: 0.012,

          scanSpeed: 0.44,
          listeningMode: 0.0,
          speakingMode: 0.0,
          thinkMedMode: 0.0,

          synapseRate: 0.46,
          arcTightness: 0.96,

        // 4. SPEAKING: Wave-rich outward vocal emission (outward ripples, vocal oscilloscope, vocal EQ, harmonic rings)

        // 5. THINK MED: Resonant elastic pulsing (0.84x -> 1.26x orb scale + sympathetic lag arcs + thinking ripples)
        think_med: {
          speedMult: 1.72,
          luminance: 1.14,
          muteFactor: 0.0,

          corePulseFreq: 2.2,

        // 6. THINK HARD: Overclocked deep computation (white-hot overdrive, rapid arcs, jitter scanner, lightning)

        dead: {

      // --------------------------------------------------------------------------
      // CORE ENGINE RUNTIME STATE
      // --------------------------------------------------------------------------
      let width = 0, height = 0, dpr = 1;
      let cx = 0, cy = 0, baseRadius = 220;
      let dockVisible = true;

      let currentStateKey = 'normal';
      const cur = { ...STATE_PROFILES.normal };

      // Multi-stage cinematic Wake / Init timeline
      const wakeSeq = {
        active: false,

      // Interactive impulses, shockwaves, sonar/vocal ripples & synaptic lightning
      let pulseImpulse = 0;
      const shockwaves = [];

      const thinkRipples = [];

      // Dead-state occasional dying-ember micro-flicker
      let deadFlicker = 0;

      // Sympathetic Lag History Buffers (for Speaking subtle flex & Think Med deep elastic lag)
      const LAG_LEN = 48;
      const thinkLagBuf = new Float32Array(LAG_LEN);
      const speakLagBuf = new Float32Array(LAG_LEN);
      let lagHead = 0;

      // Realistic multi-syllable Speaking cadence state
      let speechEnv = 0;

      // Measured analytical Think Med resonance tracker
      let thinkPulseValue = 0;

      // Smooth Mouse / Touch Parallax
      const pointer = {

      };

      let lastTime = 0;
      let elapsedTime = 0;

      // --------------------------------------------------------------------------
      // SCENE GEOMETRY: VOLUMETRIC NEURAL LATTICE, AMBIENT DUST, 9 CONCENTRIC ARCS
      // --------------------------------------------------------------------------
      const NEURAL_NODE_COUNT = 76;
      const neuralNodes = [];
      (function initNeuralNodes() {
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < NEURAL_NODE_COUNT; i++) {
          const y = 1 - (i / (NEURAL_NODE_COUNT - 1)) * 2;
          const rAtY = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = goldenAngle * i;
          const shell = 0.34 + (((i * 41) % 100) / 100) * 0.62;
          neuralNodes.push({
            x: Math.cos(theta) * rAtY * shell,
            y: y * shell,
            z: Math.sin(theta) * rAtY * shell,
            phase: Math.random() * Math.PI * 2,
            size: 1.0 + Math.random() * 1.7
          });
        }
      })();

      const AMBIENT_PARTICLE_COUNT = 56;
      const ambientParticles = [];
      (function initAmbientParticles() {
        for (let i = 0; i < AMBIENT_PARTICLE_COUNT; i++) {
          ambientParticles.push({
            angle: Math.random() * Math.PI * 2,
            distFactor: 0.26 + Math.random() * 0.9,
            speed: (Math.random() - 0.5) * 0.08,
            size: 0.75 + Math.random() * 1.55,
            alpha: 0.14 + Math.random() * 0.38,
            twinklePhase: Math.random() * Math.PI * 2
          });
        }
      })();

      /**
       * 9 Distinct Counter-Rotating Concentric Ring Layers
       * Color roles: 'primary', 'secondary', 'core' (all smoothly follow active palette)
       */
      const concentricLayers = [
        // 0: Inner rapid luminous shimmer segments
        {
          radiusFactor: 0.272, angle: 0.2, speed: 0.58, direction: 1,
          thickness: 2.1, opacity: 0.92, role: 'core', glowRole: 'primary',
          type: 'segments',
          segments: [
            { start: 0.0, len: 1.2 }, { start: 1.75, len: 0.85 },

        },
        // 1: Fine counter-spinning dashed orbital track
        {
          radiusFactor: 0.316, angle: 1.1, speed: 0.35, direction: -1,
          thickness: 1.35, opacity: 0.7, role: 'secondary', glowRole: 'primary',
          type: 'dashed', dashCount: 44, dashRatio: 0.48
        },
        // 2: Bold primary segmented neon arcs
        {
          radiusFactor: 0.366, angle: 2.4, speed: 0.45, direction: 1,
          thickness: 4.6, opacity: 0.95, role: 'primary', glowRole: 'primary',
          type: 'heavySegments',
          segments: [
            { start: 0.15, len: 1.65 }, { start: 2.45, len: 1.15 }, { start: 4.15, len: 1.55 }
