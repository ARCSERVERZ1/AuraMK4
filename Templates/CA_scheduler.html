<!DOCTYPE html>
<html>

<head>

    <title>Scheduler Manager</title>

    <style>

        body{
            font-family: Arial;
            padding:20px;
            background:#f5f5f5;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
        }

        th{
            background:#222;
            color:white;
        }

        input,select{
            width:100%;
            padding:8px;
            box-sizing:border-box;
        }

        button{
            border:none;
            padding:8px 12px;
            cursor:pointer;
        }

        .save{
            background:green;
            color:white;
        }

        .delete{
            background:red;
            color:white;
        }

        .run{
            background:orange;
        }

        .add{
            background:#0066ff;
            color:white;
        }

    </style>

</head>

<body>

<h2>Scheduler Manager</h2>

<h3>Add Task</h3>

<form method="POST">

    {% csrf_token %}

    <input
        type="hidden"
        name="action"
        value="add"
    >

    <table>

        <tr>

            <td>
                <input
                    type="text"
                    name="task_name"
                    placeholder="Task Name"
                    required
                >
            </td>

            <td>
                <select name="frequency">
                    <option value="DAILY">DAILY</option>
                    <option value="MONTHLY">MONTHLY</option>
                    <option value="ONCE">ONCE</option>
                    <option value="INTERVAL">INTERVAL</option>
                </select>
            </td>

            <td>
                <input
                    type="datetime-local"
                    name="scheduled_time"
                    required
                >
            </td>

            <td>
                <input
                    type="text"
                    name="script_path"
                    placeholder="Script Path"
                >
            </td>

            <td>
                <input
                    type="text"
                    name="parameters"
                    placeholder="Parameters"
                >
            </td>

            <td>
                <input
                    type="number"
                    name="interval_minutes"
                    placeholder="Minutes"
                >
            </td>

            <td>
                <button
                    class="add"
                    type="submit"
                >
                    Add
                </button>
            </td>

        </tr>

    </table>

</form>

<br>

<table>

<thead>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Frequency</th>
    <th>Scheduled Time</th>
    <th>Script</th>
    <th>Parameters</th>
    <th>Status</th>
    <th>Interval</th>
    <th>Save</th>
    <th>Run Next Minute</th>
    <th>Delete</th>
</tr>

</thead>

<tbody>

{% for task in tasks %}

<tr>

<form method="POST">

    {% csrf_token %}

    <input type="hidden" name="action" value="edit">
    <input type="hidden" name="task_id" value="{{ task.id }}">

    <td>{{ task.id }}</td>

    <td>
        <input
            type="text"
            name="task_name"
            value="{{ task.task_name }}"
        >
    </td>

    <td>
        <select name="frequency">

            <option value="DAILY"
                {% if task.frequency == 'DAILY' %}selected{% endif %}
            >
                DAILY
            </option>

            <option value="MONTHLY"
                {% if task.frequency == 'MONTHLY' %}selected{% endif %}
            >
                MONTHLY
            </option>

            <option value="ONCE"
                {% if task.frequency == 'ONCE' %}selected{% endif %}
            >
                ONCE
            </option>

            <option value="INTERVAL"
                {% if task.frequency == 'INTERVAL' %}selected{% endif %}
            >
                INTERVAL
            </option>

        </select>
    </td>

    <td>
        <input
            type="datetime-local"
            name="scheduled_time"
            value="{{ task.scheduled_time|date:'Y-m-d\\TH:i' }}"
        >
    </td>

    <td>
        <input
            type="text"
            name="script_path"
            value="{{ task.script_path }}"
        >
    </td>

    <td>
        <input
            type="text"
            name="parameters"
            value="{{ task.parameters }}"
        >
    </td>

    <td>
        <select name="status">

            <option value="1"
                {% if task.status == 1 %}selected{% endif %}
            >
                Waiting
            </option>

            <option value="2"
                {% if task.status == 2 %}selected{% endif %}
            >
                Running
            </option>

            <option value="3"
                {% if task.status == 3 %}selected{% endif %}
            >
                Completed
            </option>

            <option value="4"
                {% if task.status == 4 %}selected{% endif %}
            >
                Failed
            </option>

        </select>
    </td>

    <td>
        <input
            type="number"
            name="interval_minutes"
            value="{{ task.interval_minutes }}"
        >
    </td>

    <td>
        <button class="save" type="submit">
            Save
        </button>
    </td>

</form>

<td>

    <form method="POST">

        {% csrf_token %}

        <input
            type="hidden"
            name="action"
            value="run_next_minute"
        >

        <input
            type="hidden"
            name="task_id"
            value="{{ task.id }}"
        >

        <button class="run" type="submit">
            Run Next Minute
        </button>

    </form>

</td>

<td>

    <form method="POST">

        {% csrf_token %}

        <input
            type="hidden"
            name="action"
            value="delete"
        >

        <input
            type="hidden"
            name="task_id"
            value="{{ task.id }}"
        >

        <button
            class="delete"
            type="submit"
            onclick="return confirm('Delete task?')"
        >
            Delete
        </button>

    </form>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</body>
</html>
