<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In | Enterprise Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Premium Professional Sans-Serif Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #090a0f;
  --card-bg: #12141c;
  --border-color: #222634;
  --border-focus: #4f46e5;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --btn-bg: #ffffff;
  --btn-text: #090a0f;
  --error-bg: #1c1012;
  --error-border: #f87171;
  --error-text: #fca5a5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg-main);
  /* Ultra-subtle professional ambient lighting background */
  background-image: radial-gradient(circle at 50% -20%, #1e1b4b, transparent 60%);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.login-box {
  width: 100%;
  max-width: 420px;
  padding: 40px;
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-main);
  text-align: left;
  margin-bottom: 8px;
}

.sub {
  text-align: left;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 32px;
  line-height: 1.5;
}

.form-group {
  margin-bottom: 20px;
}

label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-main);
  display: block;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  background-color: #0d0e15;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

input::placeholder {
  color: #475569;
}

input:focus {
  border-color: var(--border-focus);
  background-color: #0d0e15;
  box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
}

button {
  width: 100%;
  padding: 12px 16px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--btn-text);
  background-color: var(--btn-bg);
  transition: all 0.2s ease;
}

button:hover {
  background-color: #f1f5f9;
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

.error {
  display: flex;
  align-items: center;
  background-color: var(--error-bg);
  border: 1px solid var(--error-border);
  color: var(--error-text);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 24px;
  line-height: 1.4;
}

.footer {
  text-align: center;
  margin-top: 32px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">Sign In</div>
  <div class="sub">Enter your credentials to access your secure enterprise account dashboard.</div>

  {% if messages %}
    {% for message in messages %}
      <div class="error">
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="name@company.com" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit">Continue</button>
  </form>

  <div class="footer">
    © {{ year|default:"2026" }} Enterprise Platform Inc. All rights reserved.
  </div>

</div>

</body>
</html>
