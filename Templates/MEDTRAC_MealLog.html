<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Data</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --primary: #6366f1; --primary-soft: #818cf8; --accent: #10b981;
  --bg: #0b1120; --card: #111827; --card-soft: #0f172a;
  --card-hover: #172033; --text: #f3f4f6; --muted: #94a3b8;
  --border: #1e293b; --radius: 14px; --shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
}
* { box-sizing: border-box; font-family: Inter, system-ui, Arial, sans-serif; }
body { background: linear-gradient(180deg, #020617, #0b1120); color: var(--text); margin: 0; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 100; backdrop-filter: blur(14px); background: rgba(2, 6, 23, 0.78); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; color: white; text-decoration: none; }
.logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(99, 102, 241, 0.18); border: 1px solid rgba(99, 102, 241, 0.38); color: var(--primary-soft); font-weight: 800; }
.page { width: 100%; max-width: 1480px; margin: 0 auto; padding: 26px 22px 40px; }
.panel { background: linear-gradient(145deg, var(--card), #0f172a); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: auto; max-height: calc(100vh - 230px); }
.table { min-width: 1320px; --bs-table-bg: var(--card); --bs-table-color: var(--text); --bs-table-border-color: var(--border); --bs-table-hover-bg: #172033; margin-bottom: 0; }
.table thead th { background: var(--card-hover); color: #fff; font-size: 13px; cursor: pointer; position: sticky; top: 0; z-index: 10; }
.table tbody td { font-size: 13px; vertical-align: middle; border-color: var(--border); color: var(--text); }
.table-hover tbody tr:hover td { background-color: var(--card-hover) !important; color: #fff !important; }
.form-control, .form-select { background-color: var(--card-soft); border-color: var(--border); color: var(--text); }
.form-control:focus, .form-select:focus { background-color: var(--card-soft); color: var(--text); border-color: var(--primary); box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25); }
.badge-soft { background: rgba(99, 102, 241, 0.18); color: #c7d2fe; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 700; }

/* Custom Modal Styling for Dark Theme */
.modal-content { background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.modal-header { border-bottom: 1px solid var(--border); }
.modal-footer { border-top: 1px solid var(--border); }
.modal-title { font-weight: 700; color: #fff; }
.btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input[readonly] { background-color: #020617 !important; color: var(--muted) !important; cursor: not-allowed; }
</style>
</head>

<body>
<header class="topbar">
  <a class="brand" href="/medtrac/">
    <div class="logo">M</div>
    <div class="brand-text"><strong>Meal Data</strong></div>
  </a>
  <a href="/medtrac/" class="btn btn-outline-light btn-sm">Dashboard</a>
</header>

<main class="page">
  <section class="panel">
    <div class="toolbar mb-3">
      <div><h5 class="fw-bold">Meal Logs</h5></div>
      <div class="toolbar-actions">
        <select id="userFilter" class="form-select" style="width: auto;" onchange="loadMeals()">
          {% for u in usernames %}<option value="{{ u }}" {% if u == selected_username %}selected{% endif %}>{{ u }}</option>{% endfor %}
        </select>
        <input type="date" id="startDate" class="form-control" style="width: auto;" value="{{ default_start }}" onchange="loadMeals()">
        <input type="date" id="endDate" class="form-control" style="width: auto;" value="{{ default_end }}" onchange="loadMeals()">
        <input type="text" id="freeSearch" class="form-control" style="width: 250px;" placeholder="Search..." onkeyup="applySearch()">
      </div>
    </div>
    <div class="table-wrap">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Meal</th><th>Food</th><th>Qty</th><th>Type</th><th>Time</th><th>Cal</th><th>Protein</th><th>Carbs</th><th>Fats</th><th>Fiber</th><th>Sugar</th><th>Sodium</th><th>Actions</th><th>ID</th><th>User</th>
          </tr>
        </thead>
        <tbody id="mealTable"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="modal fade" id="editMealModal" tabindex="-1" aria-labelledby="editMealModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editMealModalLabel">Edit Meal Data</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label>UID</label>
            <input type="text" class="form-control" id="edit-uid" readonly>
          </div>
          <div class="col-md-6">
            <label>User Name</label>
            <input type="text" class="form-control" id="edit-user" readonly>
          </div>

          <hr class="border-secondary my-4">

          <div class="col-md-4">
            <label>Food Name</label>
            <input type="text" class="form-control" id="edit-food">
          </div>
          <div class="col-md-4">
            <label>Meal Type</label>
            <input type="text" class="form-control" id="edit-mealtype">
          </div>
          <div class="col-md-4">
            <label>Quantity</label>
            <input type="text" class="form-control" id="edit-qty">
          </div>

          <div class="col-md-6">
            <label>Type (Veg/Non-veg)</label>
            <input type="text" class="form-control" id="edit-nonveg">
          </div>
          <div class="col-md-6">
            <label>Timestamp</label>
            <input type="text" class="form-control" id="edit-time">
          </div>

          <div class="col-md-4">
            <label>Calories</label>
            <input type="number" class="form-control" id="edit-cal">
          </div>
          <div class="col-md-4">
            <label>Protein</label>
            <input type="number" step="0.1" class="form-control" id="edit-pro">
          </div>
          <div class="col-md-4">
            <label>Carbs</label>
            <input type="number" step="0.1" class="form-control" id="edit-carbs">
          </div>

          <div class="col-md-4">
            <label>Fats</label>
            <input type="number" step="0.1" class="form-control" id="edit-fats">
          </div>
          <div class="col-md-4">
            <label>Fiber</label>
            <input type="number" step="0.1" class="form-control" id="edit-fiber">
          </div>
          <div class="col-md-4">
            <label>Sugar</label>
            <input type="number" step="0.1" class="form-control" id="edit-sugar">
          </div>

          <div class="col-md-4">
            <label>Sodium</label>
            <input type="number" step="0.1" class="form-control" id="edit-sodium">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveMealEdit()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CURRENT_USER = "{{ current_user|escapejs }}";
let currentMeals = [];
let editModalInstance = null; // Store modal instance globally

function loadMeals() {
  const user = document.getElementById("userFilter")?.value || "";
  const start = document.getElementById("startDate")?.value || "";
  const end = document.getElementById("endDate")?.value || "";
  const table = document.getElementById("mealTable");

  // Fetch logic intact
  fetch(`/medtrac/api/meals/list/?user=${encodeURIComponent(user)}&start_date=${start}&end_date=${end}`)
    .then(res => res.json())
    .then(data => {
      currentMeals = data;
      table.innerHTML = "";
      data.forEach((meal, i) => {
        const uid = meal.uid || meal.id;
        table.innerHTML += `<tr>
          <td><span class="badge-soft">${meal.meal_type}</span></td>
          <td>${meal.food_name}</td><td>${meal.quantity}</td><td>${meal.is_nonveg}</td>
          <td>${new Date(meal.timestamp).toLocaleString()}</td>
          <td>${meal.estimated_calories}</td><td>${meal.estimated_protein}</td>
          <td>${meal.estimated_carbs}</td><td>${meal.estimated_fats}</td>
          <td>${meal.estimated_fiber}</td><td>${meal.estimated_sugar}</td>
          <td>${meal.estimated_sodium}</td>
          <td>
            <button class="btn btn-sm btn-warning me-1" onclick="openEditModal(${i})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteMeal('${uid}')">Delete</button>
          </td>
          <td>${uid}</td><td>${meal.user}</td>
        </tr>`;
      });
    });
}

// Function to populate and open the Edit Modal
function openEditModal(index) {
  const meal = currentMeals[index];

  // Populate Readonly fields
  document.getElementById('edit-uid').value = meal.uid || meal.id;
  document.getElementById('edit-user').value = meal.user;

  // Populate Editable fields
  document.getElementById('edit-food').value = meal.food_name;
  document.getElementById('edit-mealtype').value = meal.meal_type;
  document.getElementById('edit-qty').value = meal.quantity;
  document.getElementById('edit-nonveg').value = meal.is_nonveg;
  document.getElementById('edit-time').value = meal.timestamp;
  document.getElementById('edit-cal').value = meal.estimated_calories;
  document.getElementById('edit-pro').value = meal.estimated_protein;
  document.getElementById('edit-carbs').value = meal.estimated_carbs;
  document.getElementById('edit-fats').value = meal.estimated_fats;
  document.getElementById('edit-fiber').value = meal.estimated_fiber;
  document.getElementById('edit-sugar').value = meal.estimated_sugar;
  document.getElementById('edit-sodium').value = meal.estimated_sodium;

  // Initialize and show modal
  if (!editModalInstance) {
    editModalInstance = new bootstrap.Modal(document.getElementById('editMealModal'));
  }
  editModalInstance.show();
}

// Function to handle save/API mock call
function saveMealEdit() {
  // Construct the payload from the form inputs
  const payload = {
    uid: document.getElementById('edit-uid').value,
    user: document.getElementById('edit-user').value,
    food_name: document.getElementById('edit-food').value,
    meal_type: document.getElementById('edit-mealtype').value,
    quantity: document.getElementById('edit-qty').value,
    is_nonveg: document.getElementById('edit-nonveg').value,
    timestamp: document.getElementById('edit-time').value,
    estimated_calories: document.getElementById('edit-cal').value,
    estimated_protein: document.getElementById('edit-pro').value,
    estimated_carbs: document.getElementById('edit-carbs').value,
    estimated_fats: document.getElementById('edit-fats').value,
    estimated_fiber: document.getElementById('edit-fiber').value,
    estimated_sugar: document.getElementById('edit-sugar').value,
    estimated_sodium: document.getElementById('edit-sodium').value
  };

  // Mock API Call - Print to Console

  console.log("Payload to be sent:", JSON.stringify(payload, null, 2));


  fetch(`/medtrac/api/meals/update/${payload.uid}/`, {
    method: "PUT", // or PATCH
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(res => {
    if(res.ok) {
       loadMeals(); // Refresh data
    }
  });


  // Close the modal
  if (editModalInstance) {
    editModalInstance.hide();
  }
}

function deleteMeal(id) {
  if (!confirm("Delete this meal?")) return;
  fetch(`/medtrac/api/meals/delete/${encodeURIComponent(id)}/`, { method: "DELETE" })
    .then(res => { if (res.ok) loadMeals(); else alert("Delete failed"); });
}

function applySearch() {
  const input = document.getElementById("freeSearch").value.toLowerCase();
  document.querySelectorAll("#mealTable tr").forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}

window.onload = loadMeals;
</script>
</body>
</html>
<script>
    window.AppConfig = {
        user: "{{ request.user.username }}"
    };
</script>
<script src="{% static 'js/aura_standard.js' %}"></script>
