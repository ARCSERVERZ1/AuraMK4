<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Data</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --primary: #6366f1;
  --primary-soft: #818cf8;
  --accent: #10b981;
  --bg: #0b1120;
  --card: #111827;
  --card-soft: #0f172a;
  --card-hover: #172033;
  --text: #f3f4f6;
  --muted: #94a3b8;
  --border: #1e293b;
  --radius: 14px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
}

* {
  box-sizing: border-box;
  font-family: Inter, system-ui, Arial, sans-serif;
}

body {
  background: linear-gradient(180deg, #020617, #0b1120);
  color: var(--text);
  margin: 0;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(14px);
  background: rgba(2, 6, 23, 0.78);
  border-bottom: 1px solid var(--border);
  color: white;
  padding: 14px 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: white;
  text-decoration: none;
}

.logo {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: rgba(99, 102, 241, 0.18);
  border: 1px solid rgba(99, 102, 241, 0.38);
  color: var(--primary-soft);
  font-weight: 800;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.breadcrumb-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 700;
}

.breadcrumb-line .slash {
  color: var(--muted);
  font-weight: 400;
}

.breadcrumb-line .active {
  color: var(--primary-soft);
}

.brand-sub {
  color: var(--muted);
  font-size: 11px;
}

.brand:hover .breadcrumb-line span:first-child {
  color: var(--primary-soft);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.header-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s ease;
  cursor: pointer;
}

.header-btn:hover {
  border-color: var(--primary);
  color: var(--text);
  transform: translateY(-1px);
}

.header-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.header-btn.primary:hover {
  background: var(--primary-soft);
  border-color: var(--primary-soft);
  color: white;
}

.page {
  width: 100%;
  max-width: 1480px;
  margin: 0 auto;
  padding: 26px 22px 40px;
}

.panel {
  background: linear-gradient(145deg, var(--card), #0f172a);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 18px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.toolbar-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search-box {
  min-width: 260px;
  max-width: 420px;
}

.table-wrap {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: auto;
  max-height: calc(100vh - 230px);
}

.table {
  min-width: 1320px;
  margin: 0;
  --bs-table-bg: var(--card);
  --bs-table-color: var(--text);
  --bs-table-border-color: var(--border);
  --bs-table-hover-bg: #172033;
  --bs-table-hover-color: var(--text);
}

.table thead th {
  background: var(--card-hover);
  color: #fff;
  border-color: var(--border);
  border-bottom-color: rgba(99, 102, 241, 0.55);
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  position: sticky;
  top: 0;
  z-index: 1;
}

.table tbody td {
  font-size: 13px;
  vertical-align: middle;
  background: var(--card);
  color: var(--text);
  border-color: var(--border);
}

.muted {
  color: var(--muted);
  font-size: 13px;
}

.save-btn {
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: 700;
  padding: 12px;
}

.save-btn:hover {
  background: #059669;
  color: white;
}

.modal-content {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  color: var(--text);
}

.modal-header {
  color: var(--text);
}

.btn-close {
  filter: invert(1) grayscale(100%) brightness(200%);
}

.form-control,
.form-select {
  background-color: var(--card-soft);
  border-color: var(--border);
  color: var(--text);
}

.form-control:focus,
.form-select:focus {
  background-color: var(--card-soft);
  border-color: var(--primary);
  box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.2);
  color: var(--text);
}

.form-control::placeholder {
  color: var(--muted);
}

.form-label {
  color: var(--muted);
  font-size: 13px;
}

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}

.badge-soft {
  background: rgba(99, 102, 241, 0.18);
  color: #c7d2fe;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 12px;
  font-weight: 700;
}

@media (max-width: 760px) {
  .topbar {
    align-items: flex-start !important;
    flex-direction: column;
    padding: 14px;
  }

  .breadcrumb-line {
    font-size: 14px;
  }

  .top-actions,
  .top-actions .header-btn {
    width: 100%;
  }

  .top-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .page {
    padding: 12px;
  }

  .panel {
    padding: 14px;
  }

  .toolbar,
  .toolbar-actions,
  .toolbar-actions .btn,
  .search-box {
    width: 100%;
  }

  .table-wrap {
    max-height: none;
  }
}
</style>
</head>

<body>

<header class="topbar d-flex align-items-center justify-content-between flex-wrap gap-2">
  <a class="brand" href="dashboard.html">
    <div class="logo">M</div>
    <div class="brand-text">
      <div class="breadcrumb-line">
        <span>Home</span>
        <span class="slash">/</span>
        <span class="active">Meal Data</span>
      </div>
      <span class="brand-sub">View, edit, and manage meal logs</span>
    </div>
  </a>
  <div class="top-actions">
    <a class="header-btn" href="dashboard.html">Dashboard</a>
    <button class="header-btn primary" onclick="loadMeals()">Refresh</button>
  </div>
</header>

<main class="page">
  <section class="panel">
    <div class="toolbar mb-3">
      <div>
        <h5 class="mb-1 fw-bold">Meal Logs</h5>
        <div class="muted">View, search, sort, edit, and delete API records.</div>
      </div>

      <div class="toolbar-actions">
        <input type="text" id="freeSearch" class="form-control search-box" placeholder="Search anything..." onkeyup="applySearch()">
      </div>
    </div>

    <div class="table-wrap">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th onclick="sortTable(0)">ID</th>
            <th onclick="sortTable(1)">User</th>
            <th onclick="sortTable(2)">Meal</th>
            <th onclick="sortTable(3)">Food</th>
            <th onclick="sortTable(4)">Qty</th>
            <th onclick="sortTable(5)">Veg/NonVeg</th>
            <th onclick="sortTable(6)">Timestamp</th>
            <th onclick="sortTable(7)">Calories</th>
            <th onclick="sortTable(8)">Protein</th>
            <th onclick="sortTable(9)">Carbs</th>
            <th onclick="sortTable(10)">Fats</th>
            <th onclick="sortTable(11)">Fiber</th>
            <th onclick="sortTable(12)">Sugar</th>
            <th onclick="sortTable(13)">Sodium</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="mealTable">
          <tr>
            <td colspan="15">
              <div class="empty-state">Loading meal data...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Meal Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewBody"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Edit Meal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="edit_id">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">User</label>
            <input class="form-control" id="edit_user">
          </div>

          <div class="col-md-6">
            <label class="form-label">Meal Type</label>
            <input class="form-control" id="edit_meal_type">
          </div>

          <div class="col-md-6">
            <label class="form-label">Food Type</label>
            <select class="form-select" id="edit_is_nonveg">
              <option value="Veg">Veg</option>
              <option value="Non-Veg">Non-Veg</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Quantity</label>
            <input class="form-control" id="edit_qty">
          </div>

          <div class="col-12">
            <label class="form-label">Food Name</label>
            <input class="form-control" id="edit_food">
          </div>

          <div class="col-md-6">
            <label class="form-label">Timestamp</label>
            <input type="datetime-local" class="form-control" id="edit_time">
          </div>

          <div class="col-md-4"><label class="form-label">Calories</label><input class="form-control" id="edit_cal"></div>
          <div class="col-md-4"><label class="form-label">Protein</label><input class="form-control" id="edit_protein"></div>
          <div class="col-md-4"><label class="form-label">Carbs</label><input class="form-control" id="edit_carbs"></div>
          <div class="col-md-4"><label class="form-label">Fats</label><input class="form-control" id="edit_fats"></div>
          <div class="col-md-4"><label class="form-label">Fiber</label><input class="form-control" id="edit_fiber"></div>
          <div class="col-md-4"><label class="form-label">Sugar</label><input class="form-control" id="edit_sugar"></div>
          <div class="col-md-4"><label class="form-label">Sodium</label><input class="form-control" id="edit_sodium"></div>
        </div>

        <button class="btn save-btn w-100 mt-4" onclick="updateMeal()">Update Meal</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const CURRENT_USER = window.CURRENT_USER || "{{ current_user|escapejs }}" || "demo_user";
let sortDirection = true;
let currentMeals = [];

const viewModal = new bootstrap.Modal(document.getElementById("viewModal"));
const editModal = new bootstrap.Modal(document.getElementById("editModal"));

function safeText(value) {
  if (value === null || value === undefined || value === "") return "";
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatTimestamp(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString();
}

function toDatetimeLocal(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value).slice(0, 16);
  return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}

function loadMeals() {
  const table = document.getElementById("mealTable");
  table.innerHTML = `
    <tr>
      <td colspan="15"><div class="empty-state">Loading meal data...</div></td>
    </tr>
  `;

  fetch(`/medtrac/api/meals/list/?user=${encodeURIComponent(CURRENT_USER)}`)
    .then(res => {
      if (!res.ok) throw new Error("Could not load meals");
      return res.json();
    })
    .then(data => {
      currentMeals = Array.isArray(data) ? data : [];
      renderMeals(currentMeals);
    })
    .catch(() => {
      table.innerHTML = `
        <tr>
          <td colspan="15"><div class="empty-state">Could not load meal data. Please check the API response.</div></td>
        </tr>
      `;
    });
}

function renderMeals(data) {
  const table = document.getElementById("mealTable");

  if (!data.length) {
    table.innerHTML = `
      <tr>
        <td colspan="15"><div class="empty-state">No meal records found.</div></td>
      </tr>
    `;
    return;
  }

  table.innerHTML = "";
  data.forEach((meal, index) => {
    const uid = meal.uid || meal.id || "";
    table.innerHTML += `
      <tr>
        <td>${safeText(uid)}</td>
        <td>${safeText(meal.user)}</td>
        <td><span class="badge-soft">${safeText(meal.meal_type)}</span></td>
        <td>${safeText(meal.food_name)}</td>
        <td>${safeText(meal.quantity)}</td>
        <td>${safeText(meal.is_nonveg)}</td>
        <td>${safeText(formatTimestamp(meal.timestamp))}</td>
        <td>${safeText(meal.estimated_calories)}</td>
        <td>${safeText(meal.estimated_protein)}</td>
        <td>${safeText(meal.estimated_carbs)}</td>
        <td>${safeText(meal.estimated_fats)}</td>
        <td>${safeText(meal.estimated_fiber)}</td>
        <td>${safeText(meal.estimated_sugar)}</td>
        <td>${safeText(meal.estimated_sodium)}</td>
        <td class="text-nowrap">
          <button class="btn btn-sm btn-info me-1" onclick="openViewModal(${index})">View</button>
          <button class="btn btn-sm btn-warning me-1" onclick="openEditModal(${index})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteMeal('${safeText(uid)}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

function openViewModal(index) {
  const meal = currentMeals[index];
  if (!meal) return;

  document.getElementById("viewBody").innerHTML = `
    <div class="row g-3">
      <div class="col-md-4"><strong>ID</strong><div>${safeText(meal.uid || meal.id)}</div></div>
      <div class="col-md-4"><strong>User</strong><div>${safeText(meal.user)}</div></div>
      <div class="col-md-4"><strong>Meal</strong><div>${safeText(meal.meal_type)}</div></div>
      <div class="col-12"><strong>Food</strong><div>${safeText(meal.food_name)}</div></div>
      <div class="col-md-4"><strong>Quantity</strong><div>${safeText(meal.quantity)}</div></div>
      <div class="col-md-4"><strong>Food Type</strong><div>${safeText(meal.is_nonveg)}</div></div>
      <div class="col-md-4"><strong>Timestamp</strong><div>${safeText(formatTimestamp(meal.timestamp))}</div></div>
      <div class="col-md-3"><strong>Calories</strong><div>${safeText(meal.estimated_calories)}</div></div>
      <div class="col-md-3"><strong>Protein</strong><div>${safeText(meal.estimated_protein)}</div></div>
      <div class="col-md-3"><strong>Carbs</strong><div>${safeText(meal.estimated_carbs)}</div></div>
      <div class="col-md-3"><strong>Fats</strong><div>${safeText(meal.estimated_fats)}</div></div>
      <div class="col-md-3"><strong>Fiber</strong><div>${safeText(meal.estimated_fiber)}</div></div>
      <div class="col-md-3"><strong>Sugar</strong><div>${safeText(meal.estimated_sugar)}</div></div>
      <div class="col-md-3"><strong>Sodium</strong><div>${safeText(meal.estimated_sodium)}</div></div>
    </div>
  `;

  viewModal.show();
}

function openEditModal(index) {
  const meal = currentMeals[index];
  if (!meal) return;

  document.getElementById("edit_id").value = meal.uid || meal.id || "";
  document.getElementById("edit_user").value = meal.user || "";
  document.getElementById("edit_meal_type").value = meal.meal_type || "";
  document.getElementById("edit_is_nonveg").value = meal.is_nonveg || "Veg";
  document.getElementById("edit_food").value = meal.food_name || "";
  document.getElementById("edit_qty").value = meal.quantity || "";
  document.getElementById("edit_time").value = toDatetimeLocal(meal.timestamp);
  document.getElementById("edit_cal").value = meal.estimated_calories || "";
  document.getElementById("edit_protein").value = meal.estimated_protein || "";
  document.getElementById("edit_carbs").value = meal.estimated_carbs || "";
  document.getElementById("edit_fats").value = meal.estimated_fats || "";
  document.getElementById("edit_fiber").value = meal.estimated_fiber || "";
  document.getElementById("edit_sugar").value = meal.estimated_sugar || "";
  document.getElementById("edit_sodium").value = meal.estimated_sodium || "";

  editModal.show();
}

function updateMeal() {
  const id = document.getElementById("edit_id").value;

  const payload = {
    user: document.getElementById("edit_user").value,
    meal_type: document.getElementById("edit_meal_type").value,
    food_name: document.getElementById("edit_food").value,
    is_nonveg: document.getElementById("edit_is_nonveg").value,
    quantity: document.getElementById("edit_qty").value,
    timestamp: document.getElementById("edit_time").value,
    estimated_calories: document.getElementById("edit_cal").value,
    estimated_protein: document.getElementById("edit_protein").value,
    estimated_carbs: document.getElementById("edit_carbs").value,
    estimated_fats: document.getElementById("edit_fats").value,
    estimated_fiber: document.getElementById("edit_fiber").value,
    estimated_sugar: document.getElementById("edit_sugar").value,
    estimated_sodium: document.getElementById("edit_sodium").value
  };

  fetch(`/medtrac/api/meals/update/${encodeURIComponent(id)}/`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(res => {
    if (!res.ok) throw new Error("Update failed");
  })
  .then(() => {
    editModal.hide();
    loadMeals();
  })
  .catch(() => alert("Could not update meal. Please check the API response."));
}

function deleteMeal(id) {
  if (!id || !confirm("Delete this meal?")) return;

  fetch(`/medtrac/api/meals/delete/${encodeURIComponent(id)}/`, { method: "DELETE" })
    .then(res => {
      if (!res.ok) throw new Error("Delete failed");
    })
    .then(() => loadMeals())
    .catch(() => alert("Could not delete meal. Please check the API response."));
}

function sortTable(colIndex) {
  const tbody = document.getElementById("mealTable");
  const rows = Array.from(tbody.querySelectorAll("tr")).filter(row => row.children.length > 1);

  rows.sort((a, b) => {
    const A = a.children[colIndex].innerText.toLowerCase();
    const B = b.children[colIndex].innerText.toLowerCase();
    const numA = Number(A.replaceAll(",", ""));
    const numB = Number(B.replaceAll(",", ""));

    if (!Number.isNaN(numA) && !Number.isNaN(numB)) {
      return sortDirection ? numA - numB : numB - numA;
    }

    return sortDirection ? A.localeCompare(B) : B.localeCompare(A);
  });

  sortDirection = !sortDirection;
  tbody.innerHTML = "";
  rows.forEach(row => tbody.appendChild(row));
}

function applySearch() {
  const input = document.getElementById("freeSearch").value.toLowerCase();
  const rows = document.querySelectorAll("#mealTable tr");

  rows.forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

loadMeals();
</script>

</body>
</html>
