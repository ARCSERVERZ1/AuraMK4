{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docma</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b1120;
    --bg-soft:#111827;

    --card:#111827;
    --card-hover:#172033;

    --primary:#6366f1;
    --primary-soft:#818cf8;

    --text:#f3f4f6;
    --muted:#94a3b8;

    --border:#1e293b;

    --radius:16px;
    --shadow:0 8px 30px rgba(0,0,0,.22);
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:linear-gradient(180deg,#020617,#0b1120);
    color:var(--text);

    min-height:100vh;

    display:flex;
    flex-direction:column;

    transition:.25s ease;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;

    backdrop-filter:blur(14px);
    background:rgba(2,6,23,.78);

    border-bottom:1px solid var(--border);

    padding:14px 24px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* BRAND */
.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.home-icon{
    width:40px;
    height:40px;

    border-radius:12px;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-soft)
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:16px;
    font-weight:700;

    color:#fff;

    box-shadow:0 6px 18px rgba(99,102,241,.35);
}

.brand-text{
    display:flex;
    flex-direction:column;
    gap:4px;
}

/* BREADCRUMB */
.breadcrumb{
    display:flex;
    align-items:center;
    gap:8px;

    flex-wrap:wrap;

    font-size:14px;
    font-weight:600;
}

.breadcrumb a{
    text-decoration:none;
    color:var(--text);

    transition:.2s;
}

.breadcrumb a:hover{
    color:var(--primary-soft);
}

.breadcrumb .slash{
    color:var(--muted);
    font-weight:400;
}

.breadcrumb .active{
    color:var(--primary-soft);
}

.brand-sub{
    font-size:11px;
    color:var(--muted);
}

/* RIGHT */
.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* SELECT */
select{
    height:40px;
    padding:0 14px;

    border-radius:12px;
    border:1px solid var(--border);

    background:rgba(255,255,255,.03);

    color:var(--text);

    font-size:13px;
    font-weight:500;

    outline:none;

    transition:.2s;

    cursor:pointer;
}

select:hover{
    border-color:var(--primary);
}

select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}

/* MAIN */
main{
    flex:1;

    width:100%;
    max-width:1450px;

    margin:auto;

    padding:26px 22px 40px;
}

/* TITLE */
.section-title{
    font-size:24px;
    font-weight:700;

    margin-bottom:4px;
}

.sub{
    font-size:13px;
    color:var(--muted);

    margin-bottom:24px;
}

/* GRID */
.cards{
    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));

    gap:16px;
}

/* CARD */
.card{
    background:linear-gradient(145deg,var(--card),#0f172a);

    border:1px solid var(--border);

    border-radius:18px;

    padding:16px;

    display:flex;
    align-items:center;
    gap:16px;

    cursor:pointer;

    position:relative;
    overflow:hidden;

    transition:.25s ease;

    box-shadow:var(--shadow);
}

/* glossy */
.card::before{
    content:"";

    position:absolute;
    inset:0;

    background:linear-gradient(
        135deg,
        rgba(255,255,255,.03),
        transparent 40%
    );

    pointer-events:none;
}

/* hover */
.card:hover{
    transform:translateY(-4px);

    border-color:rgba(99,102,241,.55);

    background:var(--card-hover);
}

.card:active{
    transform:scale(.98);
}

/* LEFT ICON WRAPPER & FALLBACK */
.icon-wrapper {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border-radius: 18px;
}

.fallback-icon {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: rgba(99, 102, 241, 0.15);
    border: 2px solid rgba(99, 102, 241, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-soft);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 1;
}

.doc-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    object-fit: cover;
    border: 2px solid rgba(99,102,241,.35);
    z-index: 2;
    background: var(--card);
}

/* RIGHT INFO */
.card-info{
    flex:1;

    min-width:0;
}

/* TITLE */
.card-info h3{
    font-size:15px;
    font-weight:600;

    margin-bottom:8px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* FILE BADGE */
.file-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:7px 12px;

    border-radius:999px;

    background:rgba(99,102,241,.12);

    color:var(--primary-soft);

    font-size:12px;
    font-weight:600;
}

/* ARROW */
.arrow{
    width:34px;
    height:34px;

    border-radius:10px;

    background:rgba(99,102,241,.12);

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--primary-soft);

    font-size:14px;

    transition:.2s;
}

.card:hover .arrow{
    transform:translateX(4px);
    background:rgba(99,102,241,.22);
}

/* FOOTER */
footer{
    margin-top:20px;

    padding:18px;

    text-align:center;

    font-size:12px;

    color:var(--muted);

    border-top:1px solid var(--border);
}

/* SCROLLBAR */
::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#0b1120;
}

::-webkit-scrollbar-thumb{
    background:#273449;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#3b4d69;
}

/* MOBILE */
@media(max-width:700px){

    header{
        flex-direction:column;
        align-items:flex-start;
        gap:14px;
    }

    .top-right{
        width:100%;
    }

    .top-right form{
        flex:1;
    }

    select{
        width:100%;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .card{
        padding:14px;
    }

    .icon-wrapper{
        width:56px;
        height:56px;
    }

    .fallback-icon{
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>

<div class="brand">

    <div class="home-icon">⌂</div>

    <div class="brand-text">

        <div class="breadcrumb">

            <a href="/home">Home</a>

            <span class="slash">/</span>

            <a href="/docma">Docma</a>

            <span class="slash">/</span>

            <span class="active">Sub Categories</span>

        </div>

        <span class="brand-sub">
            Document Manager
        </span>

    </div>

</div>

<div class="top-right">

<form method="GET">

    <input type="hidden" name="cat" value="{{ request.GET.cat }}">
    <input type="hidden" name="subcat" value="{{ request.GET.subcat }}">

    <select name="user" onchange="this.form.submit()">

        <option value="all"
        {% if selected_user == 'all' %}selected{% endif %}>
            All Users
        </option>

        {% for user in users %}
        <option value="{{user}}"
        {% if selected_user == user %}selected{% endif %}>
            {{user}}
        </option>
        {% endfor %}

    </select>

</form>

</div>

</header>

<main>

<h2 class="section-title">Sub Categories</h2>

<div class="sub">
    Select a sub category to explore files
</div>

<div class="cards">

{% for card in card_data %}

<div class="card"

onclick="window.location.href='/docma/images/?user={{selected_user}}&cat={{card.category}}&subcat={{card.sub_category}}'">

    <!-- LEFT ICON WITH DYNAMIC INITIALS FALLBACK -->
    <div class="icon-wrapper">
        <div class="fallback-icon" data-title="{{ card.sub_category }}"></div>
        <img
        src="DOCMA/MasterCategoryIcons/adhar_icon.jpg"
        class="doc-img"
        onerror="this.style.display='none'">
    </div>

    <!-- CENTER -->
    <div class="card-info">

        <h3>{{card.sub_category}}</h3>

        <span class="file-count">
            {{card.total}} Files
        </span>

    </div>

    <!-- RIGHT -->
    <div class="arrow">
        →
    </div>

</div>

{% endfor %}

</div>

</main>

<footer>
{{users|length}} Users Available
</footer>

<script>
// SAFE INITIALS SCRIPT (Runs instantly on load)
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('.fallback-icon').forEach(el => {
        const title = el.getAttribute('data-title').trim();
        const words = title.split(/\s+/);
        let initials = "";

        if (words.length >= 2) {
            initials = words[0].charAt(0) + words[1].charAt(0);
        } else if (words.length === 1 && words[0].length > 0) {
            initials = words[0].substring(0, 2);
        }

        el.innerText = initials.toUpperCase();
    });
});

// THEME LOGIC
const MODE = {{mode}};

function applyMode(mode){
    const r=document.documentElement;

    if(mode=="1"){
        document.body.style.background = "linear-gradient(180deg,#f8fafc,#eef2ff)";
        r.style.setProperty('--bg','#f8fafc');
        r.style.setProperty('--bg-soft','#ffffff');
        r.style.setProperty('--card','#ffffff');
        r.style.setProperty('--card-hover','#f3f6ff');
        r.style.setProperty('--text','#0f172a');
        r.style.setProperty('--muted','#64748b');
        r.style.setProperty('--border','#dbe4f0');
        r.style.setProperty('--primary','#4f46e5');
        r.style.setProperty('--primary-soft','#6366f1');
        document.querySelector("header").style.background = "rgba(255,255,255,.78)";
    }

    if(mode=="2"){
        document.body.style.background = "linear-gradient(180deg,#172033,#1e293b)";
        r.style.setProperty('--bg','#1e293b');
        r.style.setProperty('--bg-soft','#243041');
        r.style.setProperty('--card','#243041');
        r.style.setProperty('--card-hover','#2d3a4f');
        r.style.setProperty('--text','#f8fafc');
        r.style.setProperty('--muted','#c3cedd');
        r.style.setProperty('--border','#334155');
        r.style.setProperty('--primary','#7c83ff');
        r.style.setProperty('--primary-soft','#8b93ff');
        document.querySelector("header").style.background = "rgba(15,23,42,.72)";
    }

    if(mode=="3"){
        document.body.style.background = "linear-gradient(180deg,#020617,#0b1120)";
        r.style.setProperty('--bg','#0b1120');
        r.style.setProperty('--bg-soft','#111827');
        r.style.setProperty('--card','#111827');
        r.style.setProperty('--card-hover','#172033');
        r.style.setProperty('--text','#f3f4f6');
        r.style.setProperty('--muted','#94a3b8');
        r.style.setProperty('--border','#1e293b');
        r.style.setProperty('--primary','#6366f1');
        r.style.setProperty('--primary-soft','#818cf8');
        document.querySelector("header").style.background = "rgba(2,6,23,.78)";
    }
}

applyMode(MODE);
</script>

</body>
</html>
